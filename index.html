ith an ice paddle","A tofu stir fry is covered tightly and placed outside in the winter."],"ans":2,"assigned":true,"wrongPick":0,"ch":6,"tp":"cool","conf":"high","why":"Stirring with an ice paddle is an approved cooling method. Freezers and coolers are not designed to cool hot food quickly, and leaving food outside is not controlled cooling.","kn":"Knowing the approved cooling methods: ice-water bath, ice paddle, blast chiller, or adding ice as an ingredient. Putting hot food in a freezer or cooler alone is the trap.","ansText":"C. Minestrone soup is stirred with an ice paddle","img":false,"web":true},{"id":"MT-23","src":"Mock ServSafe Test","no":"Q23","type":"mc","q":"What is one factor that affects the growth of bacteria in food?","opts":["Ripeness","Density","Acidity","Leanness"],"ans":2,"assigned":false,"ch":2,"tp":"growth","why":"Acidity is the A in FAT TOM; pathogens grow best in food that is neutral to slightly acidic.","kn":"Recalling FAT TOM: food, acidity, temperature, time, oxygen and moisture. Ripeness, density and leanness are not growth conditions.","ansText":"C. Acidity","img":false,"web":true},{"id":"MT-24","src":"Mock ServSafe Test","no":"Q24","type":"mc","q":"Which is true about self-inspections?","opts":["They are unnecessary if the establishment has regulatory inspections.","They can be performed in place of the regulatory inspection.","They should be performed annually.","They should mirror inspections performed by the regulatory authority."],"ans":3,"assigned":false,"ch":8,"tp":"selfinsp","why":"Self-inspections should mirror inspections performed by the regulatory authority.","kn":"Knowing self-inspections mirror regulatory inspections and happen more often. The traps claim they replace regulatory inspections or aren’t needed.","note":"Same question as DT-01.","ansText":"D. They should mirror inspections performed by the regulatory authority.","img":false,"web":true},{"id":"MT-25","src":"Mock ServSafe Test","no":"Q25","type":"mc","q":"Three components of active managerial control include","opts":["identifying risks, record keeping, and training.","identifying risks, creating purchase orders, and training.","identifying risks, creating specifications, and training.","identifying risks, corrective action, and training."],"ans":3,"assigned":true,"wrongPick":2,"ch":8,"tp":"culture","conf":"high","why":"The six steps of active managerial control are identifying risks, monitoring, corrective action, management oversight, training and re-evaluation. Record keeping, purchase orders and specifications are not among them.","kn":"Recalling the steps of active managerial control. Record keeping is a HACCP principle, and purchase orders or specifications are purchasing tasks.","ansText":"D. identifying risks, corrective action, and training.","img":false,"web":true},{"id":"MT-26","src":"Mock ServSafe Test","no":"Q26","type":"mc","q":"What can employees do to reduce the risk of intentional contamination?","opts":["Use disinfectants on surfaces instead of sanitizers","Discard food if cross-contact has occurred","Check the internal temperature of food","Secure all ingredients and supplies"],"ans":3,"assigned":false,"ch":2,"tp":"defense","why":"Securing all ingredients and supplies reduces the risk of intentional contamination (the S in Employees FIRST).","kn":"Linking food defense to securing ingredients and supplies. The traps address pathogens or allergens, not deliberate tampering.","note":"Same question as DT-10.","ansText":"D. Secure all ingredients and supplies","img":false,"web":true},{"id":"MT-27","src":"Mock ServSafe Test","no":"Q27","type":"mc","q":"A recall has been issued for a specific brand of orange juice. The store manager has matched the information from the recall notice to the item, removed the item from inventory, and stored it in a secure location. What should the manager do next?","opts":["Refer to the vendor notification for next steps","Contact the supplier and arrange for the product to be picked up","Inform the local media, customers, and employees of the reason for the recall","Label the item to prevent it from accidently being placed back in inventory"],"ans":3,"assigned":false,"ch":5,"tp":"supplier","why":"After removing and separating a recalled item, label it so it isn’t accidentally put back into inventory or used.","kn":"Knowing the recall steps in order: identify the item, remove it, store it separately, label it, then follow the supplier’s instructions.","note":"Similar to PT-40 and DT-80.","ansText":"D. Label the item to prevent it from accidently being placed back in inventory","img":false,"web":true},{"id":"MT-28","src":"Mock ServSafe Test","no":"Q28","type":"mc","q":"When can a food handler who is vomiting return to work?","opts":["After scheduling an appointment with a physician","When they do not have any other symptoms","When symptom-free for 24 hours","When they say they are feeling better"],"ans":2,"assigned":false,"ch":3,"tp":"illness","why":"A food handler excluded for vomiting may return after being symptom-free for 24 hours (or with a written release from a medical practitioner).","kn":"Recalling the return-to-work rule for vomiting: 24 hours without symptoms. Feeling better or booking a doctor’s appointment doesn’t qualify.","note":"Same question as DT-13.","ansText":"C. When symptom-free for 24 hours","img":false,"web":true},{"id":"MT-29","src":"Mock ServSafe Test","no":"Q29","type":"mc","q":"Why are preschool-age children at a higher risk for getting a foodborne illness?","opts":["They do not receive enough nutrition.","They are more likely to suffer allergic reactions.","They do not have strong appetites.","They have not yet built up their immune systems."],"ans":3,"assigned":false,"ch":1,"tp":"fbi","why":"Preschool-age children have not yet built up strong immune systems, so they are at higher risk.","kn":"Knowing why high-risk groups are at risk: weaker immune systems. Nutrition, appetite and allergies are distractors.","ansText":"D. They have not yet built up their immune systems.","img":false,"web":true},{"id":"MT-30","src":"Mock ServSafe Test","no":"Q30","type":"mc","q":"Peanuts and soy products are two possible food items that can be dangerous for people with","opts":["FAT TOM.","poor personal hygiene.","chemical sensitivity.","food allergies."],"ans":3,"assigned":false,"ch":2,"tp":"allergen","why":"Peanuts and soy are among the Big Nine food allergens.","kn":"Recognizing peanuts and soy as major allergens. FAT TOM is the pathogen-growth acronym from the same chapter, a look-alike term.","ansText":"D. food allergies.","img":false,"web":true},{"id":"MT-31","src":"Mock ServSafe Test","no":"Q31","type":"mc","q":"A stuffed pork chop must be cooked to what internal temperature?","opts":["165°F (74°C) for <1 second","155°F (68°C) for 17 seconds","145°F (63°C) for 15 seconds","145°F (63°C) for 4 minutes"],"ans":0,"assigned":false,"note":"The original question shows three leftover answer lines from another question above the options; they were removed.","ch":6,"tp":"cooktemp","why":"Stuffed meat, including a stuffed pork chop, must be cooked to 165°F (74°C) for <1 second.","kn":"Knowing that stuffed foods go to 165°F even when the meat alone needs less. A plain pork chop would be 145°F for 15 seconds, the trap.","ansText":"A. 165°F (74°C) for <1 second","img":false,"web":true},{"id":"MT-32","src":"Mock ServSafe Test","no":"Q32","type":"mc","q":"What is the definition of sanitizing?","opts":["Removing the amount of dirt on a surface to safe levels","Reducing the pathogens on a surface to safe levels","Washing a surface to a clean level","Using a cloth on a surface until it is clean"],"ans":1,"assigned":false,"ch":10,"tp":"agents","why":"Sanitizing reduces the pathogens on a surface to safe levels; cleaning removes dirt and food.","kn":"Distinguishing sanitizing (pathogens to safe levels) from cleaning (removing dirt). Option A mixes the two definitions.","ansText":"B. Reducing the pathogens on a surface to safe levels","img":false,"web":true},{"id":"MT-33","src":"Mock ServSafe Test","no":"Q33","type":"mc","q":"Outdoor garbage containers must be","opts":["washed frequently.","kept away from customer parking areas.","lined with plastic or wet-strength paper.","kept covered with tight-fitting lids."],"ans":3,"assigned":true,"wrongPick":1,"ch":9,"tp":"utilities","conf":"high","why":"Outdoor garbage containers must have tight-fitting lids and be kept covered. DT-74 asks the same thing and its key is “kept covered at all times.”","kn":"Recalling the rules for outdoor garbage containers: tight-fitting lids, kept covered, on a smooth, durable surface. Distance from customer parking is not a requirement.","note":"Similar to DT-74.","ansText":"D. kept covered with tight-fitting lids.","img":false,"web":true},{"id":"MT-34","src":"Mock ServSafe Test","no":"Q34","type":"mc","q":"Domoic acid is a toxin found in shellfish from the Pacific Northwest and causes which illness?","opts":["Ciguatera fish poisoning","Amnesic shellfish poisoning (ASP)","Scrombroid poisoning","Paralytic shellfish poisoning (PSP)"],"ans":1,"assigned":true,"wrongPick":3,"ch":2,"tp":"toxins","conf":"high","why":"Domoic acid causes amnesic shellfish poisoning (ASP). Paralytic shellfish poisoning (PSP) is caused by a different toxin (saxitoxin).","kn":"Matching shellfish toxins to illnesses: domoic acid causes amnesic shellfish poisoning. PSP is the close look-alike; ciguatera and scombroid poisoning come from finfish.","ansText":"B. Amnesic shellfish poisoning (ASP)","img":false,"web":true},{"id":"MT-35","src":"Mock ServSafe Test","no":"Q35","type":"mc","q":"A cook must check the internal temperature of a chicken breast. Where should they insert the thermometer probe?","opts":["On the top of the chicken breast","On the bottom of the chicken breast","In the thinnest part of the chicken breast","In the thickest part of the chicken breast"],"ans":3,"assigned":false,"ch":4,"tp":"thermo","why":"Check the temperature in the thickest part of the food, usually the center.","kn":"Knowing to check temperature in the thickest part. Thin parts and surfaces heat faster and give a misleading reading.","note":"Same question as DT-35 and KH-23.","ansText":"D. In the thickest part of the chicken breast","img":false,"web":true},{"id":"MT-36","src":"Mock ServSafe Test","no":"Q36","type":"mc","q":"Which is a TCS food?","opts":["Crackers","Coffee","Sprouts","Bananas"],"ans":2,"assigned":false,"ch":1,"tp":"tcs","why":"Sprouts are TCS food.","kn":"Recognizing TCS foods, including sprouts. Crackers, coffee and whole bananas don’t need time and temperature control.","ansText":"C. Sprouts","img":false,"web":true},{"id":"MT-37","src":"Mock ServSafe Test","no":"Q37","type":"mc","q":"What is a cross-connection?","opts":["Threaded faucet","Device that prevents a vacuum","Physical link between sources of safe and dirty water","Brass valve that mixes hot and cold water"],"ans":2,"assigned":false,"ch":9,"tp":"plumbing","why":"A cross-connection is a physical link between safe water and dirty water.","kn":"Defining a cross-connection. A device that prevents a vacuum (a vacuum breaker) is the look-alike: it prevents backflow rather than causing it.","note":"Similar to SSM9E Activity Quiz 9, Building Systems.","ansText":"C. Physical link between sources of safe and dirty water","img":false,"web":true},{"id":"MT-38","src":"Mock ServSafe Test","no":"Q38","type":"mc","q":"How long must shellstock tags be kept on file?","opts":["90 days after the last shellfish was sold or served from the container","30 days after the last shellfish was sold or served from the container","30 days after the day the shellfish were received"],"ans":0,"assigned":true,"wrongPick":1,"ch":5,"tp":"recvpack","conf":"high","why":"Shellstock tags must be kept for 90 days from the date the last shellfish was sold or served from the container. PT-38 also keys 90 days.","kn":"Recalling both parts of the tag rule: 90 days, counted from when the last shellfish in the container was used, not from receiving.","note":"Similar to PT-38.","ansText":"A. 90 days after the last shellfish was sold or served from the container","img":false,"web":true},{"id":"MT-39","src":"Mock ServSafe Test","no":"Q39","type":"mc","q":"How often must you check the temperature of hot food that is being held with temperature control?","opts":["At least every 8 hours","At least every 4 hours","At least every 6 hours","At least every 2 hours"],"ans":1,"assigned":false,"ch":7,"tp":"hold","why":"Check the temperature of held food at least every four hours.","kn":"Recalling the four-hour minimum for checking held food. Two hours is a recommended practice, not the minimum.","note":"Similar to PT-25.","ansText":"B. At least every 4 hours","img":false,"web":true},{"id":"MT-40","src":"Mock ServSafe Test","no":"Q40","type":"mc","q":"A catering employee removed a tray of lasagna from hot-holding for service in a hotel conference room at 11:00 am. By what time must the lasagna be thrown out?","opts":["3:00 p.m.","2:00 p.m.","12:00 p.m.","4:00 p.m."],"ans":0,"assigned":false,"ch":7,"tp":"hold","why":"Hot food removed from temperature control must be sold, served or thrown out within 4 hours: 11:00 a.m. plus 4 hours is 3:00 p.m.","kn":"Applying the 4-hour limit for holding hot food without temperature control. 2:00 p.m. and 12:00 p.m. use the wrong limit, and 4:00 p.m. is 5 hours.","ansText":"A. 3:00 p.m.","img":false,"web":true},{"id":"MT-41","src":"Mock ServSafe Test","no":"Q41","type":"mc","q":"A handwashing station should have a garbage container, hot and cold water, signage, a way to dry hands, and","opts":["gloves.","a timer.","a clock.","soap."],"ans":3,"assigned":false,"ch":9,"tp":"hwstation","why":"Handwashing stations need running water, soap, a way to dry hands, a garbage container and signage.","kn":"Recalling the handwashing-station checklist. Gloves, timers and clocks are not required items.","ansText":"D. soap.","img":false,"web":true},{"id":"MT-42","src":"Mock ServSafe Test","no":"Q42","type":"mc","q":"A customer returns a carryout container to a restaurant to be refilled with food. It looks clean, but they will not refill it. Is the restaurant correct to refuse?","opts":["No, because the container was made to hold food.","No, because the container can be refilled for personal consumption.","Yes, because the container is a single-service container that is not designed to be refilled.","Yes, because the container may not have been appropriately cleaned and sanitized."],"ans":2,"assigned":true,"wrongPick":3,"ch":7,"tp":"serve","conf":"high","why":"Single-service containers are not designed to be reused, so they cannot be refilled. DT-09 asks the same question and its key is the single-service answer.","kn":"Knowing single-service containers can never be refilled, however clean they look. The trap gives a sensible-sounding reason (it may not be sanitized) that isn’t the rule.","note":"Same question as DT-09.","ansText":"C. Yes, because the container is a single-service container that is not designed to be refilled.","img":false,"web":true},{"id":"MT-43","src":"Mock ServSafe Test","no":"Q43","type":"mc","q":"Where should staff members eat, drink, smoke, or chew gum?","opts":["Designated areas","Where customers cannot see them","Dishwashing areas","Outside of the kitchen door"],"ans":0,"assigned":false,"ch":3,"tp":"attire","why":"Staff may eat, drink, smoke or chew gum only in designated areas away from food prep and service.","kn":"Knowing where personal habits belong: designated areas. Out of customers’ sight or just outside the kitchen door doesn’t protect food.","ansText":"A. Designated areas","img":false,"web":true},{"id":"MT-44","src":"Mock ServSafe Test","no":"Q44","type":"mc","q":"What step must managers take after creating a master cleaning schedule and training staff to use it?","opts":["Determine who should do each task","Determine what should be cleaned","Time staff on how long they take to clean","Monitor the cleaning program"],"ans":3,"assigned":false,"ch":10,"tp":"program","why":"After creating the master cleaning schedule and training staff, managers monitor the cleaning program to keep it working.","kn":"Knowing the order for a cleaning program: create the schedule, train staff, then monitor. Deciding the tasks and who does them happens earlier.","note":"Similar to DT-61, which asks the step before this one (training).","ansText":"D. Monitor the cleaning program","img":false,"web":true},{"id":"MT-45","src":"Mock ServSafe Test","no":"Q45","type":"mc","q":"A food handler who has just bused tables must do what before handling food?","opts":["Change apron","Wash hands","Put disposable gloves back on","Wipe hands on a cloth towel"],"ans":1,"assigned":false,"ch":3,"tp":"handwash","why":"After busing tables, hands must be washed before handling food.","kn":"Recognizing busing dirty tableware as a reason to wash hands. Changing gloves, an apron or wiping hands on a towel does not replace handwashing.","ansText":"B. Wash hands","img":false,"web":true},{"id":"MT-46","src":"Mock ServSafe Test","no":"Q46","type":"mc","q":"A lamb roast must be cooked to an internal temperature of","opts":["145°F (63°C) for 4 minutes","155°F (68°C) for 17 seconds","145°F (63°C) for 15 seconds","135°F (57°C) with no minimum time"],"ans":0,"assigned":true,"wrongPick":2,"ch":6,"tp":"cooktemp","conf":"high","why":"Roasts of beef, pork, veal and lamb must be cooked to 145°F (63°C) for 4 minutes.","kn":"Separating roasts (145°F for 4 minutes) from steaks and chops (145°F for 15 seconds), which is the trap the test-taker fell for.","ansText":"A. 145°F (63°C) for 4 minutes","img":false,"web":true},{"id":"MT-47","src":"Mock ServSafe Test","no":"Q47","type":"mc","q":"A food handler is prepping 4 different flavors of quiches using pooled eggs. For each batch, they crack the eggs into a large mixing bowl, add the other ingredients then empty the bowl into premade crusts. How often should the food handler clean and sanitize the mixing bowl?","opts":["Every 4 hours","Every time the bowl is emptied.","Every 6 hours","After all of the quiches are prepped."],"ans":1,"assigned":false,"ch":10,"tp":"howclean","why":"Containers used for pooled eggs must be washed, rinsed and sanitized before each new batch.","kn":"Applying when-to-clean rules to pooled eggs: before every new batch. Time-based rules like every 4 hours apply to items in constant use, not batch containers.","ansText":"B. Every time the bowl is emptied.","img":false,"web":true},{"id":"MT-48","src":"Mock ServSafe Test","no":"Q48","type":"mc","q":"Which TCS food has been cooled correctly?","opts":["Barbeque jackfruit cooled from 135°F to 70°F (57°C to 21°C) in three hours and then from 70°F to 41°F (21°C to 5°C) in two hours","Corn chowder cooled from 135°F to 70°F (57°C to 21°C) in one hour and then from 70°F to 41°F (21°C to 5°C) in five hours","Beef brisket cooled from 135°F to 70°F (57°C to 21°C) in two hours and then from 70°F to 41°F (21°C to 5°C) in six hours","Oyster stuffing cooled from 135°F to 70°F (57°C to 21°C) in one hour and then from 70°F to 41°F (21°C to 5°C) in four hours"],"ans":1,"assigned":true,"wrongPick":3,"ch":6,"tp":"cool","conf":"medium","why":"Two-stage cooling allows 2 hours to reach 70°F (21°C) and 6 hours in total. The corn chowder took 1 hour, then 5 hours: 6 hours in total.","kn":"Applying two-stage cooling: 2 hours or less to reach 70°F, 6 hours or less in total. When the first stage finishes early, the leftover time carries into the second stage.","note":"As written, option D (1 hour, then 4 hours) also meets the rule. The attempt marked D wrong, so the quiz’s intended answer is B, which uses the full 6 hours.","ansText":"B. Corn chowder cooled from 135°F to 70°F (57°C to 21°C) in one hour and then from 70°F to 41°F (21°C to 5°C) in five hours","img":false,"web":true},{"id":"MT-49","src":"Mock ServSafe Test","no":"Q49","type":"mc","q":"Cut melons should be stored at what internal temperature?","opts":["51°F (11°C) or lower","45°F (7°C) or lower","41°F (5°C) or lower","55°F (13°C) or lower"],"ans":2,"assigned":false,"ch":5,"tp":"storage","why":"Cut melons are TCS food and must be held at 41°F (5°C) or lower.","kn":"Knowing cut melons are TCS and stay at 41°F or lower. 45°F is a receiving exception for milk and shell eggs, not a storage temperature.","ansText":"C. 41°F (5°C) or lower","img":false,"web":true},{"id":"MT-50","src":"Mock ServSafe Test","no":"Q50","type":"mc","q":"What is the maximum amount of time that ready-to-eat TCS food can be stored in a cooler at 41°F (5°C) before it must be sold, served, or thrown out?","opts":["5 days","9 days","2 days","7 days"],"ans":3,"assigned":false,"ch":5,"tp":"label","why":"Ready-to-eat TCS food held at 41°F (5°C) or lower may be kept for up to 7 days.","kn":"Recalling the 7-day storage limit for ready-to-eat TCS food held at 41°F.","ansText":"D. 7 days","img":false,"web":true},{"id":"RD-003","src":"Review Slide Deck","no":"Slide 3","ch":1,"tp":"unsafe","type":"mc","q":"Is it okay for a foodservice operation to use food prepared in a private home?","assigned":false,"why":"Food prepared in a private home is considered to be from an unsafe source and must be avoided.","kn":"Knowing that food must come from approved sources. Home-prepared food counts as an unsafe source however carefully it was made.","img":false,"web":true,"opts":["Yes","No"],"ans":1,"ansText":"B. No"},{"id":"RD-004","src":"Review Slide Deck","no":"Slide 4","ch":1,"tp":"unsafe","type":"mc","q":"What is the problem shown in the picture? (The slide’s picture isn’t in the file.)","assigned":true,"why":"The four practices that make food unsafe are time-temperature abuse, cross-contamination, poor personal hygiene, and poor cleaning and sanitizing; which one applies depends on the picture.","kn":"Recognizing which of the four practices that make food unsafe is happening in a situation.","img":true,"web":false,"conf":"low","opts":["Time-temperature abuse","Cross-contamination","Poor personal hygiene","Poor cleaning and sanitizing"],"ans":null,"ansText":"Can’t be determined: the slide’s picture isn’t in the file"},{"id":"RD-005","src":"Review Slide Deck","no":"Slide 5","ch":1,"tp":"unsafe","type":"mc","q":"What is the problem shown in the picture? (The slide’s picture isn’t in the file.)","assigned":true,"why":"The four practices that make food unsafe are time-temperature abuse, cross-contamination, poor personal hygiene, and poor cleaning and sanitizing; which one applies depends on the picture.","kn":"Recognizing which of the four practices that make food unsafe is happening in a situation.","img":true,"web":false,"conf":"low","opts":["Time-temperature abuse","Cross-contamination","Poor personal hygiene","Poor cleaning and sanitizing"],"ans":null,"ansText":"Can’t be determined: the slide’s picture isn’t in the file"},{"id":"RD-006","src":"Review Slide Deck","no":"Slide 6","ch":1,"tp":"unsafe","type":"mc","q":"Between uses, a food handler just wipes the prep table with a single-use towel. What is the problem?","assigned":true,"why":"Wiping is not cleaning and sanitizing: a food-contact surface must be cleaned, rinsed, and sanitized between uses, so this is poor cleaning and sanitizing.","kn":"Telling poor cleaning and sanitizing apart from cross-contamination: the fault here is the missing clean-and-sanitize step, not raw food touching ready-to-eat food.","img":true,"web":true,"conf":"medium","opts":["Time-temperature abuse","Cross-contamination","Poor personal hygiene","Poor cleaning and sanitizing"],"ans":3,"ansText":"D. Poor cleaning and sanitizing"},{"id":"RD-007","src":"Review Slide Deck","no":"Slide 7","ch":1,"tp":"tcs","type":"mc","q":"Does cut lettuce need time and temperature control to keep it safe?","assigned":true,"why":"Cut leafy greens are TCS food and must be held at 41°F (5°C) or lower.","kn":"Knowing that cutting changes some produce into TCS food: whole lettuce doesn’t need temperature control, but cut leafy greens do.","img":false,"web":true,"conf":"high","opts":["Yes","No"],"ans":0,"ansText":"A. Yes"},{"id":"RD-009","src":"Review Slide Deck","no":"Slide 9","ch":2,"tp":"big6","type":"list","q":"Name the Big Six pathogens.","assigned":false,"why":"These six pathogens are highly contagious and can cause severe illness, so the FDA singles them out.","kn":"Recalling all six Big Six pathogens by name, including both kinds of Salmonella (Typhi and nontyphoidal).","img":false,"web":true,"ansList":["Shigella spp.","Salmonella Typhi","Nontyphoidal Salmonella","Shiga toxin-producing Escherichia coli (STEC)","Hepatitis A","Norovirus"],"ansText":"Shigella spp.; Salmonella Typhi; Nontyphoidal Salmonella; Shiga toxin-producing Escherichia coli (STEC); Hepatitis A; Norovirus"},{"id":"RD-010","src":"Review Slide Deck","no":"Slide 10","ch":2,"tp":"growth","type":"list","q":"Name the six conditions bacteria need to grow (FAT TOM).","assigned":false,"why":"FAT TOM is the memory aid for the six conditions: food, acidity, temperature, time, oxygen, and moisture.","kn":"Recalling FAT TOM and what each letter stands for.","img":false,"web":true,"ansList":["Food","Acidity","Temperature","Time","Oxygen","Moisture"],"ansText":"Food; Acidity; Temperature; Time; Oxygen; Moisture"},{"id":"RD-011","src":"Review Slide Deck","no":"Slide 11","ch":2,"tp":"growth","type":"fill","q":"At what temperatures do bacteria grow most rapidly?","assigned":false,"why":"Bacteria grow in the temperature danger zone, 41°F to 135°F (5°C to 57°C), and fastest between 70°F and 125°F (21°C and 52°C).","kn":"Separating the full temperature danger zone (41–135°F) from the narrower range where growth is fastest (70–125°F).","img":false,"web":true,"ansText":"70°F to 125°F (21°C to 52°C), the middle of the temperature danger zone (41°F to 135°F / 5°C to 57°C)","mcq":{"q":"At what temperatures do bacteria grow most rapidly?","opts":["41°F to 135°F (5°C to 57°C)","0°F to 41°F (−18°C to 5°C)","70°F to 125°F (21°C to 52°C)","135°F to 165°F (57°C to 74°C)"],"ans":2}},{"id":"RD-012","src":"Review Slide Deck","no":"Slide 12","ch":2,"tp":"growth","type":"mc","q":"Bacteria grow best in food with which pH?","assigned":false,"why":"Bacteria grow best in food that is neutral to slightly acidic; a pH of 7 is neutral.","kn":"Knowing that bacteria prefer neutral to slightly acidic food, not strongly acidic (pH 0) or strongly alkaline (pH 14) food.","img":false,"web":true,"opts":["0","7","14"],"ans":1,"ansText":"B. 7"},{"id":"RD-014","src":"Review Slide Deck","no":"Slide 14","ch":2,"tp":"big6","type":"fill","q":"Who am I? I can be transferred to food or equipment by food handlers with feces on their fingers. People become contagious within a few hours of eating me. I am often linked with ready-to-eat food. Excluding staff with diarrhea and vomiting can prevent me from causing further illness.","assigned":false,"why":"The slide names the answer.","kn":"Tying the clues (fast contagiousness, ready-to-eat food, exclusion for vomiting and diarrhea) to norovirus rather than hepatitis A.","img":false,"web":true,"ansText":"Norovirus","mcq":{"q":"Which pathogen is described? “I can be transferred to food or equipment by food handlers with feces on their fingers. People become contagious within a few hours of eating me. I am often linked with ready-to-eat food. Excluding staff with diarrhea and vomiting can prevent me from causing further illness.”","opts":["Hepatitis A","Norovirus","Shigella spp.","Salmonella Typhi"],"ans":1}},{"id":"RD-015","src":"Review Slide Deck","no":"Slide 15","ch":2,"tp":"big6","type":"fill","q":"Who am I? I live in a person’s bloodstream and intestines. I am commonly linked with ready-to-eat food and beverages. I am in a person’s feces for weeks after symptoms have ended. Washing hands and cooking food to required minimum internal temperatures can prevent me. I only live in humans.","assigned":false,"why":"The slide names the answer.","kn":"Recognizing Salmonella Typhi by “only lives in humans” and its link to beverages, which separate it from nontyphoidal Salmonella carried by farm animals.","img":false,"web":true,"ansText":"Salmonella Typhi","mcq":{"q":"Which pathogen is described? “I live in a person’s bloodstream and intestines. I am commonly linked with ready-to-eat food and beverages. I am in a person’s feces for weeks after symptoms have ended. Washing hands and cooking food to required minimum internal temperatures can prevent me. I only live in humans.”","opts":["Nontyphoidal Salmonella","Shigella spp.","Salmonella Typhi","Hepatitis A"],"ans":2}},{"id":"RD-016","src":"Review Slide Deck","no":"Slide 16","ch":2,"tp":"big6","type":"fill","q":"Who am I? I am found in the feces of people I have infected. Flies can transfer me. I am linked with food easily contaminated by hands. Washing hands can prevent me.","assigned":false,"why":"The slide names the answer.","kn":"Linking flies and hand-contaminated food to Shigella spp.","img":false,"web":true,"ansText":"Shigella spp.","mcq":{"q":"Which pathogen is described? “I am found in the feces of people I have infected. Flies can transfer me. I am linked with food easily contaminated by hands. Washing hands can prevent me.”","opts":["Shigella spp.","Norovirus","Salmonella Typhi","Shiga toxin-producing E. coli (STEC)"],"ans":0}},{"id":"RD-017","src":"Review Slide Deck","no":"Slide 17","ch":2,"tp":"big6","type":"fill","q":"Who am I? I am often linked with ready-to-eat food. I’m often transferred to food by food handlers who have feces on their fingers. Excluding staff with jaundice can prevent me from causing illness. Normal cooking temperatures do not destroy me. I may not show symptoms for weeks but may still be infectious.","assigned":false,"why":"The slide names the answer.","kn":"Spotting hepatitis A by jaundice and the fact that normal cooking doesn’t destroy it, which separate it from norovirus.","img":false,"web":true,"ansText":"Hepatitis A","mcq":{"q":"Which pathogen is described? “I am often linked with ready-to-eat food. I’m often transferred to food by food handlers who have feces on their fingers. Excluding staff with jaundice can prevent me from causing illness. Normal cooking temperatures do not destroy me. I may not show symptoms for weeks but may still be infectious.”","opts":["Norovirus","Salmonella Typhi","Shigella spp.","Hepatitis A"],"ans":3}},{"id":"RD-018","src":"Review Slide Deck","no":"Slide 18","ch":2,"tp":"big6","type":"fill","q":"Who am I? I can be found in the intestines of cattle. I produce toxins in a person’s intestines, which cause illness. I am found in raw ground beef and contaminated produce. Cooking ground beef to required minimum internal temperatures can prevent me.","assigned":false,"why":"The slide names the answer.","kn":"Linking cattle, ground beef and contaminated produce to Shiga toxin-producing E. coli.","img":false,"web":true,"ansText":"Shiga toxin-producing E. coli (STEC)","mcq":{"q":"Which pathogen is described? “I can be found in the intestines of cattle. I produce toxins in a person’s intestines, which cause illness. I am found in raw ground beef and contaminated produce. Cooking ground beef to required minimum internal temperatures can prevent me.”","opts":["Nontyphoidal Salmonella","Shiga toxin-producing E. coli (STEC)","Shigella spp.","Hepatitis A"],"ans":1}},{"id":"RD-019","src":"Review Slide Deck","no":"Slide 19","ch":2,"tp":"big6","type":"fill","q":"Who am I? Many farm animals carry me naturally. The severity of a person’s symptoms depends on how much of me is eaten. I’ve been found in tomatoes, peppers, and cantaloupes. Cooking poultry or eggs to the right temperature can prevent me from causing illness.","assigned":false,"why":"The slide names the answer.","kn":"Recognizing nontyphoidal Salmonella by farm animals, poultry and eggs, as opposed to Salmonella Typhi, which lives only in humans.","img":false,"web":true,"ansText":"Nontyphoidal Salmonella","mcq":{"q":"Which pathogen is described? “Many farm animals carry me naturally. The severity of a person’s symptoms depends on how much of me is eaten. I’ve been found in tomatoes, peppers, and cantaloupes. Cooking poultry or eggs to the right temperature can prevent me from causing illness.”","opts":["Salmonella Typhi","Shiga toxin-producing E. coli (STEC)","Nontyphoidal Salmonella","Norovirus"],"ans":2}},{"id":"RD-020","src":"Review Slide Deck","no":"Slide 20","ch":2,"tp":"toxins","type":"fill","q":"Who am I? I am a seafood toxin. I am produced by pathogens found on certain fish. You can find me on tuna, bonito, and mahi-mahi. I am produced when fish is time-temperature abused.","assigned":false,"why":"The slide names the answer.","kn":"Linking tuna, bonito and mahi-mahi plus time-temperature abuse to histamine, versus ciguatera, which comes from the fish’s diet.","img":false,"web":true,"ansText":"Histamine (scombroid poisoning)","mcq":{"q":"Which seafood toxin is described? “I am produced by pathogens found on certain fish. You can find me on tuna, bonito, and mahi-mahi. I am produced when fish is time-temperature abused.”","opts":["Ciguatera toxin","Histamine (scombroid poisoning)","Saxitoxin (paralytic shellfish poisoning)","Domoic acid (amnesic shellfish poisoning)"],"ans":1}},{"id":"RD-021","src":"Review Slide Deck","no":"Slide 21","ch":2,"tp":"toxins","type":"fill","q":"Who am I? I am a seafood toxin. I occur in certain fish that eat smaller fish that have consumed the toxin. You can find me in barracuda, snapper, grouper, and amberjack.","assigned":false,"why":"The slide names the answer.","kn":"Linking predatory reef fish (barracuda, snapper, grouper, amberjack) to ciguatera toxin, which builds up through the food chain rather than from time-temperature abuse.","img":false,"web":true,"ansText":"Ciguatera toxin","mcq":{"q":"Which seafood toxin is described? “I occur in certain fish that eat smaller fish that have consumed the toxin. You can find me in barracuda, snapper, grouper, and amberjack.”","opts":["Histamine (scombroid poisoning)","Saxitoxin (paralytic shellfish poisoning)","Ciguatera toxin","Domoic acid (amnesic shellfish poisoning)"],"ans":2}},{"id":"RD-022","src":"Review Slide Deck","no":"Slide 22","ch":2,"tp":"toxins","type":"mc","q":"What is the onset time for an illness from a biological toxin?","assigned":true,"why":"Illness from biological toxins (such as seafood toxins) usually starts within minutes of eating the food, though it varies by toxin.","kn":"Knowing that toxin illnesses start fast, usually within minutes, unlike many bacterial and viral illnesses that take hours or days.","img":false,"web":true,"conf":"medium","opts":["Within a few minutes","Within a few hours","6–12 hours","24 hours"],"ans":0,"ansText":"A. Within a few minutes"},{"id":"RD-023","src":"Review Slide Deck","no":"Slide 23","ch":2,"tp":"toxins","type":"multi","q":"Which symptoms are associated with illness from a biological toxin? Select all that apply.","assigned":true,"why":"Depending on the toxin, symptoms can include vomiting or diarrhea, neurological symptoms (such as tingling), flushing, hives, difficulty breathing, and heart palpitations.","kn":"Knowing the range of toxin symptoms, especially the neurological ones and flushing or hives, which aren’t typical of other foodborne illnesses.","img":false,"web":true,"conf":"medium","note":"The slide lists the options without saying which are correct; all four are recognized symptoms.","opts":["Vomiting and diarrhea","Neurological symptoms","Flushing, hives, and difficulty breathing","Heart palpitations"],"ans":[0,1,2,3],"ansText":"A, B, C, D: Vomiting and diarrhea; Neurological symptoms; Flushing, hives, and difficulty breathing; Heart palpitations","mcq":{"q":"Which of these is NOT a symptom associated with illness from a biological toxin?","opts":["Neurological symptoms such as tingling","Jaundice (yellowing of the skin and eyes)","Flushing, hives, and difficulty breathing","Heart palpitations"],"ans":1}},{"id":"RD-024","src":"Review Slide Deck","no":"Slide 24","ch":2,"tp":"defense","type":"list","q":"What does the FDA food defense acronym “Employees FIRST” stand for?","assigned":false,"why":"FIRST is the FDA’s reminder of what employees do to prevent deliberate contamination.","kn":"Recalling each FIRST step. The trap is treating R as “rotate” stock; it means Recognize anything out of the ordinary.","img":false,"web":true,"ansList":["F: Follow company food defense plan and procedures","I: Inspect your work area and surrounding areas","R: Recognize anything out of the ordinary","S: Secure all ingredients, supplies, and finished product","T: Tell management if you notice anything unusual or suspicious"],"ansText":"F: Follow company food defense plan and procedures; I: Inspect your work area and surrounding areas; R: Recognize anything out of the ordinary; S: Secure all ingredients, supplies, and finished product; T: Tell management if you notice anything unusual or suspicious"},{"id":"RD-025","src":"Review Slide Deck","no":"Slide 25","ch":2,"tp":"outbreak","type":"list","q":"What are the seven steps for responding to a foodborne-illness outbreak?","assigned":false,"why":"These steps help the operation work with the regulatory authority and stop more people from getting sick.","kn":"Recalling the outbreak-response steps in order, from gathering information through reviewing procedures.","img":false,"web":true,"ansList":["Gather information","Notify authorities","Segregate product","Document the information","Identify staff","Cooperate with authorities","Review procedures"],"ansText":"Gather information; Notify authorities; Segregate product; Document the information; Identify staff; Cooperate with authorities; Review procedures"},{"id":"RD-026","src":"Review Slide Deck","no":"Slide 26","ch":2,"tp":"allergen","type":"list","q":"Name the Big Nine food allergens.","assigned":false,"why":"These nine foods cause most food allergies; sesame is the newest addition.","kn":"Recalling all nine major allergens, including sesame, and knowing that crustacean shellfish (not mollusks like clams) is the listed shellfish group.","img":false,"web":true,"ansList":["Milk","Soybeans (soy)","Eggs","Wheat","Fish, such as tuna and cod","Crustacean shellfish, such as crab, lobster, and shrimp","Peanuts","Tree nuts, such as almonds and pine nuts","Sesame"],"ansText":"Milk; Soybeans (soy); Eggs; Wheat; Fish, such as tuna and cod; Crustacean shellfish, such as crab, lobster, and shrimp; Peanuts; Tree nuts, such as almonds and pine nuts; Sesame"},{"id":"RD-028","src":"Review Slide Deck","no":"Slide 28","ch":3,"tp":"handwash","type":"mc","q":"Which sink can be used for handwashing?","assigned":false,"why":"Hands must only be washed in a sink designated for handwashing.","kn":"Knowing that only a designated handwashing sink is allowed; prep, dishwashing and utility sinks are all off-limits for handwashing.","img":false,"web":true,"opts":["Food prep sink","Three-compartment sink","Utility sink","None of these"],"ans":3,"ansText":"D. None of these"},{"id":"RD-029","src":"Review Slide Deck","no":"Slide 29","ch":3,"tp":"handwash","type":"mc","q":"What should the temperature of the water be when you first wet your hands and when you rinse the soap off?","assigned":true,"why":"ServSafe’s handwashing steps (9th edition) say to wet and rinse hands and arms with warm running water.","kn":"Recalling the handwashing steps: warm running water to wet and rinse, not the extremes.","img":false,"web":true,"conf":"high","opts":["Cold","Warm","As cold as you can stand","As hot as you can stand"],"ans":1,"ansText":"B. Warm"},{"id":"RD-030","src":"Review Slide Deck","no":"Slide 30","ch":3,"tp":"handwash","type":"mc","q":"What should you do if you see food handlers touch food with dirty hands?","assigned":false,"why":"The food may be contaminated and must be thrown out.","kn":"Knowing the corrective action for food touched with dirty hands: throw it out. Cooking or freezing doesn’t make it safe.","img":false,"web":true,"opts":["Throw it out.","Cook it to 165°F (74°C) or higher.","Freeze it."],"ans":0,"ansText":"A. Throw it out."},{"id":"RD-031","src":"Review Slide Deck","no":"Slide 31","ch":3,"tp":"handwash","type":"mc","q":"Do you need to file ragged fingernails?","assigned":false,"why":"Ragged nails are hard to keep clean, can hold pathogens, and can break off into food.","kn":"Knowing the hand-care rule: nails must be short, filed and clean, because ragged nails hold pathogens and can become physical contaminants.","img":false,"web":true,"opts":["Yes","No"],"ans":0,"ansText":"A. Yes"},{"id":"RD-032","src":"Review Slide Deck","no":"Slide 32","ch":3,"tp":"gloves","type":"mc","q":"Do you need to rewash your hands each time you change gloves if you are performing the same task?","assigned":false,"why":"It is not necessary as long as the same task is being performed and hands have not become contaminated.","kn":"Knowing when handwashing is needed with glove changes: not between gloves for the same task, but yes before starting a new task or after contamination.","img":false,"web":true,"opts":["Yes","No"],"ans":1,"ansText":"B. No"},{"id":"RD-033","src":"Review Slide Deck","no":"Slide 33","ch":3,"tp":"gloves","type":"mc","q":"Do you need to wear gloves when adding cheese to a pizza (that will then be baked)?","assigned":false,"why":"Ready-to-eat food can be handled with bare hands if it is an ingredient in a dish that contains no raw meat, seafood, or poultry and will be cooked to at least 145°F (63°C).","kn":"Applying the exception to the no-bare-hand rule: RTE ingredients going into a dish that will be cooked to at least 145°F can be touched with bare hands.","img":false,"web":true,"opts":["Yes","No"],"ans":1,"ansText":"B. No"},{"id":"RD-034","src":"Review Slide Deck","no":"Slide 34","ch":3,"tp":"gloves","type":"mc","q":"Do you need to wear gloves when adding salt and pepper to raw duck breasts?","assigned":false,"why":"Salt and pepper are ready-to-eat foods, and RTE food can be handled with bare hands if it is an ingredient in a dish cooked to the correct minimum internal temperature.","kn":"Applying the same exception: seasonings are RTE, but the duck will be cooked, so bare hands are allowed.","img":false,"web":true,"opts":["Yes","No"],"ans":1,"ansText":"B. No"},{"id":"RD-035","src":"Review Slide Deck","no":"Slide 35","ch":3,"tp":"attire","type":"mc","q":"Would it be okay to wear a hair tie decorated with crystal beads and rhinestones when preparing food?","assigned":false,"why":"Food handlers cannot wear hair accessories that could become physical contaminants.","kn":"Knowing that decorative hair accessories are banned because they can fall into food as physical contaminants.","img":false,"web":true,"opts":["Yes","No"],"ans":1,"ansText":"B. No"},{"id":"RD-036","src":"Review Slide Deck","no":"Slide 36","ch":3,"tp":"attire","type":"mc","q":"A food handler is wearing a clean hat and a beard restraint. Is this food handler ready to prepare food?","assigned":false,"why":"He’s wearing a clean hat and a beard restraint; food handlers with facial hair should also wear a beard restraint.","kn":"Knowing that hair restraints include beard restraints for facial hair.","img":true,"web":true,"opts":["Yes","No"],"ans":0,"ansText":"A. Yes"},{"id":"RD-037","src":"Review Slide Deck","no":"Slide 37","ch":3,"tp":"illness","type":"mc","q":"Does a chef need to tell you if they have been diagnosed with an illness from Shigella spp.?","assigned":true,"why":"Food handlers must report a diagnosis of an illness caused by any of the Big Six pathogens, including Shigella spp., to the manager.","kn":"Knowing that a Big Six diagnosis must always be reported to the manager.","img":false,"web":true,"conf":"high","opts":["Yes","No"],"ans":0,"ansText":"A. Yes"},{"id":"RD-038","src":"Review Slide Deck","no":"Slide 38","ch":3,"tp":"illness","type":"mc","q":"Does a cook need to tell you if they live with someone diagnosed with hepatitis A?","assigned":true,"why":"Food handlers must tell the manager if they have been exposed to, or live with someone diagnosed with, an illness caused by a Big Six pathogen such as hepatitis A.","kn":"Knowing that exposure counts too: living with someone diagnosed with a Big Six illness must be reported, even if the cook feels fine.","img":false,"web":true,"conf":"high","opts":["Yes","No"],"ans":0,"ansText":"A. Yes"},{"id":"RD-039","src":"Review Slide Deck","no":"Slide 39","ch":3,"tp":"illness","type":"mc","q":"Do you have to report a food handler diagnosed with norovirus to the health department?","assigned":true,"why":"Managers must notify the regulatory authority when a food handler is diagnosed with an illness caused by a Big Six pathogen, such as norovirus.","kn":"Knowing which cases go beyond the manager to the regulatory authority: Big Six diagnoses (and jaundice) must be reported.","img":false,"web":true,"conf":"high","opts":["Yes","No"],"ans":0,"ansText":"A. Yes"},{"id":"RD-041","src":"Review Slide Deck","no":"Slide 41","ch":3,"tp":"illness","type":"mc","q":"A food handler has an infected wound that is not covered properly. Restrict or exclude?","assigned":true,"why":"A food handler with an infected wound or boil that isn’t properly covered must be restricted from working with exposed food, utensils, and equipment.","kn":"Knowing that an uncovered infected wound calls for restriction (keep away from food), not exclusion from the operation.","img":false,"web":true,"conf":"high","opts":["Restrict from working with exposed food, utensils, and equipment","Exclude from the operation"],"ans":0,"ansText":"A. Restrict from working with exposed food, utensils, and equipment"},{"id":"RD-042","src":"Review Slide Deck","no":"Slide 42","ch":3,"tp":"illness","type":"mc","q":"A food handler at a restaurant has a sore throat with fever. Restrict or exclude?","assigned":true,"why":"Sore throat with fever means restricting the food handler; exclusion applies only when the operation primarily serves a high-risk population.","kn":"Applying the sore-throat-with-fever rule: restrict at a regular restaurant, exclude only where a high-risk population is served.","img":false,"web":true,"conf":"high","opts":["Restrict from working with exposed food, utensils, and equipment","Exclude from the operation"],"ans":0,"ansText":"A. Restrict from working with exposed food, utensils, and equipment"},{"id":"RD-043","src":"Review Slide Deck","no":"Slide 43","ch":3,"tp":"illness","type":"mc","q":"A food handler has a persistent runny nose. Restrict or exclude?","assigned":true,"why":"Persistent sneezing, coughing, or a runny nose that causes discharges means restricting the food handler from working with exposed food, utensils, and equipment.","kn":"Knowing that persistent respiratory symptoms lead to restriction, not exclusion.","img":false,"web":true,"conf":"high","opts":["Restrict from working with exposed food, utensils, and equipment","Exclude from the operation"],"ans":0,"ansText":"A. Restrict from working with exposed food, utensils, and equipment"},{"id":"RD-044","src":"Review Slide Deck","no":"Slide 44","ch":3,"tp":"illness","type":"mc","q":"A food handler is vomiting. Restrict or exclude?","assigned":true,"why":"Vomiting (like diarrhea) means the food handler must be excluded from the operation.","kn":"Knowing that vomiting and diarrhea always mean exclusion, the stricter of the two actions.","img":false,"web":true,"conf":"high","opts":["Restrict from working with exposed food, utensils, and equipment","Exclude from the operation"],"ans":1,"ansText":"B. Exclude from the operation"},{"id":"RD-045","src":"Review Slide Deck","no":"Slide 45","ch":3,"tp":"illness","type":"mc","q":"When can food handlers who are vomiting return to work?","assigned":true,"why":"Food handlers excluded for vomiting or diarrhea can return when they have had no symptoms for at least 24 hours or have a written release from a medical practitioner.","kn":"Knowing the return-to-work rule for vomiting: either 24 symptom-free hours or a medical release is enough.","img":false,"web":true,"conf":"high","opts":["When they have had no symptoms for at least 24 hours","When they have a written release from a medical practitioner","Either A or B"],"ans":2,"ansText":"C. Either A or B"},{"id":"RD-046","src":"Review Slide Deck","no":"Slide 46","ch":3,"tp":"illness","type":"mc","q":"When can food handlers who have jaundice return to work?","assigned":true,"why":"A food handler with jaundice is excluded and reported, and can return only with approval from the regulatory authority and a written release from a medical practitioner.","kn":"Contrasting jaundice with vomiting: jaundice needs both a medical release and regulatory approval, not just one.","img":false,"web":true,"conf":"high","opts":["When they have a written release from a medical practitioner","When they have approval from the health department","Both A and B"],"ans":2,"ansText":"C. Both A and B"},{"id":"RD-047","src":"Review Slide Deck","no":"Slide 47","ch":3,"tp":"illness","type":"mc","q":"A food handler has been diagnosed with an illness caused by hepatitis A. What must a manager do?","assigned":true,"why":"A food handler diagnosed with hepatitis A must be excluded from the operation, and the regulatory authority must be notified.","kn":"Knowing that a Big Six diagnosis such as hepatitis A means exclusion, not just restriction.","img":false,"web":true,"conf":"high","opts":["Restrict the food handler from working with exposed food, utensils, and equipment","Exclude the food handler from the operation"],"ans":1,"ansText":"B. Exclude the food handler from the operation"},{"id":"RD-049","src":"Review Slide Deck","no":"Slide 49","ch":4,"tp":"xcontam","type":"mc","q":"A food handler uses a yellow cutting board only for preparing raw poultry. Can this prevent cross-contamination?","assigned":false,"why":"Using separate equipment for raw and ready-to-eat food can prevent cross-contamination.","kn":"Knowing that dedicated (often color-coded) equipment for raw food is one way to prevent cross-contamination.","img":true,"web":true,"opts":["Yes","No"],"ans":0,"ansText":"A. Yes"},{"id":"RD-050","src":"Review Slide Deck","no":"Slide 50","ch":4,"tp":"xcontam","type":"mc","q":"A food handler cleans and sanitizes the work surface before and after each task. Can this prevent cross-contamination?","assigned":false,"why":"Cleaning and sanitizing surfaces before and after tasks can prevent cross-contamination.","kn":"Recognizing cleaning and sanitizing between tasks as a cross-contamination control.","img":true,"web":true,"note":"Scenario taken from the slide’s explanation; the picture isn’t in the file.","opts":["Yes","No"],"ans":0,"ansText":"A. Yes"},{"id":"RD-051","src":"Review Slide Deck","no":"Slide 51","ch":4,"tp":"xcontam","type":"mc","q":"Raw food and ready-to-eat food are prepped on separate prep tables. Can this prevent cross-contamination?","assigned":false,"why":"Prepping raw and ready-to-eat food on separate prep tables can prevent cross-contamination. So can prepping these foods at different times.","kn":"Knowing the two separation options: separate prep areas, or the same area at different times with cleaning and sanitizing between.","img":true,"web":true,"note":"Scenario taken from the slide’s explanation; the picture isn’t in the file.","opts":["Yes","No"],"ans":0,"ansText":"A. Yes"},{"id":"RD-052","src":"Review Slide Deck","no":"Slide 52","ch":4,"tp":"thermo","type":"fill","q":"Name the thermometer type shown. (The slide’s picture isn’t in the file.)","assigned":false,"why":"The slide names the thermometer.","kn":"Recognizing a bimetallic stemmed thermometer by its dial and stem.","img":true,"web":true,"ansText":"Bimetallic stemmed thermometer","mcq":{"q":"Which thermometer has a calibration nut, a dimple that marks the end of its sensing area, and measures temperature through a metal stem?","opts":["Thermocouple","Bimetallic stemmed thermometer","Infrared thermometer","Time-temperature indicator"],"ans":1},"note":"The original slide shows a picture of the thermometer; the website version describes its features instead."},{"id":"RD-053","src":"Review Slide Deck","no":"Slide 53","ch":4,"tp":"thermo","type":"fill","q":"Name the thermometer type shown. (The slide’s picture isn’t in the file.)","assigned":false,"why":"The slide names the thermometer.","kn":"Recognizing thermocouples and thermistors, the digital thermometers that take interchangeable probes.","img":true,"web":true,"ansText":"Thermocouples and thermistors","mcq":{"q":"Which thermometers measure temperature through a metal probe, show the reading digitally, and have the sensing area on the tip of the probe?","opts":["Bimetallic stemmed thermometers","Infrared thermometers","Time-temperature indicators","Thermocouples and thermistors"],"ans":3},"note":"The original slide shows a picture of the thermometer; the website version describes its features instead."},{"id":"RD-054","src":"Review Slide Deck","no":"Slide 54","ch":4,"tp":"thermo","type":"list","q":"Name the four types of probes used with thermocouples and thermistors.","assigned":false,"why":"Each probe is made for a different job: liquids, flat surfaces, thick or thin food, and air.","kn":"Recalling the four probe types, which the next slides ask you to match to a food or job.","img":false,"web":true,"ansList":["Immersion probe","Surface probe","Penetration probe","Air probe"],"ansText":"Immersion probe; Surface probe; Penetration probe; Air probe"},{"id":"RD-055","src":"Review Slide Deck","no":"Slide 55","ch":4,"tp":"thermo","type":"multi","q":"Which thermometer(s) should be used to check a hamburger patty? Select all that apply.","assigned":true,"why":"A thin food like a hamburger patty needs a thermocouple or thermistor with a thin probe; a bimetallic stemmed thermometer’s sensing area is too long for thin food, and infrared thermometers only read the surface.","kn":"Matching thermometer to food thickness, and knowing infrared can’t measure internal temperature.","img":false,"web":true,"conf":"high","opts":["Bimetallic stemmed","Thermocouple","Infrared"],"ans":[1],"ansText":"B: Thermocouple","mcq":{"q":"Which thermometer should be used to check the internal temperature of a thin hamburger patty?","opts":["Bimetallic stemmed thermometer","Thermocouple","Infrared thermometer","Time-temperature indicator"],"ans":1}},{"id":"RD-056","src":"Review Slide Deck","no":"Slide 56","ch":4,"tp":"thermo","type":"multi","q":"Which thermometer(s) should be used to check a roast? Select all that apply.","assigned":true,"why":"A roast is thick enough for a bimetallic stemmed thermometer’s sensing area, and a thermocouple also works; infrared thermometers only measure surface temperature.","kn":"Knowing that thick food can be checked with either a bimetallic stemmed thermometer or a thermocouple, but never infrared.","img":false,"web":true,"conf":"high","opts":["Bimetallic stemmed","Thermocouple","Infrared"],"ans":[0,1],"ansText":"A, B: Bimetallic stemmed; Thermocouple","mcq":{"q":"Which thermometer should NOT be used to check the internal temperature of a roast?","opts":["Bimetallic stemmed thermometer","Thermocouple","Infrared thermometer","Thermistor"],"ans":2}},{"id":"RD-057","src":"Review Slide Deck","no":"Slide 57","ch":4,"tp":"thermo","type":"mc","q":"Which thermocouple probe should be used to check the temperature of a cooler?","assigned":true,"why":"Air probes check the temperature inside coolers and ovens.","kn":"Matching the air probe to measuring air temperature inside a unit.","img":false,"web":true,"conf":"high","opts":["Immersion probe","Surface probe","Penetration probe","Air probe"],"ans":3,"ansText":"D. Air probe"},{"id":"RD-058","src":"Review Slide Deck","no":"Slide 58","ch":4,"tp":"thermo","type":"mc","q":"Which thermocouple probe should be used to check fryer oil?","assigned":true,"why":"Immersion probes check the temperature of liquids, such as soups, sauces, and frying oil.","kn":"Matching the immersion probe to liquids.","img":false,"web":true,"conf":"high","opts":["Immersion probe","Surface probe","Penetration probe","Air probe"],"ans":0,"ansText":"A. Immersion probe"},{"id":"RD-059","src":"Review Slide Deck","no":"Slide 59","ch":4,"tp":"thermo","type":"mc","q":"Which thermocouple probe should be used to check a steak?","assigned":true,"why":"Penetration probes check the internal temperature of food and are especially useful for thin food like patties or steaks.","kn":"Matching the penetration probe to checking a food’s internal temperature.","img":false,"web":true,"conf":"high","opts":["Immersion probe","Surface probe","Penetration probe","Air probe"],"ans":2,"ansText":"C. Penetration probe"},{"id":"RD-060","src":"Review Slide Deck","no":"Slide 60","ch":4,"tp":"thermo","type":"mc","q":"When should you calibrate a thermometer?","assigned":true,"why":"Calibrate thermometers regularly: before each shift, after they have been dropped, and after extreme temperature changes such as being left in a freezer.","kn":"Recalling every calibration trigger, not just one of them.","img":false,"web":true,"conf":"high","opts":["If you dropped it","If you left it in the freezer","Before each shift","All of these times"],"ans":3,"ansText":"D. All of these times"},{"id":"RD-061","src":"Review Slide Deck","no":"Slide 61","ch":4,"tp":"thermo","type":"mc","q":"Where should you stick the thermometer: A, B, or C? (The slide’s picture isn’t in the file.)","assigned":true,"why":"The rule: insert the thermometer stem or probe into the thickest part of the food. Which letter marks that spot depends on the picture.","kn":"Knowing to measure in the thickest part of the food, where it heats or cools last.","img":true,"web":false,"conf":"low","opts":["A","B","C"],"ans":null,"ansText":"Can’t be determined: the slide’s picture isn’t in the file"},{"id":"RD-063","src":"Review Slide Deck","no":"Slide 63","ch":5,"tp":"recvpack","type":"mc","q":"You receive cases of canned goods with dirty surfaces. Can you accept them?","assigned":false,"why":"They can be reconditioned through cleaning and sanitizing and then used.","kn":"Knowing that dirty but intact cans can be reconditioned, unlike cans with swollen ends, leaks or severe dents, which must be rejected.","img":false,"web":true,"opts":["Yes","No"],"ans":0,"ansText":"A. Yes"},{"id":"RD-065","src":"Review Slide Deck","no":"Slide 65","ch":5,"tp":"recvtemp","type":"mc","q":"A delivery of fresh fish has an internal temperature of 50°F (10°C). Accept or reject?","assigned":false,"why":"Cold TCS food must be received at 41°F (5°C) or lower, unless otherwise specified.","kn":"Applying the 41°F receiving rule to fish, and not confusing it with the shellstock exception.","img":true,"web":true,"opts":["Accept","Reject"],"ans":1,"ansText":"B. Reject"},{"id":"RD-066","src":"Review Slide Deck","no":"Slide 66","ch":5,"tp":"recvtemp","type":"mc","q":"A delivery of live clams (shellstock) has an air temperature of 45°F (7°C) and an internal temperature of 50°F (10°C). Accept or reject?","assigned":false,"why":"Shellstock (live molluscan shellfish) can be received at an air temperature of 45°F (7°C) and an internal temperature no greater than 50°F (10°C). Then it must be cooled to 41°F (5°C) or lower in four hours.","kn":"Knowing the special receiving rule for live shellfish: up to 50°F internal is acceptable, unlike most cold TCS food.","img":true,"web":true,"opts":["Accept","Reject"],"ans":0,"ansText":"A. Accept"},{"id":"RD-067","src":"Review Slide Deck","no":"Slide 67","ch":5,"tp":"recvtemp","type":"mc","q":"A delivery of shucked scallops has an internal temperature of 50°F (10°C). Accept or reject?","assigned":false,"why":"Shucked shellfish (molluscan shellfish with both shells removed) must be received at 45°F (7°C) or lower. Then it must be cooled to 41°F (5°C) or lower in four hours.","kn":"Separating shucked shellfish (45°F or lower) from live shellstock (up to 50°F internal).","img":true,"web":true,"opts":["Accept","Reject"],"ans":1,"ansText":"B. Reject"},{"id":"RD-068","src":"Review Slide Deck","no":"Slide 68","ch":5,"tp":"recvtemp","type":"mc","q":"A delivery of in-shell clams (non-living, processed, with one or both shells present) arrives frozen according to the manufacturer’s directions. Accept or reject?","assigned":false,"why":"In-shell product (non-living, processed shellfish with one or both shells present) must be received according to the manufacturer’s directions.","kn":"Knowing that processed in-shell product follows the manufacturer’s directions, not the live-shellstock rule.","img":true,"web":true,"opts":["Accept","Reject"],"ans":0,"ansText":"A. Accept"},{"id":"RD-069","src":"Review Slide Deck","no":"Slide 69","ch":5,"tp":"recvtemp","type":"mc","q":"A delivery of milk has an internal temperature of 45°F (7°C). Accept or reject?","assigned":false,"why":"Milk can be received at 45°F (7°C) or lower. Then it must be cooled to 41°F (5°C) or lower in four hours.","kn":"Recalling the milk exception: 45°F is acceptable at receiving if it is cooled to 41°F within four hours.","img":true,"web":true,"opts":["Accept","Reject"],"ans":0,"ansText":"A. Accept"},{"id":"RD-070","src":"Review Slide Deck","no":"Slide 70","ch":5,"tp":"recvtemp","type":"mc","q":"A delivery of shell eggs has an air temperature of 45°F (7°C). Accept or reject?","assigned":false,"why":"Receive shell eggs at an air temperature of 45°F (7°C) or lower.","kn":"Knowing that shell eggs are judged by the air temperature of the truck, at 45°F or lower.","img":true,"web":true,"opts":["Accept","Reject"],"ans":0,"ansText":"A. Accept"},{"id":"RD-071","src":"Review Slide Deck","no":"Slide 71","ch":5,"tp":"recvtemp","type":"mc","q":"A hot chicken breast is delivered at 120°F (49°C). Accept or reject?","assigned":false,"why":"Hot TCS food must be received at 135°F (57°C) or higher.","kn":"Applying the hot-receiving rule: 135°F or higher; 120°F is inside the temperature danger zone.","img":true,"web":true,"opts":["Accept","Reject"],"ans":1,"ansText":"B. Reject"},{"id":"RD-072","src":"Review Slide Deck","no":"Slide 72","ch":5,"tp":"recvpack","type":"mc","q":"A box of frozen shrimp arrives with large ice crystals on the box. Accept or reject?","assigned":false,"why":"Frozen food with ice crystals or frozen liquids on the food or packaging must be rejected.","kn":"Recognizing ice crystals as a sign of thawing and refreezing (time-temperature abuse).","img":true,"web":true,"opts":["Accept","Reject"],"ans":1,"ansText":"B. Reject"},{"id":"RD-073","src":"Review Slide Deck","no":"Slide 73","ch":5,"tp":"recvpack","type":"mc","q":"A case of single-use cups arrives with packaging that isn’t intact and clean. Accept or reject?","assigned":false,"why":"Packaging that is not intact and clean must be rejected, for nonfood items too.","kn":"Knowing that nonfood items such as single-use cups are inspected like food: packaging must be intact and clean.","img":true,"web":true,"note":"Scenario detail taken from the slide’s explanation; the picture isn’t in the file.","opts":["Accept","Reject"],"ans":1,"ansText":"B. Reject"},{"id":"RD-074","src":"Review Slide Deck","no":"Slide 74","ch":5,"tp":"recvpack","type":"mc","q":"A bag of flour arrives with a tear in its packaging. Accept or reject?","assigned":false,"why":"Items with tears, holes, or punctures in their packaging must be rejected.","kn":"Applying the packaging rule: any tear, hole or puncture means rejection.","img":true,"web":true,"note":"Scenario detail taken from the slide’s explanation; the picture isn’t in the file.","opts":["Accept","Reject"],"ans":1,"ansText":"B. Reject"},{"id":"RD-075","src":"Review Slide Deck","no":"Slide 75","ch":5,"tp":"recvpack","type":"mc","q":"A can arrives with a severe dent in its seam. Accept or reject?","assigned":false,"why":"Cans with severe dents in the seams or deep dents in the can body must be rejected.","kn":"Telling severe seam or deep body dents (reject) apart from dirty-but-intact cans, which can be reconditioned.","img":true,"web":true,"note":"Scenario detail taken from the slide’s explanation; the picture isn’t in the file.","opts":["Accept","Reject"],"ans":1,"ansText":"B. Reject"},{"id":"RD-076","src":"Review Slide Deck","no":"Slide 76","ch":5,"tp":"recvpack","type":"mc","q":"A package of vacuum-packed (reduced-oxygen) meat arrives leaking. Accept or reject?","assigned":false,"why":"All food packaged in a reduced-oxygen environment must be rejected if the packaging is bloated or leaking.","kn":"Knowing that bloated or leaking ROP packaging means rejection.","img":true,"web":true,"opts":["Accept","Reject"],"ans":1,"ansText":"B. Reject"},{"id":"RD-077","src":"Review Slide Deck","no":"Slide 77","ch":5,"tp":"recvpack","type":"mc","q":"A case of dry pasta arrives with the carton and seals intact. Accept or reject?","assigned":false,"why":"Cartons and seals must be intact and there must not be signs of tampering; this case meets that.","kn":"Knowing what acceptable packaging looks like: intact cartons and seals, no tampering.","img":true,"web":true,"opts":["Accept","Reject"],"ans":0,"ansText":"A. Accept"},{"id":"RD-078","src":"Review Slide Deck","no":"Slide 78","ch":5,"tp":"recvpack","type":"mc","q":"A bag of flour arrives with a water stain. Accept or reject?","assigned":false,"why":"Reject items with leaks, dampness, or water stains, which show the item was wet at some point.","kn":"Recognizing water stains as evidence the item got wet, which means rejection.","img":true,"web":true,"opts":["Accept","Reject"],"ans":1,"ansText":"B. Reject"},{"id":"RD-079","src":"Review Slide Deck","no":"Slide 79","ch":5,"tp":"recvpack","type":"mc","q":"A Danish pastry arrives with signs of pests. Accept or reject?","assigned":false,"why":"Reject items with signs of pests or pest damage.","kn":"Knowing that any sign of pests or pest damage means rejection.","img":true,"web":true,"note":"Scenario detail taken from the slide’s explanation; the picture isn’t in the file.","opts":["Accept","Reject"],"ans":1,"ansText":"B. Reject"},{"id":"RD-080","src":"Review Slide Deck","no":"Slide 80","ch":5,"tp":"label","type":"mc","q":"Which date is the last date recommended for use of the product while at peak quality?","assigned":true,"why":"The use-by date is the last date recommended for using the product while it is at peak quality.","kn":"Telling product dates apart: use-by (last date at peak quality) versus best-by (best flavor or quality) and sell-by (how long the store displays it).","img":false,"web":true,"conf":"high","opts":["Use-by or expiration date","Sell-by date","Best-by date","Coded date"],"ans":0,"ansText":"A. Use-by or expiration date"},{"id":"RD-081","src":"Review Slide Deck","no":"Slide 81","ch":5,"tp":"label","type":"mc","q":"Which date is the date by which the product should be eaten for best flavor or quality?","assigned":true,"why":"The best-by date tells you when the product should be eaten for best flavor or quality.","kn":"Separating best-by (flavor and quality) from use-by (last recommended date at peak quality).","img":false,"web":true,"conf":"high","opts":["Use-by or expiration date","Sell-by date","Best-by date","Coded date"],"ans":2,"ansText":"C. Best-by date"},{"id":"RD-082","src":"Review Slide Deck","no":"Slide 82","ch":5,"tp":"recvpack","type":"list","q":"How must molluscan shellfish be stored and documented?","assigned":false,"why":"Shellstock tags let the regulatory authority trace shellfish back to where they were harvested if people get sick.","kn":"Recalling the 90-day shellstock tag rule and when the 90 days start: from the date the last shellfish was used, not the delivery date.","img":false,"web":true,"ansList":["Do not remove the tag or label from the container until the last shellfish is used","When the last shellfish is removed, write the date on the tag, label, or invoice","Keep the tag on file in chronological order for 90 days from that date","Keep shellfish in the container they were received in until they are sold or prepared","Do not mix shellfish from one container with another unless they have the same certification number or harvest date and are from the same growing area"],"ansText":"Do not remove the tag or label from the container until the last shellfish is used; When the last shellfish is removed, write the date on the tag, label, or invoice; Keep the tag on file in chronological order for 90 days from that date; Keep shellfish in the container they were received in until they are sold or prepared; Do not mix shellfish from one container with another unless they have the same certification number or harvest date and are from the same growing area"},{"id":"RD-083","src":"Review Slide Deck","no":"Slide 83","ch":5,"tp":"recvpack","type":"list","q":"What documentation must you keep for fish that will be eaten raw or partially cooked, and for how long?","assigned":false,"why":"Fish served raw or undercooked must be frozen correctly to kill parasites, and the records prove it.","kn":"Recalling the parasite-destruction records and the 90-day retention time.","img":false,"web":true,"ansList":["The document must show the fish was correctly frozen","Keep the document for 90 days from the sale of the fish","For farm-raised fish: the document must state the fish was raised to FDA standards"],"ansText":"The document must show the fish was correctly frozen; Keep the document for 90 days from the sale of the fish; For farm-raised fish: the document must state the fish was raised to FDA standards"},{"id":"RD-084","src":"Review Slide Deck","no":"Slide 84","ch":5,"tp":"recvpack","type":"mc","q":"A delivery of gorgonzola cheese contains its natural blue mold. Accept or reject?","assigned":false,"why":"Reject food that is moldy, unless the mold is natural to the product, as it is in gorgonzola.","kn":"Knowing the exception to the mold rule: mold that is natural to the product is acceptable.","img":true,"web":true,"opts":["Accept","Reject"],"ans":0,"ansText":"A. Accept"},{"id":"RD-085","src":"Review Slide Deck","no":"Slide 85","ch":5,"tp":"recvpack","type":"mc","q":"A delivered steak is sticky to the touch. Accept or reject?","assigned":false,"why":"Reject meat, fish, or poultry that is slimy, sticky, or dry.","kn":"Recognizing slimy, sticky or dry texture as a quality problem that means rejection.","img":true,"web":true,"opts":["Accept","Reject"],"ans":1,"ansText":"B. Reject"},{"id":"RD-086","src":"Review Slide Deck","no":"Slide 86","ch":5,"tp":"recvpack","type":"mc","q":"A delivery of fresh tuna has a slight seaweed smell. Accept or reject?","assigned":false,"why":"A slight seaweed smell is a normal odor for fish. Reject food that has an abnormal or unpleasant odor.","kn":"Telling a normal fish odor (slight seaweed) apart from an abnormal one that means rejection.","img":true,"web":true,"opts":["Accept","Reject"],"ans":0,"ansText":"A. Accept"},{"id":"RD-087","src":"Review Slide Deck","no":"Slide 87","ch":5,"tp":"label","type":"mc","q":"Does food being used on-site need to be labeled?","assigned":false,"why":"All items that are not in their original container must be labeled.","kn":"Knowing that on-site labeling applies to any food moved out of its original container, not just food sold at retail.","img":false,"web":true,"opts":["Yes","No"],"ans":0,"ansText":"A. Yes"},{"id":"RD-088","src":"Review Slide Deck","no":"Slide 88","ch":5,"tp":"label","type":"list","q":"Labels on food packaged on-site for retail sale must include which six things?","assigned":false,"why":"Retail labels must give customers enough information to identify the food and its allergens.","kn":"Recalling all six retail label requirements, especially the source of each major allergen.","img":false,"web":true,"ansList":["Common name of the food, or a statement clearly identifying it","Quantity of the food","If the item contains two or more ingredients: a list of ingredients and subingredients in descending order by weight","List of artificial colors and flavors in the food, including chemical preservatives","Name and place of business of the manufacturer, packer, or distributor","Source of each major food allergen contained in the food"],"ansText":"Common name of the food, or a statement clearly identifying it; Quantity of the food; If the item contains two or more ingredients: a list of ingredients and subingredients in descending order by weight; List of artificial colors and flavors in the food, including chemical preservatives; Name and place of business of the manufacturer, packer, or distributor; Source of each major food allergen contained in the food"},{"id":"RD-089","src":"Review Slide Deck","no":"Slide 89","ch":5,"tp":"label","type":"mc","q":"Tuna salad was prepared on July 5 using tuna with a use-by date of July 8. What is the discard date of the tuna salad?","assigned":true,"why":"When combining ingredients, the discard date is the earliest use-by date of the ingredients. Seven days from July 5 would be July 11, but the tuna’s July 8 use-by date comes first.","kn":"Applying the date-marking rule for combined food: the shortest ingredient date wins over the 7-day rule.","img":false,"web":true,"conf":"high","opts":["July 5","July 8","July 11"],"ans":1,"ansText":"B. July 8"},{"id":"RD-090","src":"Review Slide Deck","no":"Slide 90","ch":5,"tp":"storage","type":"mc","q":"TCS food is stored at an internal temperature of 40°F (4°C). Is this food being stored correctly?","assigned":false,"why":"Store TCS food at an internal temperature of 41°F (5°C) or lower, or 135°F (57°C) or higher.","kn":"Applying the storage temperature rule: 40°F is within the safe cold range.","img":true,"web":true,"opts":["Yes","No"],"ans":0,"ansText":"A. Yes"},{"id":"RD-091","src":"Review Slide Deck","no":"Slide 91","ch":5,"tp":"storage","type":"mc","q":"A cooler’s thermometer has been placed near the door, the warmest part of the cooler. Is food being stored correctly in this cooler?","assigned":false,"why":"Refrigerated units must have at least one air-temperature measuring device located in the warmest part of the unit, usually near the door.","kn":"Knowing where a cooler thermometer belongs: the warmest spot, near the door.","img":true,"web":true,"opts":["Yes","No"],"ans":0,"ansText":"A. Yes"},{"id":"RD-092","src":"Review Slide Deck","no":"Slide 92","ch":5,"tp":"storage","type":"mc","q":"A reach-in refrigerator is packed so full that air can’t circulate. Is food being stored correctly?","assigned":false,"why":"Do not overload coolers and freezers, which can prevent good airflow and make units work harder to stay cold.","kn":"Knowing that overloading a cooler is a storage error because it blocks airflow.","img":true,"web":true,"opts":["Yes","No"],"ans":1,"ansText":"B. No"},{"id":"RD-093","src":"Review Slide Deck","no":"Slide 93","ch":5,"tp":"storage","type":"mc","q":"Cans with the earliest use-by dates are stored at the front of the shelf. Is this food being stored correctly?","assigned":false,"why":"Store items with the earliest use-by or expiration dates in front of items with later dates, then use those stored in front first (FIFO).","kn":"Applying FIFO rotation: earliest dates in front and used first.","img":true,"web":true,"opts":["Yes","No"],"ans":0,"ansText":"A. Yes"},{"id":"RD-094","src":"Review Slide Deck","no":"Slide 94","ch":5,"tp":"storage","type":"mc","q":"A sack of onions is stored on the floor. Is this food being stored correctly?","assigned":false,"why":"Store items away from walls and at least 6 inches (15 centimeters) off the floor.","kn":"Recalling the 6-inch off-the-floor rule.","img":true,"web":true,"opts":["Yes","No"],"ans":1,"ansText":"B. No"},{"id":"RD-095","src":"Review Slide Deck","no":"Slide 95","ch":5,"tp":"storage","type":"mc","q":"Salt is stored in a container made for holding food. Is this food being stored correctly?","assigned":true,"why":"Storing food in a food-grade container is correct. Never re-use single-use containers to store food, never use empty food containers to store chemicals, and never put food in empty chemical containers.","kn":"Knowing which containers can hold food: food-grade containers yes; reused single-use containers or chemical containers never.","img":true,"web":true,"conf":"low","note":"The slide’s explanation describes the salt as stored in a container intended for food, so it is marked correct; the picture would confirm it.","opts":["Yes","No"],"ans":0,"ansText":"A. Yes"},{"id":"RD-096","src":"Review Slide Deck","no":"Slide 96","ch":5,"tp":"storage","type":"list","q":"Put these foods in order on six cooler shelves, from top to bottom: whole raw chicken roaster, pork chops, ground lamb, green salad, tenderized beef, whole snapper, frosted cake, ground turkey.","assigned":false,"why":"Store food by minimum internal cooking temperature: ready-to-eat food on top, then seafood, whole cuts of beef and pork, ground meat and ground fish, and poultry on the bottom.","kn":"Applying top-to-bottom storage order by cooking temperature, including that tenderized beef goes with ground meat and that poultry (whole or ground) goes on the bottom.","img":false,"web":true,"ansList":["Shelf 1 (top): Frosted cake","Shelf 2: Green salad","Shelf 3: Whole snapper","Shelf 4: Pork chops","Shelf 5: Ground lamb and tenderized beef","Shelf 6 (bottom): Ground turkey and whole raw chicken roaster"],"ansText":"Shelf 1 (top): Frosted cake; Shelf 2: Green salad; Shelf 3: Whole snapper; Shelf 4: Pork chops; Shelf 5: Ground lamb and tenderized beef; Shelf 6 (bottom): Ground turkey and whole raw chicken roaster"},{"id":"RD-098","src":"Review Slide Deck","no":"Slide 98","ch":6,"tp":"prep","type":"mc","q":"More food has been taken out of the cooler than can be prepped in a short time. Is this food being prepared correctly?","assigned":false,"why":"You should only remove as much food as you can prep in a short period of time.","kn":"Knowing to limit how much food sits out during prep, to cut time in the temperature danger zone.","img":true,"web":true,"opts":["Yes","No"],"ans":1,"ansText":"B. No"},{"id":"RD-099","src":"Review Slide Deck","no":"Slide 99","ch":6,"tp":"thaw","type":"mc","q":"A vacuum-packed (ROP) fish is being thawed in a cooler while still in its package. Is it being thawed correctly?","assigned":false,"why":"Frozen reduced-oxygen-packaged fish that is labeled to stay frozen until used must be removed from the package before thawing.","kn":"Knowing the ROP fish thawing rule: take it out of the package before thawing, even in a cooler.","img":true,"web":true,"opts":["Yes","No"],"ans":1,"ansText":"B. No"},{"id":"RD-100","src":"Review Slide Deck","no":"Slide 100","ch":6,"tp":"prep","type":"mc","q":"Cut tomatoes: do they need to be refrigerated for safety?","assigned":false,"why":"Cut tomatoes must be held at 41°F (5°C) or lower.","kn":"Knowing which produce becomes TCS once cut: cut tomatoes, sliced melons and cut leafy greens must be held at 41°F or lower.","img":false,"web":true,"opts":["Yes","No"],"ans":0,"ansText":"A. Yes"},{"id":"RD-101","src":"Review Slide Deck","no":"Slide 101","ch":6,"tp":"prep","type":"mc","q":"Sliced melons: do they need to be refrigerated for safety?","assigned":false,"why":"Sliced melons must be held at 41°F (5°C) or lower.","kn":"Knowing which produce becomes TCS once cut: cut tomatoes, sliced melons and cut leafy greens must be held at 41°F or lower.","img":false,"web":true,"opts":["Yes","No"],"ans":0,"ansText":"A. Yes"},{"id":"RD-102","src":"Review Slide Deck","no":"Slide 102","ch":6,"tp":"prep","type":"mc","q":"Cut leafy greens: do they need to be refrigerated for safety?","assigned":false,"why":"Cut leafy greens must be held at 41°F (5°C) or lower.","kn":"Knowing which produce becomes TCS once cut: cut tomatoes, sliced melons and cut leafy greens must be held at 41°F or lower.","img":false,"web":true,"opts":["Yes","No"],"ans":0,"ansText":"A. Yes"},{"id":"RD-103","src":"Review Slide Deck","
