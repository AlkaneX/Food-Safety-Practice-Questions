<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ServSafe Practice Kitchen</title>
<meta name="description" content="ServSafe Manager (9th edition) practice questions by chapter, a timed 90-question mock exam, and knowledge points for NUTR248.">
<script>try{var t=localStorage.getItem('ssm-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: one 760px column. Panels are brushed-steel prep surfaces; each question is a kitchen order ticket.
   Color: navy ink on steel grey, sanitizer teal for actions; blue-to-red only where temperatures are shown. */
:root{
  --bar:#1B2A35; --bar-ink:#EEF2F4;
  --bg:#E9EEF1; --panel:#FFFFFF; --ticket:#FFFEF8; --ink:#1B2A35; --muted:#566874; --rule:#C5CFD6; --rule-soft:#DFE6EA;
  --accent:#0A7470; --accent-ink:#FFFFFF; --accent-soft:#D5ECEA;
  --cold:#2C68AE; --hot:#C23D2C;
  --ok:#1C7843; --ok-bg:#E0F2E6; --no:#B3372B; --no-bg:#FAE5E2; --warn:#7A5200; --warn-bg:#FFF0C2;
  --focus:#2C5BE8; --shadow:0 1px 0 rgba(27,42,53,.05),0 12px 30px -20px rgba(27,42,53,.45);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bar:#0A1014; --bar-ink:#E5ECF0;
    --bg:#10171C; --panel:#18232B; --ticket:#1C2830; --ink:#E5ECF0; --muted:#9BABB6; --rule:#2F3E48; --rule-soft:#24323C;
    --accent:#3DBDB4; --accent-ink:#061918; --accent-soft:#12312F; --cold:#72A9EE; --hot:#F07D6B;
    --ok:#5BC98C; --ok-bg:#10291B; --no:#F08377; --no-bg:#2E1714; --warn:#F2C65C; --warn-bg:#2D250F;
    --focus:#8AA8FF; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bar:#0A1014; --bar-ink:#E5ECF0;
  --bg:#10171C; --panel:#18232B; --ticket:#1C2830; --ink:#E5ECF0; --muted:#9BABB6; --rule:#2F3E48; --rule-soft:#24323C;
  --accent:#3DBDB4; --accent-ink:#061918; --accent-soft:#12312F; --cold:#72A9EE; --hot:#F07D6B;
  --ok:#5BC98C; --ok-bg:#10291B; --no:#F08377; --no-bg:#2E1714; --warn:#F2C65C; --warn-bg:#2D250F;
  --focus:#8AA8FF; --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
p{margin:0 0 .6em}
h1,h2,h3{text-wrap:balance}

/* ---------- top bar + timer ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--bar);color:var(--bar-ink);border-bottom:1px solid var(--rule);padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;position:relative}
.brand{background:none;border:0;padding:0;color:inherit;text-align:left;font-family:var(--f-display);font-weight:800;font-size:1.32rem;line-height:1;letter-spacing:.02em;text-transform:uppercase}
.brand small{display:block;font-family:var(--f-body);font-weight:600;font-size:.64rem;letter-spacing:.14em;opacity:.75;margin-top:3px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.timer{display:flex;align-items:stretch;border:2px solid currentColor;border-radius:999px;overflow:hidden}
.timer button{background:none;border:0;color:inherit;display:flex;align-items:center;gap:6px;min-height:36px;padding:4px 10px}
.t-face{font-family:var(--f-mono);font-weight:600;font-size:.88rem;font-variant-numeric:tabular-nums}
.t-play{border-left:2px solid currentColor !important;padding:4px 9px !important}
.timer.running{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.timer.running .t-play{border-left-color:var(--accent-ink) !important}
.timer.expired{background:var(--hot);color:#fff;border-color:var(--hot)}
.icon-btn{width:36px;height:36px;border-radius:999px;border:2px solid currentColor;background:none;color:inherit;display:grid;place-items:center;padding:0}
svg{display:block;pointer-events:none}
.t-panel{position:absolute;right:0;top:calc(100% + 10px);width:min(320px,calc(100vw - 32px));background:var(--panel);color:var(--ink);border:1.5px solid var(--rule);border-top:6px solid var(--accent);border-radius:6px;padding:12px 14px 14px;box-shadow:var(--shadow);z-index:40}
.t-panel h2{font-family:var(--f-display);font-weight:800;font-size:1.4rem;text-transform:uppercase;margin:0 0 8px;line-height:1}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--ink);min-height:40px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.t-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.t-row input{width:90px;min-height:40px;border:1.5px solid var(--rule);border-radius:6px;padding:4px 8px;background:var(--panel)}
.t-big{font-family:var(--f-mono);font-weight:600;font-size:2.4rem;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0}
.t-note{font-size:.84rem;color:var(--muted);margin:10px 0 0}

/* ---------- layout ---------- */
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 48px}
.panel{background:var(--panel);border:1.5px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);padding:16px}
@media (min-width:640px){.panel{padding:20px 24px}}
.stack{display:grid;gap:16px}
.eyebrow{font-family:var(--f-display);font-weight:700;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2.1rem,8vw,2.9rem);line-height:.95;margin:0 0 8px}
.h2{font-family:var(--f-display);font-weight:800;font-size:1.5rem;line-height:1.05;margin:0 0 8px;text-transform:uppercase;letter-spacing:.02em}
.lede{color:var(--muted);margin:0 0 14px;max-width:62ch}
.crumbs{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.link{background:none;border:0;padding:6px 0;font-weight:700;color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.link:hover{color:var(--accent)}
.foot{font-size:.84rem;color:var(--muted);margin:6px 0 0}
.chip-mode{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.86rem;padding:1px 8px;border-radius:4px;letter-spacing:.06em}

/* ---------- danger zone strip ---------- */
.tdz{margin:8px 0 2px}
.tdz-labels{position:relative;height:28px;font-family:var(--f-mono);font-size:.74rem;font-weight:600}
.tdz-labels.below{height:30px}
.tdz-labels span{position:absolute;transform:translateX(-50%);white-space:nowrap;bottom:2px}
.tdz-labels.below span{top:2px;bottom:auto;color:var(--muted)}
.tdz-bar{position:relative;height:16px;border-radius:999px;background:linear-gradient(90deg,var(--cold) 0 19.3%,var(--rule-soft) 19.3% 63.7%,var(--hot) 63.7%);overflow:hidden}
.tdz-zone{position:absolute;top:0;bottom:0;left:19.3%;width:44.4%;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--hot) 55%,transparent) 0 6px,color-mix(in srgb,var(--hot) 25%,transparent) 6px 12px)}
.tdz-fast{position:absolute;top:0;bottom:0;left:33%;width:26%;background:color-mix(in srgb,var(--hot) 72%,transparent)}
.tdz-cap{font-size:.86rem;color:var(--muted);margin:0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border:2px solid var(--ink);border-radius:6px;background:var(--panel);color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:1.12rem;letter-spacing:.03em;text-transform:uppercase;transition:background-color .15s,color .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn-row .btn{flex:1 1 170px}

/* ---------- home ---------- */
.modes{display:grid;gap:12px}
@media (min-width:640px){.modes{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mode{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--panel);color:var(--ink);border:1.5px solid var(--rule);border-top:6px solid var(--accent);border-radius:6px;padding:14px 14px 16px;box-shadow:var(--shadow);min-width:0;transition:border-color .15s,transform .15s}
.mode:hover{border-color:var(--accent);transform:translateY(-1px)}
.mode .k{font-family:var(--f-mono);font-weight:600;font-size:.76rem;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.mode b{font-family:var(--f-display);font-weight:800;font-size:1.45rem;line-height:1.05;text-transform:uppercase;letter-spacing:.02em}
.mode .d{font-size:.92rem;color:var(--muted)}
.mode.kp{border-top-color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}
.fact{border:1.5px solid var(--rule-soft);border-radius:6px;padding:8px 10px}
.fact b{display:block;font-family:var(--f-mono);font-size:1.3rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.fact span{font-size:.82rem;color:var(--muted)}

/* ---------- chapter menu ---------- */
.filters{display:grid;gap:12px;margin:4px 0 12px}
@media (min-width:600px){.filters{grid-template-columns:1fr 1fr}}
.filters label{display:grid;gap:4px;font-family:var(--f-display);font-weight:700;font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;min-width:0}
select{width:100%;min-height:44px;border:1.5px solid var(--rule);border-radius:6px;background:var(--panel);padding:6px 10px;font-family:var(--f-body);font-size:1rem;letter-spacing:0;text-transform:none;font-weight:400}
.rows{display:grid;margin:0 -8px}
.row{display:grid;grid-template-columns:44px 1fr auto 14px;align-items:center;gap:10px;background:none;border:0;border-top:1px solid var(--rule-soft);padding:10px 8px;text-align:left;color:inherit;border-radius:4px;width:100%}
.row:first-child{border-top:0}
.row:hover:not(:disabled){background:var(--accent-soft)}
.row:disabled{opacity:.4;cursor:not-allowed}
.row-n{font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1;color:var(--accent);text-align:center}
.row-t{min-width:0}
.row-t b{display:block;font-weight:700;line-height:1.25}
.row-t small{display:block;color:var(--muted);font-size:.84rem}
.row-c{font-family:var(--f-mono);font-weight:600;font-size:.9rem;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.row.exam{border:2px solid var(--hot);border-radius:6px;margin:10px 0 2px}
.row.exam .row-n{color:var(--hot)}
.row.missed .row-n{color:var(--warn)}

/* ---------- quiz: the order ticket ---------- */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.prog{height:10px;border-radius:999px;background:var(--rule-soft);margin:8px 0;overflow:hidden}
.prog span{display:block;height:100%;background:linear-gradient(90deg,var(--cold),var(--accent));border-radius:999px;transition:width .25s}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700;font-size:.9rem;margin-bottom:10px}
.qmeta .score{font-family:var(--f-mono);font-weight:600}
.ticket{position:relative;background:var(--ticket);border:1.5px solid var(--rule);border-radius:6px 6px 2px 2px;box-shadow:var(--shadow);padding:0 0 18px;outline:none}
.ticket::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:8px;background:radial-gradient(circle at 6px 0,transparent 5px,var(--ticket) 5.5px) 0 0/12px 8px repeat-x}
.t-head{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:space-between;font-family:var(--f-mono);font-size:.78rem;font-weight:600;color:var(--muted);padding:10px 16px 8px;border-bottom:2px dashed var(--rule)}
.t-head .assigned-tag{color:var(--warn);background:var(--warn-bg);padding:0 6px;border-radius:3px}
.t-body{padding:14px 16px 0}
@media (min-width:640px){.t-head{padding:12px 24px 10px}.t-body{padding:18px 24px 0}}
.q-text{font-size:1.16rem;line-height:1.45;margin:0 0 14px;font-weight:600}
@media (min-width:640px){.q-text{font-size:1.24rem}}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--panel);color:var(--ink);border:1.5px solid var(--rule);border-radius:6px;padding:11px 13px;min-height:50px;line-height:1.38;transition:border-color .12s,background-color .12s,opacity .12s}
.opt:hover:not([aria-disabled="true"]){border-color:var(--accent)}
.opt[aria-disabled="true"]{cursor:default}
.ltr{font-family:var(--f-mono);font-weight:600;font-size:.82rem;min-width:26px;height:26px;display:inline-grid;place-items:center;border:1.5px solid currentColor;border-radius:4px;flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .ltr{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .ltr{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--no-bg)}
.opt.no .ltr{background:var(--no);border-color:var(--no);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:16px;border-top:2px solid var(--ink);padding-top:12px;animation:rise .2s ease-out;scroll-margin-bottom:110px}
.fb-h{font-family:var(--f-display);font-weight:800;font-size:1.5rem;text-transform:uppercase;letter-spacing:.03em;margin:0 0 6px;line-height:1.05}
.fb-h.ok{color:var(--ok)} .fb-h.no{color:var(--no)}
.fb-a{font-weight:700}
.kn{margin-top:12px;padding:10px 12px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0}
.kn b{display:block;font-family:var(--f-display);font-weight:700;font-size:.84rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.kn p{margin:0}
.assigned{margin-top:10px;padding:8px 12px;background:var(--warn-bg);border-radius:6px;font-size:.92rem}
.assigned b{color:var(--warn)}
.note{margin:8px 0 0;font-size:.9rem;color:var(--muted)}
.qnav{position:sticky;bottom:0;z-index:10;margin-top:18px;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 72%,transparent)}
.qnav-in{display:flex;gap:10px}
.qnav .primary{flex:1}
.keys{font-size:.8rem;color:var(--muted);text-align:center;margin:4px 0 0}
@media (hover:none){.keys{display:none}}
.leave{background:var(--warn-bg);border:1.5px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:6px;padding:10px 14px;margin:8px 0}
.leave p{margin:0}
.leave .btn-row{margin-top:10px}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ---------- results ---------- */
.result{display:grid;gap:16px;align-items:center}
@media (min-width:560px){.result{grid-template-columns:auto 1fr}}
.placard{width:150px;height:150px;border-radius:50%;border:6px double var(--ok);color:var(--ok);display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:800;line-height:.9;transform:rotate(-6deg);margin:0 auto}
.placard.fail{border-color:var(--no);color:var(--no)}
.placard.plain{border-color:var(--ink);color:var(--ink)}
.placard big{display:block;font-size:2.9rem}
.placard small{display:block;font-size:.95rem;letter-spacing:.1em;margin-top:4px}
.breakdown{width:100%;border-collapse:collapse;font-size:.94rem;margin-top:10px}
.breakdown th,.breakdown td{border-top:1px solid var(--rule-soft);padding:6px 4px;text-align:left}
.breakdown td.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:8px;border-radius:999px;background:var(--rule-soft);overflow:hidden;min-width:50px}
.bar span{display:block;height:100%;background:var(--accent)}
.bar span.low{background:var(--hot)}
.miss-list{display:grid;gap:10px;margin-top:10px}
.miss{background:var(--panel);border:1.5px solid var(--rule);border-left:6px solid var(--no);border-radius:6px;padding:12px 14px}
.miss .t{font-family:var(--f-mono);font-size:.76rem;font-weight:600;color:var(--muted);margin:0 0 4px}
.miss .q{font-weight:700;margin-bottom:6px}
.miss .r{font-size:.94rem;margin:2px 0}
.miss .lab{font-family:var(--f-display);font-weight:700;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}

/* ---------- knowledge points ---------- */
.kp-list{display:grid;gap:10px}
.kp-card{background:var(--ticket);border:1.5px solid var(--rule);border-radius:6px;padding:12px 14px}
.kp-card .t{font-family:var(--f-mono);font-size:.76rem;font-weight:600;color:var(--muted);margin:0 0 4px}
.kp-card .q{font-weight:700;margin:0 0 8px;font-size:1.04rem}
.kp-ans ul{margin:0 0 6px;padding-left:20px}
.kp-ans li{margin:2px 0}
.kp-card.hide:not(.shown) .kp-ans{display:none}
.ch-head{font-family:var(--f-display);font-weight:800;font-size:1.4rem;text-transform:uppercase;letter-spacing:.02em;margin:24px 0 8px;line-height:1.05}
.ch-head small{display:block;font-size:.8rem;color:var(--muted);letter-spacing:.12em}
.check{display:flex;gap:10px;align-items:flex-start;line-height:1.35;cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:6px;font-weight:700;z-index:60;max-width:calc(100vw - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="brand" data-act="home" aria-label="ServSafe Practice Kitchen: home">ServSafe Practice<small>Manager · 9th edition · NUTR248</small></button>
    <div class="top-right">
      <div class="timer" id="timer">
        <button class="t-face" id="tFace" aria-expanded="false" aria-controls="tPanel" aria-label="Timer settings">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.8M9.5 2.5h5M18.4 6.6l1.5-1.5"/></svg>
          <span id="tTime">Timer</span>
        </button>
        <button class="t-play" id="tPlay" aria-label="Start timer"></button>
      </div>
      <button class="icon-btn" id="themeBtn" aria-label="Switch to dark theme"></button>
    </div>
    <div class="t-panel" id="tPanel" hidden>
      <h2>Timer</h2>
      <div class="seg" role="group" aria-label="Timer type">
        <button data-tm="up" aria-pressed="true">Stopwatch</button>
        <button data-tm="down" aria-pressed="false">Countdown</button>
      </div>
      <div class="t-row" id="tMinRow" hidden><label for="tMin">Minutes</label><input id="tMin" type="number" inputmode="numeric" min="1" max="300" value="120"></div>
      <div class="t-big" id="tBig">00:00</div>
      <div class="btn-row" style="margin-top:0"><button class="btn primary" id="tStart">Start</button><button class="btn" id="tReset">Reset</button></div>
      <p class="t-note">Optional. Keeps running while you move around the site. The mock exam sets a 2-hour countdown for you.</p>
    </div>
  </div>
</header>
<main id="app" class="wrap"></main>

<script id="question-data" type="application/json">{"chapters":{"1":"Providing Safe Food","2":"Forms of Contamination","3":"The Safe Food Handler","4":"The Flow of Food: An Introduction","5":"The Flow of Food: Purchasing, Receiving, and Storage","6":"The Flow of Food: Preparation","7":"The Flow of Food: Service","8":"Food Safety Management Systems","9":"Safe Facilities and Pest Management","10":"Cleaning and Sanitizing"},"topics":[["fbi",1,"Foodborne illness and high-risk groups"],["unsafe",1,"How food becomes unsafe"],["tcs",1,"TCS and ready-to-eat food"],["mgr",1,"Manager role, training and inspections"],["growth",2,"Pathogen growth (FAT TOM)"],["big6",2,"Big Six pathogens and linked foods"],["toxins",2,"Viruses, parasites, fungi and biological toxins"],["chemphys",2,"Chemical and physical contaminants"],["defense",2,"Food defense"],["outbreak",2,"Responding to an outbreak"],["allergen",2,"Food allergens and cross-contact"],["handwash",3,"Handwashing and hand care"],["gloves",3,"Gloves and bare-hand contact"],["attire",3,"Work attire and personal behaviors"],["illness",3,"Reporting illness, restricting and excluding"],["xcontam",4,"Preventing cross-contamination"],["tdz",4,"Temperature danger zone and time-temperature abuse"],["thermo",4,"Thermometers and calibration"],["supplier",5,"Approved suppliers and recalls"],["recvtemp",5,"Receiving temperatures"],["recvpack",5,"Receiving: packaging, documents and quality"],["label",5,"Labeling and date marking"],["storage",5,"Storage temperature, rotation and order"],["thaw",6,"Thawing"],["prep",6,"Prepping specific foods and variances"],["cooktemp",6,"Minimum internal cooking temperatures"],["cool",6,"Cooling and reheating"],["advisory",6,"Consumer advisories and high-risk menus"],["hold",7,"Holding food and time as a control"],["serve",7,"Serving food safely"],["selfsvc",7,"Self-service, off-site service and vending"],["culture",8,"Food safety culture and active managerial control"],["haccp",8,"HACCP"],["selfinsp",8,"Self-inspections and monitoring"],["design",9,"Facility design, plan review and equipment"],["hwstation",9,"Handwashing stations"],["plumbing",9,"Water, plumbing and backflow"],["utilities",9,"Lighting, ventilation, garbage and wastewater"],["emerg",9,"Emergencies and imminent health hazards"],["pest",9,"Pest management"],["agents",10,"Cleaners, sanitizers and disinfectants"],["howclean",10,"How and when to clean and sanitize"],["dish",10,"Dishwashing"],["storeclean",10,"Storing tableware, cleaning tools and chemicals"],["program",10,"Cleaning programs and chemical use"]],"sources":["Kahoot Ch 4-6","SSM9E Activity Quiz 1","SSM9E Activity Quiz 2","SSM9E Activity Quiz 3","SSM9E Activity Quiz 4","SSM9E Activity Quiz 5","SSM9E Activity Quiz 6","SSM9E Activity Quiz 7","SSM9E Activity Quiz 8","SSM9E Activity Quiz 9","SSM9E Activity Quiz 10","Practice Test","Diagnostic Test","Mock ServSafe Test","Review Slide Deck"],"items":[{"id":"KH-02","src":"Kahoot Ch 4-6","no":"Q2","type":"mc","ch":4,"q":"Using one set of cutting boards for raw poultry and another set of cutting boards for RTE food reduces the risk of","opts":["cross-contamination.","time-temperature abuse.","physical contamination.","toxic-metal poison"],"ans":0,"assigned":false,"tp":"xcontam","ansText":"A. cross-contamination.","why":"Separate cutting boards for raw poultry and ready-to-eat food keep pathogens from raw food from spreading to food that won’t be cooked.","kn":"Link separate equipment to preventing cross-contamination. Time-temperature abuse and physical contamination are different hazards used as traps.","img":false,"web":true,"note":"Same question as MT-16."},{"id":"KH-03","src":"Kahoot Ch 4-6","no":"Q3","type":"mc","ch":4,"q":"Pathogens are likely to grow well in a meat stew that is","opts":["below freezing temperature.","at refrigeration temperatures.","between 41°F and 135°F (5°C and 57°C).","cooked to the correct internal temperature."],"ans":2,"assigned":false,"tp":"tdz","ansText":"C. between 41°F and 135°F (5°C and 57°C).","why":"Pathogens grow well between 41°F and 135°F (5°C and 57°C), the temperature danger zone.","kn":"Recall the temperature danger zone, 41–135°F (5–57°C). Freezing, refrigeration and correct cooking all slow or stop growth.","img":false,"web":true},{"id":"KH-04","src":"Kahoot Ch 4-6","no":"Q4","type":"mc","ch":4,"q":"What is the calibration nut on a bimetallic stemmed thermometer used for?","opts":["To mark its sensing area","To measure air temperature","To keep it accurate","To measure temperatures through glass"],"ans":2,"assigned":false,"tp":"thermo","ansText":"C. To keep it accurate","why":"The calibration nut on a bimetallic stemmed thermometer is used to adjust it so its readings stay accurate.","kn":"Know the parts of a bimetallic stemmed thermometer: the calibration nut keeps it accurate, while the dimple marks the sensing area (the trap).","img":false,"web":true},{"id":"KH-05","src":"Kahoot Ch 4-6","no":"Q5","type":"mc","ch":4,"q":"Which probe should be used to check the temperature of a pork roast?","opts":["Air","Surface","Immersion","Penetration"],"ans":3,"assigned":false,"tp":"thermo","ansText":"D. Penetration","why":"A penetration probe is used to check the internal temperature of thick food such as a roast.","kn":"Match probe types to uses: penetration for thick food, immersion for liquids, surface for flat cooking equipment, air for coolers and ovens.","img":false,"web":true},{"id":"KH-06","src":"Kahoot Ch 4-6","no":"Q6","type":"mc","ch":4,"q":"What do time-temperature indicators do?","opts":["Measure temperature through a probe with a sensor at the end","Measure the length of time that food should be cooked","Show if food has been cross-contaminated during preparation","Show if food has been time-temperature abused during shipment"],"ans":3,"assigned":false,"tp":"thermo","ansText":"D. Show if food has been time-temperature abused during shipment","why":"Time-temperature indicators (TTIs) change color permanently if food has been time-temperature abused during shipment or storage.","kn":"Know what a TTI does: shows past time-temperature abuse. It does not measure temperature through a probe or detect cross-contamination.","img":false,"web":true},{"id":"KH-07","src":"Kahoot Ch 4-6","no":"Q7","type":"mc","ch":4,"q":"When using the ice-point method to calibrate a thermometer, to what temperature should the thermometer be adjusted?","opts":["32°F (0°C)","0°F (-18°C)","41°F (5°C)","212°F (100°C)"],"ans":0,"assigned":false,"tp":"thermo","ansText":"A. 32°F (0°C)","why":"In the ice-point method, a thermometer in ice water is adjusted to read 32°F (0°C).","kn":"Recall the ice-point calibration temperature, 32°F (0°C). 212°F (100°C) is the boiling-point method, and 41°F is the cold-holding limit.","img":false,"web":true},{"id":"KH-09","src":"Kahoot Ch 4-6","no":"Q9","type":"mc","ch":5,"q":"What must a manager do with a recalled food item in the operation?","opts":["Combine the item with non-recalled items during preparation","Record the names of customers who purchase the item","Store the recalled item separately from other food","Sell all recalled items within 24 hours"],"ans":2,"assigned":false,"tp":"supplier","ansText":"C. Store the recalled item separately from other food","why":"A recalled item must be stored separately from other food (and labeled) so it isn’t used or sold.","kn":"Know the recall procedure: separate and label the item. Mixing it with other food, selling it quickly or tracking customers are the traps.","img":false,"web":true,"note":"Same question as DT-80."},{"id":"KH-10","src":"Kahoot Ch 4-6","no":"Q10","type":"mc","ch":5,"q":"What are the packaging criteria for accepting nonfood items?","opts":["Soiled but intact","Clean and no more than two tears or punctures","Soiled and no more than two tears or punctures","Intact, clean, and protected from contamination"],"ans":3,"assigned":false,"tp":"recvpack","ansText":"D. Intact, clean, and protected from contamination","why":"Nonfood items must arrive in packaging that is intact, clean and protects them from contamination.","kn":"Recall the packaging rule for nonfood items: intact and clean. Any soiled or torn packaging is grounds to reject.","img":false,"web":true},{"id":"KH-11","src":"Kahoot Ch 4-6","no":"Q11","type":"mc","ch":5,"q":"Supplies should be stored away from the walls and at least ________ off the floor.","opts":["2 inches (5 centimeters)","4 inches (10 centimeters)","5 inches (13 centimeters)","6 inches (15 centimeters)"],"ans":3,"assigned":false,"tp":"storage","ansText":"D. 6 inches (15 centimeters)","why":"Food and supplies must be stored away from walls and at least 6 inches (15 centimeters) off the floor.","kn":"Recall the 6-inch (15 cm) rule for storage. Smaller distances are traps.","img":false,"web":true,"note":"Similar to DT-32."},{"id":"KH-12","src":"Kahoot Ch 4-6","no":"Q12","type":"mc","ch":5,"q":"Ready-to-eat TCS food must be date marked if it will be held for longer than","opts":["12 hours.","24 hours.","36 hours.","48 hours."],"ans":1,"assigned":false,"tp":"label","ansText":"B. 24 hours.","why":"Ready-to-eat TCS food held for longer than 24 hours must be date-marked.","kn":"Recall the 24-hour date-marking trigger. The other hour values are traps.","img":false,"web":true,"note":"Same question as MT-05; similar to DT-44."},{"id":"KH-13","src":"Kahoot Ch 4-6","no":"Q13","type":"mc","ch":5,"q":"Which item is stored correctly in a cooler?","opts":["Macaroni salad stored above raw salmon","Raw ground pork stored below raw poultry","Raw poultry stored above raw pork roast","Sliced pineapple stored below raw steaks"],"ans":0,"assigned":false,"tp":"storage","ansText":"A. Macaroni salad stored above raw salmon","why":"Ready-to-eat food goes above raw food, and raw food is stored top to bottom by cooking temperature, with poultry on the bottom.","kn":"Apply the cooler storage order. Each trap puts a raw item above something that should be higher, such as poultry above pork or raw steak over pineapple.","img":false,"web":true,"note":"Same question as MT-12."},{"id":"KH-14","src":"Kahoot Ch 4-6","no":"Q14","type":"mc","ch":5,"q":"A food item that is received with an expired use-by date should be","opts":["used immediately.","accepted but labeled differently","accepted but kept separate from other items.","Rejected"],"ans":3,"assigned":false,"tp":"recvpack","ansText":"D. Rejected","why":"Food that arrives past its use-by or expiration date must be rejected.","kn":"Know the receiving rule for expired dates: reject. Accepting it with a new label or keeping it separate are traps.","img":false,"web":true},{"id":"KH-15","src":"Kahoot Ch 4-6","no":"Q15","type":"mc","ch":5,"q":"Milk can be received at 45°F (7°C) under what conditions?","opts":["It is thrown out after 2 days","It is immediately cooled to 41°F (5°C) or lower","It is cooled to 41°F (5°C) or lower in 4 hours","It is served or used in the operation within 2 hours"],"ans":2,"assigned":false,"tp":"recvtemp","ansText":"C. It is cooled to 41°F (5°C) or lower in 4 hours","why":"Milk may be received at 45°F (7°C) or lower, but must then be cooled to 41°F (5°C) or lower within four hours.","kn":"Recall the milk receiving exception and its four-hour cooling window. Traps: cooling immediately, discarding after two days, or a two-hour use rule.","img":false,"web":true},{"id":"KH-17","src":"Kahoot Ch 4-6","no":"Q17","type":"mc","ch":6,"q":"Which food must be separated from ready-to-eat food?","opts":["Raw nuts","Hard cheeses","Washed and peeled produce","Unwashed fruits and vegetables"],"ans":3,"assigned":false,"tp":"prep","ansText":"D. Unwashed fruits and vegetables","why":"Unwashed fruits and vegetables can carry soil and pathogens, so they must be kept separate from ready-to-eat food.","kn":"Know which produce needs separating: unwashed. Washed, peeled produce, hard cheese and raw nuts are not the cross-contamination risk here.","img":false,"web":true},{"id":"KH-18","src":"Kahoot Ch 4-6","no":"Q18","type":"mc","ch":6,"q":"A variance from the local regulatory authority is needed for","opts":["smoking food to preserve it.","developing a crisis-management plan.","using TCS leftovers to make salads.","using ice to cool food."],"ans":0,"assigned":false,"tp":"prep","ansText":"A. smoking food to preserve it.","why":"A variance is required for special processes such as smoking food as a way to preserve it (not just for flavor).","kn":"Recall which processes need a variance: smoking or curing to preserve, using additives, ROP, sprouting seeds and similar. Ice cooling and crisis plans don’t need one.","img":false,"web":true},{"id":"KH-19","src":"Kahoot Ch 4-6","no":"Q19","type":"mc","ch":6,"q":"What is one way that food should NEVER be thawed?","opts":["In a microwave","In a cooler","At room temperature","As part of the cooking process"],"ans":2,"assigned":false,"tp":"thaw","ansText":"C. At room temperature","why":"Food should never be thawed at room temperature because its surface sits in the temperature danger zone.","kn":"Know the four safe thawing methods and spot the unsafe one: room temperature. Microwave, cooler and cooking are all approved.","img":false,"web":true},{"id":"KH-20","src":"Kahoot Ch 4-6","no":"Q20","type":"mc","ch":6,"q":"What is the required minimum internal cooking temperature for a chicken breast?","opts":["135°F (57°C)","145°F (63°C) for 15 seconds","155°F (68°C) for 17 seconds","165°F (74°C) for <1 second"],"ans":3,"assigned":false,"tp":"cooktemp","ansText":"D. 165°F (74°C) for <1 second","why":"Poultry, including a chicken breast, must be cooked to 165°F (74°C) for less than 1 second (instantaneous).","kn":"Recall the poultry cooking temperature, 165°F (74°C). 155°F is for ground meat and 145°F for seafood and whole cuts, which are the traps.","img":false,"web":true},{"id":"KH-21","src":"Kahoot Ch 4-6","no":"Q21","type":"mc","ch":6,"q":"What temperature must soup that contains cooked beef be reheated to for hot holding?","opts":["135°F (57°C) for 15 seconds","145°F (63°C) for 15 seconds","155°F (68°C) for 15 seconds","165°F (74°C) for 15 seconds"],"ans":3,"assigned":false,"tp":"cool","ansText":"D. 165°F (74°C) for 15 seconds","why":"TCS food reheated for hot holding must reach 165°F (74°C) for 15 seconds within two hours, even though the beef was already cooked.","kn":"Recall the reheating-for-hot-holding temperature: 165°F for 15 seconds. The trap is thinking cooked beef only needs its original cooking temperature.","img":false,"web":true,"note":"Similar to DT-41 and PT-23."},{"id":"KH-22","src":"Kahoot Ch 4-6","no":"Q22","type":"mc","ch":6,"q":"Which food item would the FDA advise against offering on a children's menu?","opts":["Rare cheeseburgers","Peanut butter and jelly sandwiches","Cheese pizza","Fried shrimp"],"ans":0,"assigned":false,"tp":"advisory","ansText":"A. Rare cheeseburgers","why":"Operations serving high-risk groups such as young children should not offer raw or undercooked animal food, like rare burgers.","kn":"Tests the high-risk population rule: no raw or undercooked meat on a children’s menu. PB&J and peanuts raise allergen questions, not undercooking.","img":false,"web":true},{"id":"KH-23","src":"Kahoot Ch 4-6","no":"Q23","type":"mc","ch":6,"q":"When checking the internal temperature of food, where should the thermometer be inserted?","opts":["In the thinnest part of the food","In the thickest part of the food","On the bottom of the food","On the top of the food"],"ans":1,"assigned":false,"tp":"cooktemp","ansText":"B. In the thickest part of the food","why":"Insert the thermometer into the thickest part of the food, which is the last part to heat.","kn":"Know where to take the temperature: the thickest part. Thinnest, top and bottom readings can be misleadingly high.","img":false,"web":true,"note":"Similar to DT-35 and MT-35."},{"id":"KH-24","src":"Kahoot Ch 4-6","no":"Q24","type":"mc","ch":6,"q":"What is the required minimum internal cooking temperature for ground beef?","opts":["135°F (57°C)","145°F (63°C) for 15 seconds","155°F (68°C) for 17 seconds","165°F (74°C) for < 1 seconds"],"ans":2,"assigned":false,"tp":"cooktemp","ansText":"C. 155°F (68°C) for 17 seconds","why":"Ground beef must be cooked to 155°F (68°C) for 17 seconds.","kn":"Recall the ground meat cooking temperature, 155°F (68°C) for 17 seconds. 145°F is for whole cuts and 165°F for poultry.","img":false,"web":true,"note":"Similar to PT-17."},{"id":"KH-25","src":"Kahoot Ch 4-6","no":"Q25","type":"mc","ch":6,"q":"What must you do immediately after thawing food in a microwave?","opts":["Cool it","Cook it","Hold it","Freeze it"],"ans":1,"assigned":false,"tp":"thaw","ansText":"B. Cook it","why":"Food thawed in a microwave must be cooked immediately afterward, because parts of it may have warmed into the danger zone.","kn":"Know the microwave thawing rule: cook it right away. Holding, cooling or refreezing it are traps.","img":false,"web":true},{"id":"KH-26","src":"Kahoot Ch 4-6","no":"Q26","type":"mc","ch":6,"q":"A consumer advisory should be provided for menu items that contain TCS food that","opts":["is very spicy.","contains gluten.","is raw or undercooked.","is made with a Big Nine allergen."],"ans":2,"assigned":false,"tp":"advisory","ansText":"C. is raw or undercooked.","why":"A consumer advisory is required when TCS food is served raw or undercooked.","kn":"Recall the trigger for a consumer advisory: raw or undercooked TCS food. Allergens are handled by allergen notification, a different requirement.","img":false,"web":true,"note":"Similar to DT-51."},{"id":"KH-27","src":"Kahoot Ch 4-6","no":"Q27","type":"mc","ch":6,"q":"Food was cooled from 135°F to 70°F (57°C to 21°C) in 1 hour, then the food must cool from 70°F to 41°F (21°C to 5°C) within","opts":["4 hours","6 hours","2 hours","5 hours"],"ans":3,"assigned":false,"tp":"cool","ansText":"D. 5 hours","why":"Total cooling time is six hours, with no more than two for the first stage. If the first stage took one hour, five hours remain to reach 41°F (5°C).","kn":"Apply the six-hour total: time saved in the first stage carries over to the second. The trap is assuming the second stage is always exactly four hours.","img":false,"web":true,"note":"Similar to DT-39."},{"id":"AQ01-01","src":"SSM9E Activity Quiz 1","no":"True or False #1","ch":1,"tp":"unsafe","type":"tf","q":"A food handler’s hands can transfer pathogens from one food to another.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"Hands that touch raw food, the body or dirty surfaces can carry pathogens to the next food they touch.","kn":"Knowing that hands are a common route for moving pathogens between foods, which is why handwashing and glove changes matter.","img":false,"web":true,"mcq":{"q":"How can a food handler’s hands make food unsafe?","opts":["Hands can only contaminate food if they have a cut","Hands can carry pathogens from one food to another","Hands affect food safety only when handling raw meat","Hands spread pathogens only to food-contact surfaces"],"ans":1}},{"id":"AQ01-02","src":"SSM9E Activity Quiz 1","no":"True or False #2","ch":1,"tp":"unsafe","type":"tf","q":"Food handlers who don’t wash their hands correctly can cause a foodborne illness.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"Pathogens on unwashed hands get into food and can make people sick.","kn":"Linking poor personal hygiene, one of the ways food becomes unsafe, to actual illness.","img":false,"web":true,"mcq":{"q":"What can happen when food handlers don’t wash their hands correctly?","opts":["Pathogens on their hands can get into food and cause a foodborne illness","Nothing, as long as they wear gloves for part of the shift","Only the food handler is at risk of getting sick","Food quality drops, but food safety is not affected"],"ans":0}},{"id":"AQ01-03","src":"SSM9E Activity Quiz 1","no":"True or False #3","ch":1,"tp":"fbi","type":"tf","q":"A foodborne-illness outbreak is when two or more people get sick after eating at the same place.","opts":["True","False"],"ans":1,"ansText":"False","assigned":false,"why":"An outbreak is two or more people with the same symptoms after eating the same food, investigated and confirmed by regulators and lab analysis.","kn":"Knowing the outbreak definition: the trap is “same place.” It takes two or more people with the same symptoms after eating the same food, confirmed by investigation.","img":false,"web":true,"mcq":{"q":"What is a foodborne-illness outbreak?","opts":["Two or more people getting sick after eating at the same place, whatever food they ate","One person getting sick twice after eating at the same restaurant within a week","Two or more people sick from the same food, confirmed by an investigation","Any illness that a customer reports to the regulatory authority after eating out"],"ans":2}},{"id":"AQ01-04","src":"SSM9E Activity Quiz 1","no":"True or False #4","ch":1,"tp":"fbi","type":"tf","q":"Adults are more likely than preschool-age children to get sick from contaminated food.","opts":["True","False"],"ans":1,"ansText":"False","assigned":false,"why":"Preschool-age children are a high-risk population; healthy adults are not.","kn":"Recognizing high-risk populations: preschool-age children are more likely to get sick because their immune systems are not fully developed.","img":false,"web":true,"mcq":{"q":"Which group is at higher risk of getting sick from contaminated food?","opts":["Healthy adults","Preschool-age children","Teenagers","Adults who exercise regularly"],"ans":1}},{"id":"AQ01-05","src":"SSM9E Activity Quiz 1","no":"True or False #5","ch":1,"tp":"mgr","type":"tf","q":"Training needs can be identified by watching employee performance.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"Watching employees work (along with tests and inspection results) shows where training is needed.","kn":"Knowing how managers find training needs: observing staff at work shows what they are doing wrong.","img":false,"web":true,"mcq":{"q":"How can a manager identify training needs?","opts":["By watching employee performance on the job","By waiting for a regulatory inspection to point them out","By asking customers to rate employees","By reviewing employees’ hiring paperwork only"],"ans":0}},{"id":"AQ01-06","src":"SSM9E Activity Quiz 1","no":"How Food Becomes Unsafe #1","ch":1,"tp":"unsafe","type":"mc","q":"Leftover chili is cooled on the counter. How did the food become unsafe?","opts":["Cross-contamination","Poor personal hygiene","Time-temperature abuse","Poor cleaning and sanitizing"],"ans":2,"ansText":"C. Time-temperature abuse","assigned":false,"why":"Food cooled on a counter does not pass through the temperature danger zone fast enough.","kn":"Spotting time-temperature abuse: cooling at room temperature leaves food in the temperature danger zone too long.","img":false,"web":true},{"id":"AQ01-07","src":"SSM9E Activity Quiz 1","no":"How Food Becomes Unsafe #2","ch":1,"tp":"unsafe","type":"mc","q":"A food handler wearing gloves places a chicken breast on the grill and then places lettuce and tomato on a bun. How did the food become unsafe?","opts":["Cross-contamination","Poor personal hygiene","Time-temperature abuse","Poor cleaning and sanitizing"],"ans":0,"ansText":"A. Cross-contamination","assigned":false,"why":"Pathogens moved from the raw chicken to the lettuce and tomato on the same gloves; gloves must be changed between raw and ready-to-eat food.","kn":"Recognizing cross-contamination: the same gloves carried pathogens from raw chicken to ready-to-eat produce. Gloves don’t help if they aren’t changed between tasks.","img":false,"web":true},{"id":"AQ01-08","src":"SSM9E Activity Quiz 1","no":"How Food Becomes Unsafe #3","ch":1,"tp":"unsafe","type":"mc","q":"A food handler prepping a salad stops to scratch an itch on her arm and then returns to making the salad. How did the food become unsafe?","opts":["Cross-contamination","Poor personal hygiene","Time-temperature abuse","Poor cleaning and sanitizing"],"ans":1,"ansText":"B. Poor personal hygiene","assigned":false,"why":"Touching skin can pick up pathogens; hands must be washed before going back to food.","kn":"Recognizing poor personal hygiene: touching the body and then food without washing hands.","img":false,"web":true},{"id":"AQ01-09","src":"SSM9E Activity Quiz 1","no":"How Food Becomes Unsafe #4","ch":1,"tp":"unsafe","type":"mc","q":"After prepping raw chicken on a cutting board, a food handler wipes the board with a towel and then uses it to slice tomatoes for a salad. How did the food become unsafe?","opts":["Cross-contamination","Poor personal hygiene","Time-temperature abuse","Poor cleaning and sanitizing"],"ans":3,"ansText":"D. Poor cleaning and sanitizing","assigned":false,"why":"A food-contact surface must be cleaned and sanitized, not just wiped, between raw meat and ready-to-eat food.","kn":"Telling poor cleaning and sanitizing apart from cross-contamination: the root problem is that wiping is not cleaning and sanitizing the board.","img":false,"web":true},{"id":"AQ01-10","src":"SSM9E Activity Quiz 1","no":"How Food Becomes Unsafe #5","ch":1,"tp":"mgr","type":"mc","q":"What is the purpose of a regulatory health inspection?","opts":["To certify employees in food handling procedures","To ensure that an operation is meeting minimum food safety standards","To rate the cleanliness of the establishment for public display","To recognize establishments that exceed food safety expectations"],"ans":1,"ansText":"B. To ensure that an operation is meeting minimum food safety standards","assigned":false,"why":"Regulatory inspections check that an operation meets the minimum standards of the food code.","kn":"Knowing what inspections are for: checking that the operation meets minimum food safety standards, not certifying staff or rating the restaurant publicly.","img":false,"web":true},{"id":"AQ01-11","src":"SSM9E Activity Quiz 1","no":"TCS Food","ch":1,"tp":"tcs","type":"multi","q":"Which of these foods is, or contains, a TCS food? Select every one that applies.","opts":["Baked potatoes","Orange juice","Pizza with diced tomatoes and green pepper","Poached salmon","Refried beans","Scrambled shell eggs","Shrimp fried rice","Tofu ice cream","Vanilla milk shake","Whole-wheat bread"],"ans":[0,2,3,4,5,6,7,8],"ansText":"A, C, D, E, F, G, H, I: Baked potatoes; Pizza with diced tomatoes and green pepper; Poached salmon; Refried beans; Scrambled shell eggs; Shrimp fried rice; Tofu ice cream; Vanilla milk shake","assigned":false,"why":"TCS foods include cooked rice, potatoes and beans; cut tomatoes; seafood; eggs; tofu and soy protein; and milk and dairy products.","kn":"Recognizing TCS foods: cooked starches and vegetables, cut tomatoes, fish, beans, eggs, rice, tofu and dairy all need time and temperature control. Orange juice and bread do not.","img":false,"web":true,"mcq":{"q":"Which of these foods is NOT a TCS food?","opts":["Baked potatoes","Tofu ice cream","Whole-wheat bread","Refried beans"],"ans":2}},{"id":"AQ02-01","src":"SSM9E Activity Quiz 2","no":"True or False #1","ch":2,"tp":"growth","type":"tf","q":"All pathogens need oxygen to grow.","opts":["True","False"],"ans":1,"ansText":"False","assigned":false,"why":"Some pathogens need oxygen, but others grow without it (for example in reduced-oxygen packaging or cooked rice).","kn":"Knowing the O in FAT TOM: some pathogens need oxygen and others grow without it. The trap is the word “all.”","img":false,"web":true,"mcq":{"q":"Which statement about pathogens and oxygen is correct?","opts":["All pathogens need oxygen to grow","No pathogen can grow when oxygen is present","Some pathogens need oxygen to grow, and others grow without it","Pathogens need oxygen only at refrigeration temperatures"],"ans":2}},{"id":"AQ02-02","src":"SSM9E Activity Quiz 2","no":"True or False #2","ch":2,"tp":"toxins","type":"tf","q":"The most important way to prevent foodborne illnesses caused by viruses is to control time and temperature.","opts":["True","False"],"ans":1,"ansText":"False","assigned":false,"why":"Viruses don’t grow in food and aren’t always destroyed by cooking; good personal hygiene is the most important way to prevent them.","kn":"Knowing that viruses don’t grow in food, so personal hygiene (handwashing, excluding sick staff) is the key control, not time and temperature.","img":false,"web":true,"mcq":{"q":"What is the most important way to prevent foodborne illnesses caused by viruses?","opts":["Controlling time and temperature","Practicing good personal hygiene","Cooking all food to 165°F (74°C)","Freezing food before serving it"],"ans":1}},{"id":"AQ02-03","src":"SSM9E Activity Quiz 2","no":"True or False #3","ch":2,"tp":"big6","type":"tf","q":"Salmonella Typhi is commonly linked with ground beef.","opts":["True","False"],"ans":1,"ansText":"False","assigned":false,"why":"Salmonella Typhi is linked with ready-to-eat food and beverages; STEC is the pathogen linked with ground beef.","kn":"Matching pathogens to foods: Salmonella Typhi is linked with ready-to-eat food and beverages. Ground beef is linked with Shiga toxin-producing E. coli.","img":false,"web":true,"mcq":{"q":"Which food is Salmonella Typhi commonly linked with?","opts":["Ground beef","Rice and grains","Ready-to-eat food and beverages","Unwashed leafy greens only"],"ans":2}},{"id":"AQ02-04","src":"SSM9E Activity Quiz 2","no":"True or False #4","ch":2,"tp":"toxins","type":"tf","q":"Parasites are commonly associated with seafood.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"Parasites are commonly linked with seafood; buy from approved suppliers and cook or freeze fish correctly.","kn":"Recognizing seafood as the main food linked with parasites, which is why approved suppliers and freezing or cooking fish matter.","img":false,"web":true,"mcq":{"q":"Which food are parasites most commonly associated with?","opts":["Seafood","Cooked rice","Bottled water","Hard cheese"],"ans":0}},{"id":"AQ02-05","src":"SSM9E Activity Quiz 2","no":"True or False #5","ch":2,"tp":"defense","type":"tf","q":"The R in the acronym “Employees FIRST” reminds employees to rotate foods in storage.","opts":["True","False"],"ans":1,"ansText":"False","assigned":false,"why":"Employees FIRST: Follow the food defense plan, Inspect your work area, Recognize anything out of the ordinary, Secure ingredients and supplies, Tell management.","kn":"Recalling the food defense acronym: R stands for Recognize anything out of the ordinary. “Rotate” is a storage idea, not part of food defense.","img":false,"web":true,"mcq":{"q":"In the food defense acronym “Employees FIRST,” what does the R stand for?","opts":["Rotate foods in storage","Report illness to the manager","Restrict access to the kitchen","Recognize anything out of the ordinary"],"ans":3}},{"id":"AQ02-06","src":"SSM9E Activity Quiz 2","no":"True or False #6","ch":2,"tp":"allergen","type":"tf","q":"A restaurant must use table tents to notify people of the major allergens in their food.","opts":["True","False"],"ans":1,"ansText":"False","assigned":false,"why":"Customers must be told about major allergens, but table tents are only one acceptable way to do it.","kn":"Knowing that allergen notification can take several written forms (menus, placards, table tents, brochures); no single method is required. Watch for “must.”","img":false,"web":true,"mcq":{"q":"How must a restaurant notify customers about the major allergens in its food?","opts":["It must place table tents listing the allergens on every table","It must tell customers, and table tents are only one acceptable way","It must post one sign at the entrance, and nothing more is needed","It doesn’t need to unless a customer asks"],"ans":1}},{"id":"AQ02-07","src":"SSM9E Activity Quiz 2","no":"Pathogen Growth","ch":2,"tp":"growth","type":"list","q":"List the six conditions that pathogens need to grow.","ansList":["Food","Acidity","Temperature","Time","Oxygen","Moisture"],"ansText":"Food; Acidity; Temperature; Time; Oxygen; Moisture","assigned":false,"why":"FAT TOM: Food, Acidity, Temperature, Time, Oxygen, Moisture.","kn":"Recalling FAT TOM, the six conditions that let pathogens grow, which are also the levers used to control them.","img":false,"web":true},{"id":"AQ02-08","src":"SSM9E Activity Quiz 2","no":"Pathogens and Linked Food #1","ch":2,"tp":"big6","type":"multi","q":"Which foods are commonly linked with Hepatitis A? Select every one that applies.","opts":["Beverages","Eggs and poultry","Meat","Fish","Shellfish","Ready-to-eat food","Produce","Rice/grains","Milk/dairy products","Contaminated water"],"ans":[4,5,9],"ansText":"E, F, J: Shellfish; Ready-to-eat food; Contaminated water","assigned":false,"why":"Hepatitis A is linked with ready-to-eat food, shellfish from contaminated water, and contaminated water.","kn":"Matching Hepatitis A to its foods: shellfish from contaminated water, ready-to-eat food and contaminated water. It spreads through feces on hands, so RTE food is key.","img":false,"web":true,"mcq":{"q":"Which foods are commonly linked with Hepatitis A?","opts":["Beverages and ready-to-eat food","Shellfish, ready-to-eat food, and contaminated water","Ground beef and contaminated produce","Eggs, poultry, meat, and dairy products"],"ans":1}},{"id":"AQ02-09","src":"SSM9E Activity Quiz 2","no":"Pathogens and Linked Food #2","ch":2,"tp":"big6","type":"multi","q":"Which foods are commonly linked with Norovirus? Select every one that applies.","opts":["Beverages","Eggs and poultry","Meat","Fish","Shellfish","Ready-to-eat food","Produce","Rice/grains","Milk/dairy products","Contaminated water"],"ans":[4,5,9],"ansText":"E, F, J: Shellfish; Ready-to-eat food; Contaminated water","assigned":false,"why":"Norovirus is linked with ready-to-eat food, shellfish from contaminated water, and contaminated water.","kn":"Matching Norovirus to the same foods as Hepatitis A (shellfish, ready-to-eat food, water): both viruses spread through feces on hands and contaminated water.","img":false,"web":true,"mcq":{"q":"Which foods are commonly linked with Norovirus?","opts":["Ready-to-eat food, produce, and contaminated water","Eggs, poultry, meat, and dairy products","Ground beef and contaminated produce","Shellfish, ready-to-eat food, and contaminated water"],"ans":3}},{"id":"AQ02-10","src":"SSM9E Activity Quiz 2","no":"Pathogens and Linked Food #3","ch":2,"tp":"big6","type":"multi","q":"Which foods are commonly linked with Salmonella Typhi? Select every one that applies.","opts":["Beverages","Eggs and poultry","Meat","Fish","Shellfish","Ready-to-eat food","Produce","Rice/grains","Milk/dairy products","Contaminated water"],"ans":[0,5],"ansText":"A, F: Beverages; Ready-to-eat food","assigned":false,"why":"Salmonella Typhi lives only in humans and is linked with ready-to-eat food and beverages.","kn":"Matching Salmonella Typhi to ready-to-eat food and beverages. Don’t confuse it with nontyphoidal Salmonella, which is linked with poultry, eggs, meat, dairy and produce.","img":false,"web":true,"mcq":{"q":"Which foods are commonly linked with Salmonella Typhi?","opts":["Beverages and ready-to-eat food","Ground beef and contaminated produce","Eggs, poultry, meat, and dairy products","Cooked rice and other grains"],"ans":0}},{"id":"AQ02-11","src":"SSM9E Activity Quiz 2","no":"Pathogens and Linked Food #4","ch":2,"tp":"big6","type":"multi","q":"Which foods are commonly linked with Shigella spp.? Select every one that applies.","opts":["Beverages","Eggs and poultry","Meat","Fish","Shellfish","Ready-to-eat food","Produce","Rice/grains","Milk/dairy products","Contaminated water"],"ans":[5,6,9],"ansText":"F, G, J: Ready-to-eat food; Produce; Contaminated water","assigned":false,"why":"Shigella spp. is linked with food easily contaminated by hands, such as salads, and with produce and contaminated water.","kn":"Matching Shigella spp. to foods easily contaminated by hands (ready-to-eat food, produce) and to contaminated water.","img":false,"web":true,"mcq":{"q":"Which foods are commonly linked with Shigella spp.?","opts":["Eggs, poultry, meat, and dairy products","Beverages and ready-to-eat food","Ready-to-eat food, produce, and contaminated water","Cooked rice and other grains"],"ans":2}},{"id":"AQ02-12","src":"SSM9E Activity Quiz 2","no":"Pathogens and Linked Food #5","ch":2,"tp":"big6","type":"multi","q":"Which foods are commonly linked with Shiga toxin-producing Escherichia coli (STEC)? Select every one that applies.","opts":["Beverages","Eggs and poultry","Meat","Fish","Shellfish","Ready-to-eat food","Produce","Rice/grains","Milk/dairy products","Contaminated water"],"ans":[2,6],"ansText":"C, G: Meat; Produce","assigned":false,"why":"STEC is found in the intestines of cattle and is linked with ground beef and contaminated produce.","kn":"Matching STEC to raw ground beef (meat) and contaminated produce; it lives in the intestines of cattle.","img":false,"web":true,"mcq":{"q":"Which foods are commonly linked with Shiga toxin-producing E. coli (STEC)?","opts":["Shellfish and contaminated water","Ground beef (meat) and produce","Beverages and ready-to-eat food","Cooked rice and other grains"],"ans":1}},{"id":"AQ02-13","src":"SSM9E Activity Quiz 2","no":"Pathogens and Linked Food #6","ch":2,"tp":"big6","type":"multi","q":"Which foods are commonly linked with nontyphoidal Salmonella? Select every one that applies.","opts":["Beverages","Eggs and poultry","Meat","Fish","Shellfish","Ready-to-eat food","Produce","Rice/grains","Milk/dairy products","Contaminated water"],"ans":[1,2,6,8],"ansText":"B, C, G, I: Eggs and poultry; Meat; Produce; Milk/dairy products","assigned":false,"why":"Many farm animals carry nontyphoidal Salmonella; it is linked with poultry and eggs, meat, milk and dairy products, and produce.","kn":"Matching nontyphoidal Salmonella to animal foods carried by farm animals (poultry, eggs, meat, dairy) plus produce.","img":false,"web":true,"mcq":{"q":"Which foods are commonly linked with nontyphoidal Salmonella?","opts":["Shellfish, ready-to-eat food, and contaminated water","Beverages and ready-to-eat food only","Cooked rice, pasta, and other grains","Eggs, poultry, meat, dairy, and produce"],"ans":3}},{"id":"AQ02-14","src":"SSM9E Activity Quiz 2","no":"Contaminants","ch":2,"tp":"chemphys","type":"list","q":"What are the three types of contaminants that are a risk to food? Give an example of each.","ansList":["Biological: bacteria, viruses, parasites, fungi, or toxins from plants, mushrooms and seafood","Physical: foreign objects such as dirt, broken glass, metal staples or bones","Chemical: cleaners, sanitizers or polishes"],"ansText":"Biological: bacteria, viruses, parasites, fungi, or toxins from plants, mushrooms and seafood; Physical: foreign objects such as dirt, broken glass, metal staples or bones; Chemical: cleaners, sanitizers or polishes","assigned":false,"why":"Contaminants are biological, chemical or physical.","kn":"Recalling the three contaminant types and being able to give a real example of each.","img":false,"web":true},{"id":"AQ03-01","src":"SSM9E Activity Quiz 3","no":"True or False #1","ch":3,"tp":"handwash","type":"tf","q":"You should wash your hands after taking a break to smoke.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"Smoking puts hands near the mouth; wash hands before returning to work.","kn":"Knowing when to wash hands: after smoking, eating, drinking or chewing gum, before going back to food.","img":false,"web":true,"mcq":{"q":"When should a food handler wash their hands after a smoking break?","opts":["Only if they touched food before the break","Only at the end of the shift","Before returning to work","Only if the break lasted more than 15 minutes"],"ans":2}},{"id":"AQ03-02","src":"SSM9E Activity Quiz 3","no":"True or False #2","ch":3,"tp":"handwash","type":"tf","q":"You should not have painted fingernails when prepping food.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"Nail polish can disguise dirt under the nails and can flake off into food.","kn":"Knowing hand-care rules: nail polish can hide dirt and flake into food (unless gloves are worn over it).","img":false,"web":true,"mcq":{"q":"Why shouldn’t food handlers wear nail polish when prepping food?","opts":["It can hide dirt under the nails and flake off into food","It makes single-use gloves tear more easily","It reacts with sanitizer on food-contact surfaces","It is allowed if gloves are not being worn"],"ans":0}},{"id":"AQ03-03","src":"SSM9E Activity Quiz 3","no":"True or False #3","ch":3,"tp":"attire","type":"tf","q":"Wearing a dirty uniform or apron can contaminate food.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"Dirty clothing may hold pathogens; wear clean clothing every day and change aprons when they get dirty.","kn":"Knowing why work attire matters: dirty clothes carry pathogens that can reach food.","img":false,"web":true,"mcq":{"q":"What should a food handler do about a dirty uniform or apron?","opts":["Keep wearing it until the end of the shift","Wipe it down with sanitizer and keep working","Wear it only while handling raw meat","Change it, because it can contaminate food"],"ans":3}},{"id":"AQ03-04","src":"SSM9E Activity Quiz 3","no":"True or False #4","ch":3,"tp":"handwash","type":"tf","q":"Use hand antiseptic before washing hands.","opts":["True","False"],"ans":1,"ansText":"False","assigned":false,"why":"Hand antiseptics must be used only after handwashing, never in place of it.","kn":"Knowing that hand antiseptic is used only after correct handwashing, never before or instead of it.","img":false,"web":true,"mcq":{"q":"When should hand antiseptic be used?","opts":["Before washing hands","Only after washing hands, never in place of it","Instead of washing hands when the sink is busy","Only after putting on single-use gloves"],"ans":1}},{"id":"AQ03-05","src":"SSM9E Activity Quiz 3","no":"True or False #5","ch":3,"tp":"gloves","type":"tf","q":"Cut-resistant gloves must be smooth and nonabsorbent.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"Cut-resistant gloves must have a smooth, durable, nonabsorbent surface, or be covered with a single-use glove, when used with ready-to-eat food.","kn":"Knowing the surface rule for cut-resistant gloves so they can be kept clean and don’t hold pathogens.","img":false,"web":true,"note":"The FDA Food Code applies this rule when cut-resistant gloves touch ready-to-eat food; otherwise they may be covered with a single-use glove. The quiz key marks it True.","mcq":{"q":"What kind of surface must cut-resistant gloves have when used with ready-to-eat food?","opts":["Textured and absorbent, for a better grip","Any surface, as long as they are washed daily","Smooth and nonabsorbent (or covered with a single-use glove)","Rough and breathable, to keep hands dry"],"ans":2}},{"id":"AQ03-06","src":"SSM9E Activity Quiz 3","no":"Handwashing Steps","ch":3,"tp":"handwash","type":"order","q":"Put the handwashing steps in the correct order.","opts":["Vigorously scrub hands and arms for at least 10 to 15 seconds.","Apply enough soap to build up a good lather.","Dry hands and arms with a single-use paper towel or a hand dryer.","Wet your hands and arms with warm running water.","Rinse your hands and arms thoroughly under warm running water."],"ans":[3,1,0,4,2],"ansText":"1. Wet your hands and arms with warm running water. (D); 2. Apply enough soap to build up a good lather. (B); 3. Vigorously scrub hands and arms for at least 10 to 15 seconds. (A); 4. Rinse your hands and arms thoroughly under warm running water. (E); 5. Dry hands and arms with a single-use paper towel or a hand dryer. (C)","assigned":false,"why":"Wet with warm running water, apply soap, scrub 10 to 15 seconds, rinse, then dry; the whole process takes at least 20 seconds.","kn":"Recalling the handwashing sequence, including scrubbing for 10 to 15 seconds and drying with a single-use towel or hand dryer.","img":false,"web":true,"mcq":{"q":"What is the correct order of the handwashing steps?","opts":["Apply soap → wet hands and arms → scrub 10–15 seconds → rinse → dry","Wet hands and arms → apply soap → rinse → scrub 10–15 seconds → dry","Wet hands and arms → apply soap → scrub 10–15 seconds → rinse → dry","Wet hands and arms → scrub 10–15 seconds → apply soap → rinse → dry"],"ans":2}},{"id":"AQ03-07","src":"SSM9E Activity Quiz 3","no":"Actions That Can Contaminate Food","ch":3,"tp":"attire","type":"multi","q":"Which of these actions can contaminate food? Select every one that applies.","opts":["Touching your hair, face, or body","Wearing a hat while prepping food","Handling money","Wearing a clean apron","Sneezing, coughing, or using a tissue"],"ans":[0,2,4],"ansText":"A, C, E: Touching your hair, face, or body; Handling money; Sneezing, coughing, or using a tissue","assigned":false,"why":"Touching the body, handling money and sneezing or coughing all put pathogens on hands or food.","kn":"Spotting personal behaviors that contaminate food: touching hair, face or body, handling money, and sneezing or coughing. A hat and a clean apron protect food.","img":false,"web":true,"mcq":{"q":"Which of these actions does NOT contaminate food?","opts":["Touching your hair, face, or body","Handling money","Wearing a clean apron","Sneezing, coughing, or using a tissue"],"ans":2}},{"id":"AQ03-08","src":"SSM9E Activity Quiz 3","no":"Exclude or Restrict? #1","ch":3,"tp":"illness","type":"mc","q":"A food handler at a hospital has a sore throat and a fever. Should the food handler be excluded or restricted?","opts":["Exclude from the operation","Restrict from working with or around food"],"ans":0,"ansText":"A. Exclude from the operation","assigned":false,"why":"Sore throat with fever: restrict, but exclude if the operation primarily serves a high-risk population.","kn":"Knowing that sore throat with fever means restrict, except in an operation serving a high-risk population (like a hospital), where it means exclude.","img":false,"web":true},{"id":"AQ03-09","src":"SSM9E Activity Quiz 3","no":"Exclude or Restrict? #2","ch":3,"tp":"illness","type":"mc","q":"A food handler at a nursing home has jaundice from an infectious condition. Should the food handler be excluded or restricted?","opts":["Exclude from the operation","Restrict from working with or around food"],"ans":0,"ansText":"A. Exclude from the operation","assigned":false,"why":"Food handlers with jaundice must be excluded and the regulatory authority notified.","kn":"Knowing that jaundice is always an exclusion (and must be reported to the regulatory authority).","img":false,"web":true},{"id":"AQ03-10","src":"SSM9E Activity Quiz 3","no":"Exclude or Restrict? #3","ch":3,"tp":"illness","type":"mc","q":"A food handler at a restaurant was vomiting this morning from an infectious condition. Should the food handler be excluded or restricted?","opts":["Exclude from the operation","Restrict from working with or around food"],"ans":0,"ansText":"A. Exclude from the operation","assigned":false,"why":"Vomiting and diarrhea mean exclusion until symptom-free for 24 hours or cleared by a medical practitioner.","kn":"Knowing that vomiting from an infectious condition means exclude, in any operation.","img":false,"web":true},{"id":"AQ03-11","src":"SSM9E Activity Quiz 3","no":"Exclude or Restrict? #4","ch":3,"tp":"illness","type":"mc","q":"A food handler at a restaurant has been diagnosed with an illness caused by Salmonella Typhi. Should the food handler be excluded or restricted?","opts":["Exclude from the operation","Restrict from working with or around food"],"ans":0,"ansText":"A. Exclude from the operation","assigned":false,"why":"A food handler diagnosed with Salmonella Typhi must be excluded and the illness reported to the regulatory authority.","kn":"Knowing that a diagnosis with one of the Big Six pathogens, such as Salmonella Typhi, means exclude.","img":false,"web":true},{"id":"AQ04-01","src":"SSM9E Activity Quiz 4","no":"True or False #1","ch":4,"tp":"xcontam","type":"tf","q":"Rinsing a cutting board will prevent cross-contamination with the next food item placed on it.","opts":["True","False"],"ans":1,"ansText":"False","assigned":false,"why":"Surfaces must be cleaned and sanitized between tasks; a rinse does not remove pathogens.","kn":"Knowing that only cleaning and sanitizing a surface prevents cross-contamination; rinsing alone leaves pathogens behind.","img":false,"web":true,"mcq":{"q":"After cutting raw chicken, what must be done to the cutting board before the next food is placed on it?","opts":["Rinse it with hot water","Wipe it with a dry towel","Clean and sanitize it","Turn it over and use the other side"],"ans":2}},{"id":"AQ04-02","src":"SSM9E Activity Quiz 4","no":"True or False #2","ch":4,"tp":"thermo","type":"tf","q":"Some thermometers cannot be calibrated.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"Some thermometers can’t be adjusted; follow the manufacturer’s directions to check their accuracy.","kn":"Knowing that some thermometers (such as many digital ones) can’t be calibrated, so follow the manufacturer’s directions.","img":false,"web":true,"mcq":{"q":"Which statement about calibrating thermometers is correct?","opts":["Every thermometer can be calibrated by turning its calibration nut","Some thermometers cannot be calibrated, so follow the manufacturer’s directions","Only infrared thermometers need to be calibrated","Digital thermometers never need their accuracy checked by anyone in the operation"],"ans":1}},{"id":"AQ04-03","src":"SSM9E Activity Quiz 4","no":"True or False #3","ch":4,"tp":"tdz","type":"tf","q":"Chicken held at an internal temperature of 125°F (52°C) has been time-temperature abused.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"Hot TCS food must be held at 135°F (57°C) or higher; 125°F is inside the temperature danger zone.","kn":"Applying the temperature danger zone: 125°F is between 41°F and 135°F, so hot-held chicken at that temperature has been abused.","img":false,"web":true,"mcq":{"q":"Hot-held chicken has an internal temperature of 125°F (52°C). What does this mean?","opts":["It is being held correctly","It is safe if it is served within 24 hours","It has been time-temperature abused","It is safe because it is above 120°F (49°C)"],"ans":2}},{"id":"AQ04-04","src":"SSM9E Activity Quiz 4","no":"Cross-Contamination","ch":4,"tp":"xcontam","type":"list","q":"Name two ways you can prevent cross-contamination.","ansList":["Use separate equipment for raw and ready-to-eat food","Clean and sanitize all work surfaces, equipment and utensils before and after each task","Prep raw meat, fish and poultry and ready-to-eat food at different times","Buy prepared food"],"need":2,"ansText":"Any 2 of: Use separate equipment for raw and ready-to-eat food; Clean and sanitize all work surfaces, equipment and utensils before and after each task; Prep raw meat, fish and poultry and ready-to-eat food at different times; Buy prepared food","assigned":false,"why":"Separating raw and ready-to-eat food by equipment or time, and cleaning and sanitizing between tasks, all prevent cross-contamination.","kn":"Recalling practical ways to keep raw food away from ready-to-eat food: separate equipment, clean and sanitize between tasks, prep at different times, or buy prepared food.","img":false,"web":true},{"id":"AQ04-05","src":"SSM9E Activity Quiz 4","no":"Temperature Danger Zone #1","ch":4,"tp":"tdz","type":"fill","q":"The temperature danger zone is ____°F (____°C) to ____°F (____°C).","ansText":"41°F (5°C) to 135°F (57°C)","assigned":false,"why":"Pathogens grow between 41°F (5°C) and 135°F (57°C).","kn":"Recalling the temperature danger zone range in both units.","img":false,"web":true,"mcq":{"q":"What is the temperature danger zone?","opts":["70°F to 125°F (21°C to 52°C)","32°F to 165°F (0°C to 74°C)","41°F to 135°F (5°C to 57°C)","45°F to 140°F (7°C to 60°C)"],"ans":2}},{"id":"AQ04-06","src":"SSM9E Activity Quiz 4","no":"Temperature Danger Zone #2","ch":4,"tp":"tdz","type":"fill","q":"Foodborne pathogens grow most quickly between ____°F (____°C) and ____°F (____°C).","ansText":"70°F (21°C) to 125°F (52°C)","assigned":false,"why":"Growth is fastest between 70°F (21°C) and 125°F (52°C).","kn":"Recalling the narrower range of fastest growth inside the danger zone. Don’t mix it up with the full 41°F–135°F zone.","img":false,"web":true,"mcq":{"q":"Between which temperatures do foodborne pathogens grow most quickly?","opts":["41°F to 135°F (5°C to 57°C)","70°F to 125°F (21°C to 52°C)","135°F to 165°F (57°C to 74°C)","32°F to 70°F (0°C to 21°C)"],"ans":1}},{"id":"AQ04-07","src":"SSM9E Activity Quiz 4","no":"General Thermometer Guidelines #1","ch":4,"tp":"thermo","type":"fill","q":"Thermometers used to measure the temperature of food must be accurate to ____.","ansText":"+/- 2°F or +/- 1°C","assigned":false,"why":"Food thermometers must be accurate to within ±2°F or ±1°C.","kn":"Recalling the accuracy requirement for food thermometers.","img":false,"web":true,"mcq":{"q":"Thermometers used to measure the temperature of food must be accurate to within","opts":["±2°F or ±1°C","±4°F or ±2°C","±5°F or ±3°C","±10°F or ±6°C"],"ans":0}},{"id":"AQ04-08","src":"SSM9E Activity Quiz 4","no":"General Thermometer Guidelines #2","ch":4,"tp":"thermo","type":"fill","q":"Place a probe into the ____ part of the food.","ansText":"thickest","assigned":false,"why":"The thickest part of the food is usually the last to reach a safe temperature.","kn":"Knowing where to take a food’s temperature: the thickest part, which heats and cools most slowly.","img":false,"web":true,"mcq":{"q":"Where should you insert a thermometer probe to check the temperature of food?","opts":["Into the thinnest part of the food","Into the thickest part of the food","Against the surface of the food","Into the edge nearest the heat"],"ans":1}},{"id":"AQ04-09","src":"SSM9E Activity Quiz 4","no":"General Thermometer Guidelines #3","ch":4,"tp":"thermo","type":"fill","q":"Wait ____ seconds after inserting a bimetallic stemmed thermometer before recording the temperature of a food.","ansText":"15","assigned":false,"why":"Wait at least 15 seconds after inserting the stem before reading it.","kn":"Recalling how long a bimetallic stemmed thermometer needs to give a steady reading.","img":false,"web":true,"mcq":{"q":"After inserting a bimetallic stemmed thermometer into food, how long should you wait before recording the temperature?","opts":["5 seconds","15 seconds","30 seconds","60 seconds"],"ans":1}},{"id":"AQ04-10","src":"SSM9E Activity Quiz 4","no":"General Thermometer Guidelines #4","ch":4,"tp":"thermo","type":"fill","q":"Make sure your thermometers are accurate by ____ them regularly.","ansText":"calibrating","assigned":false,"why":"Calibrate thermometers regularly, for example with the ice-point method.","kn":"Knowing that calibration keeps thermometers accurate.","img":false,"web":true,"mcq":{"q":"How do you make sure your thermometers stay accurate?","opts":["Sanitize them after every use","Replace them every month","Calibrate them regularly","Store them in a cooler"],"ans":2}},{"id":"AQ04-11","src":"SSM9E Activity Quiz 4","no":"General Thermometer Guidelines #5","ch":4,"tp":"thermo","type":"fill","q":"Sanitize thermometers by using a sanitizing solution appropriate for ____ surfaces.","ansText":"food-contact","assigned":false,"why":"Thermometer probes touch food, so use a sanitizer approved for food-contact surfaces.","kn":"Knowing that a thermometer stem is a food-contact surface and must be cleaned and sanitized like one.","img":false,"web":true,"mcq":{"q":"Thermometers must be sanitized with a sanitizing solution meant for which surfaces?","opts":["Nonfood-contact surfaces","Floors and walls","Food-contact surfaces","Restroom fixtures"],"ans":2}},{"id":"AQ05-01","src":"SSM9E Activity Quiz 5","no":"True or False #1","ch":5,"tp":"storage","type":"tf","q":"You can store food in any durable container that you can cover.","opts":["True","False"],"ans":1,"ansText":"False","assigned":false,"why":"Store food in containers intended for food that are durable, leakproof and able to be sealed or covered.","kn":"Knowing that storage containers must also be designed for food (food-grade) and leakproof; durable and covered isn’t enough. Watch for “any.”","img":false,"web":true,"mcq":{"q":"Which containers can be used to store food?","opts":["Any durable container that can be covered, including clean, empty chemical buckets","Food-grade containers that are durable, leakproof and can be sealed or covered","Clean containers that once held chemicals, as long as they are rinsed first","Any container at all, as long as it is labeled with the food’s name and date"],"ans":1}},{"id":"AQ05-02","src":"SSM9E Activity Quiz 5","no":"True or False #2","ch":5,"tp":"storage","type":"tf","q":"Arrange stored food by its use-by date so that you use the oldest food first.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"FIFO: store items with the earliest use-by or expiration dates in front of later ones and use them first.","kn":"Knowing first-in, first-out (FIFO) rotation: earliest use-by dates go in front and get used first.","img":false,"web":true,"mcq":{"q":"How should stored food be arranged?","opts":["By use-by date, so the oldest food is used first","By size, with the largest items in front","By delivery date, so the newest food is used first","Alphabetically, so food is easy to find"],"ans":0}},{"id":"AQ05-03","src":"SSM9E Activity Quiz 5","no":"True or False #3","ch":5,"tp":"recvtemp","type":"tf","q":"You should reject a delivery of frozen steaks covered in ice crystals.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"Frozen food with large ice crystals or frozen liquids has been th
