no":"Slide 103","ch":6,"tp":"cool","type":"mc","q":"Which food will cool quicker? (The slide shows refried beans and mashed potatoes in two different containers; the picture isn’t in the file.)","assigned":true,"why":"Stainless steel transfers heat away from food faster than plastic, so the food in the stainless steel container cools quicker. Which food that is depends on the picture.","kn":"Knowing that the container’s material affects cooling speed: stainless steel cools food faster than plastic.","img":true,"web":false,"conf":"low","opts":["Refried beans","Mashed potatoes"],"ans":null,"ansText":"Can’t be determined: the slide’s picture isn’t in the file"},{"id":"RD-104","src":"Review Slide Deck","no":"Slide 104","ch":6,"tp":"cool","type":"mc","q":"Which food will cool quicker: refried beans or chicken broth?","assigned":false,"why":"The chicken broth is less dense. The denser the food, the more slowly it will cool.","kn":"Knowing that food density affects cooling: thin liquids cool faster than dense food like refried beans.","img":false,"web":true,"note":"The slide labels the two pictures A and B; the options here use the food names instead.","opts":["Refried beans","Chicken broth"],"ans":1,"ansText":"B. Chicken broth"},{"id":"RD-105","src":"Review Slide Deck","no":"Slide 105","ch":6,"tp":"cool","type":"mc","q":"What temperature should a beef sandwich for immediate service be reheated to?","assigned":false,"why":"Food that will be served immediately can be reheated to any temperature.","kn":"Separating reheating for immediate service (any temperature) from reheating for hot holding (165°F for 15 seconds within two hours).","img":false,"web":true,"opts":["145°F (63°C)","165°F (74°C)","Any temperature"],"ans":2,"ansText":"C. Any temperature"},{"id":"RD-108","src":"Review Slide Deck","no":"Slide 108","ch":7,"tp":"hold","type":"mc","q":"Can the temperature gauge on a holding unit be used to check the temperature of the food inside?","assigned":false,"why":"The temperature gauge does not check the internal temperature of the food.","kn":"Knowing that holding temperatures are checked in the food itself with a thermometer, not read off the unit’s gauge.","img":false,"web":true,"opts":["Yes","No"],"ans":1,"ansText":"B. No"},{"id":"RD-109","src":"Review Slide Deck","no":"Slide 109","ch":7,"tp":"hold","type":"mc","q":"Can you use a hot-holding unit to reheat food?","assigned":false,"why":"Most hot-holding units will not pass food through the temperature danger zone quickly enough. Reheat the food correctly, then move it to a holding unit.","kn":"Knowing that holding units hold, not reheat: food must be reheated first, then moved into the unit.","img":false,"web":true,"opts":["Yes","No"],"ans":1,"ansText":"B. No"},{"id":"RD-110","src":"Review Slide Deck","no":"Slide 110","ch":7,"tp":"hold","type":"list","q":"Cold ready-to-eat TCS food can be held without temperature control for up to four hours if which criteria are met?","assigned":false,"why":"Time can be used instead of temperature control for a limited period if these conditions are met.","kn":"Recalling the four-hour time-as-control rules for cold food: start at 41°F or lower, label a 4-hour discard time, and use or discard within 4 hours.","img":false,"web":true,"ansList":["The food must be held at 41°F (5°C) or lower before removing it from temperature control","The discard time must be four hours from the time it was removed from temperature control","The food must be sold, served, or thrown out within four hours","If it is discarded within four hours, the food can be allowed to reach any temperature"],"ansText":"The food must be held at 41°F (5°C) or lower before removing it from temperature control; The discard time must be four hours from the time it was removed from temperature control; The food must be sold, served, or thrown out within four hours; If it is discarded within four hours, the food can be allowed to reach any temperature"},{"id":"RD-111","src":"Review Slide Deck","no":"Slide 111","ch":7,"tp":"hold","type":"list","q":"Produce that becomes TCS when cut, chopped, or sliced, and hermetically sealed food that becomes TCS when opened, can be held without temperature control if which four criteria are met?","assigned":false,"why":"These items start out safe at room temperature, so the clock starts when they become TCS food.","kn":"Recalling the special time-as-control rules for freshly cut produce and opened sealed food: start at 70°F or lower and stay at or below 70°F.","img":false,"web":true,"ansList":["It has an initial temperature of 70°F (21°C) or lower","It must be discarded within four hours","It cannot exceed 70°F (21°C) within the four-hour period","It must be labeled with a discard time four hours from when it became a TCS food"],"ansText":"It has an initial temperature of 70°F (21°C) or lower; It must be discarded within four hours; It cannot exceed 70°F (21°C) within the four-hour period; It must be labeled with a discard time four hours from when it became a TCS food"},{"id":"RD-112","src":"Review Slide Deck","no":"Slide 112","ch":7,"tp":"hold","type":"list","q":"Hot ready-to-eat TCS food can be held without temperature control if which criteria are met?","assigned":false,"why":"Hot food held by time alone must start hot, be labeled, and be used or thrown out within four hours.","kn":"Recalling the hot-food time-as-control rules: start at 135°F or higher, label the discard time, and use or discard within 4 hours.","img":false,"web":true,"note":"The slide lists “It is thrown out after 4 hours” as a fourth item, which repeats the third; it is folded in here.","ansList":["It was held at 135°F (57°C) or higher before removing it from temperature control","It has a label specifying when the item must be thrown out","It is sold, served, or thrown out within four hours"],"ansText":"It was held at 135°F (57°C) or higher before removing it from temperature control; It has a label specifying when the item must be thrown out; It is sold, served, or thrown out within four hours"},{"id":"RD-113","src":"Review Slide Deck","no":"Slide 113","ch":7,"tp":"serve","type":"mc","q":"A food handler garnishes plates with parsley using bare hands. Is this food item being handled safely?","assigned":false,"why":"Food handlers must wear single-use gloves (or use utensils) when handling ready-to-eat food, such as parsley.","kn":"Knowing that garnishes are ready-to-eat food and can’t be handled with bare hands.","img":true,"web":true,"opts":["Yes","No"],"ans":1,"ansText":"B. No"},{"id":"RD-114","src":"Review Slide Deck","no":"Slide 114","ch":7,"tp":"serve","type":"mc","q":"Are these food items’ serving utensils being handled safely? (The slide’s picture isn’t in the file.)","assigned":true,"why":"Serving utensils should be stored in the food with the handle extended above the rim of the container, or on a clean and sanitized food-contact surface.","kn":"Knowing the safe ways to store serving utensils between uses: in the food with the handle above the rim, or on a clean and sanitized surface.","img":true,"web":false,"conf":"low","note":"The slide only states the rule; “No” assumes the picture shows utensils stored the wrong way.","opts":["Yes","No"],"ans":1,"ansText":"B. No"},{"id":"RD-115","src":"Review Slide Deck","no":"Slide 115","ch":7,"tp":"serve","type":"mc","q":"A serving utensil is placed on a clean and sanitized plate between uses. Is this food item being handled safely?","assigned":false,"why":"You can place serving utensils on a clean and sanitized food-contact surface, like this plate. You can also store them in the food with the handle extended above the rim of the container.","kn":"Knowing both acceptable places to keep serving utensils between uses.","img":true,"web":true,"opts":["Yes","No"],"ans":0,"ansText":"A. Yes"},{"id":"RD-116","src":"Review Slide Deck","no":"Slide 116","ch":7,"tp":"selfsvc","type":"mc","q":"Is this food being delivered safely? (The slide’s picture isn’t in the file.)","assigned":true,"why":"Food should be delivered in insulated, food-grade containers designed to stop food from mixing, leaking, or spilling.","kn":"Knowing what off-site delivery requires: insulated, food-grade containers that keep food separate and contained.","img":true,"web":false,"conf":"low","note":"The slide only states the rule; “No” assumes the picture shows food delivered without proper containers.","opts":["Yes","No"],"ans":1,"ansText":"B. No"},{"id":"RD-117","src":"Review Slide Deck","no":"Slide 117","ch":7,"tp":"selfsvc","type":"mc","q":"How often must TCS food in vending machines be checked?","assigned":true,"why":"Check the shelf life of products in vending machines daily, and throw out food that is past its use-by or expiration date.","kn":"Recalling the daily check for vending machine food.","img":false,"web":true,"conf":"medium","opts":["Every day","Every 3 days","Every 4 days","Every 7 days"],"ans":0,"ansText":"A. Every day"},{"id":"RD-119","src":"Review Slide Deck","no":"Slide 119","ch":8,"tp":"culture","type":"list","q":"According to the FDA, active managerial control is the purposeful use of specific actions or procedures by management to control foodborne-illness risk factors. Name the five most common risk factors it targets.","assigned":false,"why":"These are the five risk factors the CDC and FDA identify as most often responsible for foodborne illness.","kn":"Recalling the five CDC/FDA risk factors that active managerial control is built around.","img":false,"web":true,"ansList":["Purchasing food from unsafe sources","Failing to cook food correctly","Holding food at incorrect temperatures","Using contaminated equipment","Practicing poor personal hygiene"],"ansText":"Purchasing food from unsafe sources; Failing to cook food correctly; Holding food at incorrect temperatures; Using contaminated equipment; Practicing poor personal hygiene"},{"id":"RD-120","src":"Review Slide Deck","no":"Slide 120","ch":8,"tp":"culture","type":"list","q":"Active managerial control is described as proactive, reactive, and adaptive. What does each mean, and what two kinds of tools can achieve it, according to the FDA?","assigned":false,"why":"Active managerial control can be as simple as self-inspections or as complete as a HACCP program.","kn":"Knowing the three qualities of active managerial control and that both simple tools and full systems count.","img":false,"web":true,"ansList":["Proactive: it anticipates risks","Reactive: it corrects risks when found","Adaptive: it adjusts policies to meet changing circumstances or challenges","Simple tools, such as self-inspections","Comprehensive solutions, such as HACCP"],"ansText":"Proactive: it anticipates risks; Reactive: it corrects risks when found; Adaptive: it adjusts policies to meet changing circumstances or challenges; Simple tools, such as self-inspections; Comprehensive solutions, such as HACCP"},{"id":"RD-121","src":"Review Slide Deck","no":"Slide 121","ch":8,"tp":"culture","type":"list","q":"What are the six steps to implementing active managerial control?","assigned":false,"why":"These steps turn food safety policies into daily practice and keep checking that they work.","kn":"Recalling all six active managerial control steps, from finding risks to re-evaluating the program.","img":false,"web":true,"ansList":["Find potential risks","Monitor critical activities","Take corrective action","Oversee staff","Train staff","Re-evaluate the program"],"ansText":"Find potential risks; Monitor critical activities; Take corrective action; Oversee staff; Train staff; Re-evaluate the program"},{"id":"RD-122","src":"Review Slide Deck","no":"Slide 122","ch":8,"tp":"culture","type":"list","q":"Name the five FDA public health interventions for controlling the common risk factors for foodborne illness.","assigned":false,"why":"The FDA recommends these five interventions to control the common risk factors.","kn":"Recalling the five interventions. The trap is adding HACCP planning, which is not one of them.","img":false,"web":true,"ansList":["Demonstration of knowledge","Staff health controls","Controlling hands as a vehicle of contamination","Time and temperature parameters for controlling pathogens","Consumer advisories"],"ansText":"Demonstration of knowledge; Staff health controls; Controlling hands as a vehicle of contamination; Time and temperature parameters for controlling pathogens; Consumer advisories"},{"id":"RD-123","src":"Review Slide Deck","no":"Slide 123","ch":8,"tp":"haccp","type":"list","q":"Name the seven HACCP principles.","assigned":false,"why":"The seven principles build on each other, from finding hazards to keeping records.","kn":"Recalling the seven HACCP principles in order.","img":false,"web":true,"ansList":["Conduct a hazard analysis","Determine critical control points (CCPs)","Establish critical limits","Establish monitoring procedures","Identify corrective actions","Verify that the system works","Establish procedures for record keeping and documentation"],"ansText":"Conduct a hazard analysis; Determine critical control points (CCPs); Establish critical limits; Establish monitoring procedures; Identify corrective actions; Verify that the system works; Establish procedures for record keeping and documentation"},{"id":"RD-125","src":"Review Slide Deck","no":"Slide 125","ch":9,"tp":"design","type":"mc","q":"Should you submit your plan to the local regulatory authority before making changes to your facility or equipment?","assigned":false,"why":"Before starting any new construction or remodeling project, you must submit a plan to the regulatory authority. If required, the plan must be approved before construction begins.","kn":"Knowing that plan review comes before construction or remodeling.","img":false,"web":true,"opts":["Yes","No"],"ans":0,"ansText":"A. Yes"},{"id":"RD-126","src":"Review Slide Deck","no":"Slide 126","ch":9,"tp":"design","type":"mc","q":"You see a sanitation certification mark (such as the NSF mark) on a piece of equipment. What does it mean?","assigned":true,"why":"Marks such as NSF, UL EPH, and ETL Sanitation show the equipment has been certified or classified for sanitation under an ANAB-accredited program, so it is safe for use with food. The FDA does not approve equipment.","kn":"Knowing what sanitation marks mean, and that they come from ANAB-accredited programs, not FDA approval.","img":true,"web":true,"conf":"medium","note":"The slide shows a logo that isn’t in the file; the question names the mark in words instead.","opts":["It is safe for use with food.","It is approved by the FDA."],"ans":0,"ansText":"A. It is safe for use with food."},{"id":"RD-127","src":"Review Slide Deck","no":"Slide 127","ch":9,"tp":"design","type":"list","q":"Food equipment must have which four qualities (and must be replaced if it no longer has them)?","assigned":false,"why":"Equipment that is smooth, durable, nonabsorbent and easy to clean can be kept clean and sanitary.","kn":"Recalling the four qualities required of food equipment.","img":false,"web":true,"ansList":["Smooth","Easy to clean","Durable","Nonabsorbent"],"ansText":"Smooth; Easy to clean; Durable; Nonabsorbent"},{"id":"RD-128","src":"Review Slide Deck","no":"Slide 128","ch":9,"tp":"design","type":"list","q":"Name the three marks that show equipment has been certified or classified for sanitation under an ANAB-accredited program.","assigned":false,"why":"Look for one of these marks when buying food equipment.","kn":"Recalling the three sanitation marks, and not confusing them with marks such as UL’s general safety mark or Energy Star.","img":false,"web":true,"ansList":["NSF mark","UL EPH classified mark","ETL sanitation mark"],"ansText":"NSF mark; UL EPH classified mark; ETL sanitation mark"},{"id":"RD-129","src":"Review Slide Deck","no":"Slide 129","ch":9,"tp":"hwstation","type":"mc","q":"A handwashing sink is blocked by boxes. Is this handwashing station being used correctly?","assigned":false,"why":"Handwashing stations must be available at all times.","kn":"Knowing that handwashing sinks must never be blocked.","img":true,"web":true,"opts":["Yes","No"],"ans":1,"ansText":"B. No"},{"id":"RD-130","src":"Review Slide Deck","no":"Slide 130","ch":9,"tp":"hwstation","type":"mc","q":"A handwashing sink is full of dirty kitchenware. Is this handwashing station being used correctly?","assigned":false,"why":"Handwashing sinks must be used only for handwashing and not for any other purpose, such as dishwashing.","kn":"Knowing that handwashing sinks are for handwashing only.","img":true,"web":true,"opts":["Yes","No"],"ans":1,"ansText":"B. No"},{"id":"RD-131","src":"Review Slide Deck","no":"Slide 131","ch":9,"tp":"hwstation","type":"mc","q":"A handwashing sink has a barrier in place to prevent splashing. Is this handwashing station being used correctly?","assigned":false,"why":"Handwashing sinks must have adequate barriers or spacing to prevent splashing onto food or food-contact surfaces.","kn":"Knowing that a splash barrier (or enough distance) is required near food and food-contact surfaces.","img":true,"web":true,"opts":["Yes","No"],"ans":0,"ansText":"A. Yes"},{"id":"RD-132","src":"Review Slide Deck","no":"Slide 132","ch":9,"tp":"hwstation","type":"mc","q":"A handwashing station has no garbage can and no sign telling employees to wash hands before returning to work. Is it set up correctly?","assigned":false,"why":"Handwashing stations need a garbage container (if disposable towels are used) and signage telling staff to wash hands before returning to work.","kn":"Recalling everything a handwashing station must have, including the garbage container and the sign.","img":true,"web":true,"opts":["Yes","No"],"ans":1,"ansText":"B. No"},{"id":"RD-133","src":"Review Slide Deck","no":"Slide 133","ch":9,"tp":"hwstation","type":"list","q":"What must a handwashing station have?","assigned":false,"why":"These items make correct handwashing possible at every station.","kn":"Recalling each handwashing station requirement, including the 85°F (29°C) minimum water temperature.","img":false,"web":true,"ansList":["Running water at a temperature of at least 85°F (29°C), potable (drinkable), and supplied through a mixing valve or combination faucet","Liquid, bar, or powdered soap","A way to dry hands: disposable towels, a continuous towel system, or a hand dryer with warm air or room-temperature air delivered at high velocity","A garbage container, if disposable towels are used for drying hands","Signage telling staff to wash hands"],"ansText":"Running water at a temperature of at least 85°F (29°C), potable (drinkable), and supplied through a mixing valve or combination faucet; Liquid, bar, or powdered soap; A way to dry hands: disposable towels, a continuous towel system, or a hand dryer with warm air or room-temperature air delivered at high velocity; A garbage container, if disposable towels are used for drying hands; Signage telling staff to wash hands"},{"id":"RD-134","src":"Review Slide Deck","no":"Slide 134","ch":9,"tp":"plumbing","type":"mc","q":"Is it okay to install plumbing yourself?","assigned":false,"why":"Plumbing that is not installed or maintained correctly can allow potable and unsafe water to mix. Have only licensed plumbers install plumbing.","kn":"Knowing that only licensed plumbers should install plumbing, because mistakes can let unsafe water mix with drinking water.","img":false,"web":true,"opts":["Yes","No"],"ans":1,"ansText":"B. No"},{"id":"RD-135","src":"Review Slide Deck","no":"Slide 135","ch":9,"tp":"plumbing","type":"short","q":"What is potable water, and what must it be used for?","assigned":false,"why":"The slide defines potable water and where it is required.","kn":"Defining potable water and knowing it is required for food prep and food-contact surfaces.","img":false,"web":true,"ansText":"Water that is drinkable. Only potable water can be used to prepare food and come in contact with food-contact surfaces."},{"id":"RD-136","src":"Review Slide Deck","no":"Slide 136","ch":9,"tp":"plumbing","type":"mc","q":"What is the best way to prevent backflow?","assigned":true,"why":"The best way to prevent backflow is to avoid creating a cross-connection; mechanical devices such as vacuum breakers are backups.","kn":"Knowing that avoiding cross-connections comes first, with devices as backup. The trap is picking a device.","img":false,"web":true,"conf":"high","opts":["Install a vacuum breaker.","Install a reduced pressure zone backflow preventer.","Avoid creating a cross-connection."],"ans":2,"ansText":"C. Avoid creating a cross-connection."},{"id":"RD-137","src":"Review Slide Deck","no":"Slide 137","ch":9,"tp":"plumbing","type":"list","q":"Name three mechanical devices that can be installed to prevent backflow.","assigned":false,"why":"These devices stop contaminated water from flowing back into the drinkable water supply.","kn":"Recalling the three backflow prevention devices (besides an air gap, which is not a device).","img":false,"web":true,"ansList":["Vacuum breaker","Double check valve","Reduced pressure zone backflow preventer (RPZ)"],"ansText":"Vacuum breaker; Double check valve; Reduced pressure zone backflow preventer (RPZ)"},{"id":"RD-138","src":"Review Slide Deck","no":"Slide 138","ch":9,"tp":"utilities","type":"mc","q":"Can you dump dirty mop water into a storm drain?","assigned":false,"why":"Wastewater must be disposed of into an approved sewage system; dump mop water into a service sink or floor drain.","kn":"Knowing where wastewater may go: a service sink or floor drain, never a storm drain.","img":false,"web":true,"opts":["Yes","No"],"ans":1,"ansText":"B. No"},{"id":"RD-139","src":"Review Slide Deck","no":"Slide 139","ch":9,"tp":"utilities","type":"mc","q":"There is a buildup of grease and condensation on the walls and ceilings. What is the problem?","assigned":true,"why":"A buildup of grease and condensation on walls and ceilings is a sign that the ventilation system isn’t working correctly.","kn":"Recognizing grease and condensation buildup as a ventilation problem, not a cleaning one.","img":false,"web":true,"conf":"high","opts":["Staff has not been cleaning adequately.","The ventilation system is not working correctly.","The grill is not being operated at a high enough temperature."],"ans":1,"ansText":"B. The ventilation system is not working correctly."},{"id":"RD-140","src":"Review Slide Deck","no":"Slide 140","ch":9,"tp":"utilities","type":"mc","q":"A food handler carries garbage past a prep table in a way that could contaminate it. Is this garbage being handled correctly?","assigned":false,"why":"Staff must be careful when removing garbage so they do not contaminate food or food-contact surfaces.","kn":"Knowing that garbage must be removed without contaminating food or food-contact surfaces.","img":true,"web":true,"note":"Scenario taken from the slide’s explanation; the picture isn’t in the file.","opts":["Yes","No"],"ans":1,"ansText":"B. No"},{"id":"RD-141","src":"Review Slide Deck","no":"Slide 141","ch":9,"tp":"emerg","type":"list","q":"If a crisis affecting the facility poses a significant safety or security risk, what should the manager do?","assigned":false,"why":"An imminent health hazard means stopping service and involving the regulatory authority.","kn":"Recalling the three actions for a crisis that threatens safety: stop service, notify the authority, discard affected food.","img":false,"web":true,"ansList":["Stop service","Notify the local regulatory authority","Throw out spoiled food, contaminated food, and food with packaging that is not intact"],"ansText":"Stop service; Notify the local regulatory authority; Throw out spoiled food, contaminated food, and food with packaging that is not intact"},{"id":"RD-142","src":"Review Slide Deck","no":"Slide 142","ch":9,"tp":"emerg","type":"list","q":"Service may be allowed to continue after a water or electrical interruption if the operation does which three things?","assigned":false,"why":"A pre-approved plan lets an operation keep serving safely during some interruptions.","kn":"Knowing the conditions for continuing service during an interruption: a pre-approved plan, corrective action, and notifying the authority.","img":false,"web":true,"ansList":["Has a pre-approved written emergency operating plan","Takes immediate corrective action","Notifies the regulatory authority when the plan is implemented"],"ansText":"Has a pre-approved written emergency operating plan; Takes immediate corrective action; Notifies the regulatory authority when the plan is implemented"},{"id":"RD-144","src":"Review Slide Deck","no":"Slide 144","ch":10,"tp":"agents","type":"list","q":"Cleaners must have which four qualities?","assigned":false,"why":"Cleaners must be stable, noncorrosive, safe to use, and available to staff.","kn":"Recalling the four qualities required of cleaners.","img":false,"web":true,"ansList":["Stable","Noncorrosive","Safe to use","Available"],"ansText":"Stable; Noncorrosive; Safe to use; Available"},{"id":"RD-145","src":"Review Slide Deck","no":"Slide 145","ch":10,"tp":"agents","type":"mc","q":"Is it okay to use machine dishwashing detergent to clean other food-contact surfaces?","assigned":false,"why":"Only use cleaners for their intended purpose. Never use one type of cleaner in place of another unless the intended use is the same.","kn":"Knowing that cleaners are used only for their intended purpose.","img":false,"web":true,"opts":["Yes","No"],"ans":1,"ansText":"B. No"},{"id":"RD-146","src":"Review Slide Deck","no":"Slide 146","ch":10,"tp":"agents","type":"list","q":"What are the guidelines for using a chlorine sanitizer effectively?","assigned":false,"why":"Chlorine works only within these temperature, pH, concentration, and contact-time ranges.","kn":"Recalling chlorine’s numbers, especially the 50–99 ppm concentration and 7-second contact time that set it apart from iodine and quats.","img":false,"web":true,"note":"The slide is a reference table, turned into a recall question.","ansList":["Water temperature: at least 100°F (38°C) if the water pH is 10 or lower, or at least 75°F (24°C) if the pH is 8 or lower","Water hardness: as per the manufacturer’s recommendations","Concentration: 50–99 ppm","Contact time: at least 7 seconds"],"ansText":"Water temperature: at least 100°F (38°C) if the water pH is 10 or lower, or at least 75°F (24°C) if the pH is 8 or lower; Water hardness: as per the manufacturer’s recommendations; Concentration: 50–99 ppm; Contact time: at least 7 seconds"},{"id":"RD-147a","src":"Review Slide Deck","no":"Slide 147","ch":10,"tp":"agents","type":"list","q":"What are the guidelines for using an iodine sanitizer effectively?","assigned":false,"why":"Iodine has its own ranges, different from chlorine and quats.","kn":"Recalling iodine’s numbers (12.5–25 ppm, 30 seconds) without mixing them up with chlorine’s.","img":false,"web":true,"note":"The slide is a reference table, turned into a recall question.","ansList":["Water temperature: 68°F (20°C)","Water pH: 5 or lower, or as per the manufacturer’s recommendations","Water hardness: as per the manufacturer’s recommendations","Concentration: 12.5–25 ppm","Contact time: at least 30 seconds"],"ansText":"Water temperature: 68°F (20°C); Water pH: 5 or lower, or as per the manufacturer’s recommendations; Water hardness: as per the manufacturer’s recommendations; Concentration: 12.5–25 ppm; Contact time: at least 30 seconds"},{"id":"RD-147b","src":"Review Slide Deck","no":"Slide 147","ch":10,"tp":"agents","type":"list","q":"What are the guidelines for using a quaternary ammonium (quats) sanitizer effectively?","assigned":false,"why":"Quats follow the manufacturer’s recommendations for concentration and need a 30-second contact time.","kn":"Recalling quats’ numbers, especially the 500 ppm hardness limit and 30-second contact time.","img":false,"web":true,"note":"The slide is a reference table, turned into a recall question.","ansList":["Water temperature: 75°F (24°C)","Water pH: as per the manufacturer’s recommendations","Water hardness: 500 ppm or lower, or as per the manufacturer’s recommendations","Concentration: as per the manufacturer’s recommendations","Contact time: at least 30 seconds"],"ansText":"Water temperature: 75°F (24°C); Water pH: as per the manufacturer’s recommendations; Water hardness: 500 ppm or lower, or as per the manufacturer’s recommendations; Concentration: as per the manufacturer’s recommendations; Contact time: at least 30 seconds"},{"id":"RD-148","src":"Review Slide Deck","no":"Slide 148","ch":10,"tp":"howclean","type":"order","q":"Put the steps for cleaning and sanitizing a surface in order.","assigned":false,"why":"Scrape, wash, rinse, sanitize, then air-dry. The slide gives this order as the answer.","kn":"Knowing the five-step order, especially that cleaning (wash and rinse) comes before sanitizing and that surfaces air-dry rather than being towel-dried.","img":false,"web":true,"opts":["Allow the surface to air-dry.","Wash the surface.","Rinse the surface.","Scrape or remove food from the surface.","Sanitize the surface."],"ans":[3,1,2,4,0],"ansText":"1. Scrape or remove food from the surface.; 2. Wash the surface.; 3. Rinse the surface.; 4. Sanitize the surface.; 5. Allow the surface to air-dry.","mcq":{"q":"What is the correct order for cleaning and sanitizing a surface?","opts":["Wash → scrape → rinse → sanitize → air-dry","Scrape → wash → sanitize → rinse → air-dry","Scrape → wash → rinse → sanitize → air-dry","Scrape → rinse → wash → sanitize → air-dry"],"ans":2}},{"id":"RD-149","src":"Review Slide Deck","no":"Slide 149","ch":10,"tp":"howclean","type":"mc","q":"Must a cutting board be cleaned and sanitized between preparing raw cabbage and lettuce?","assigned":false,"why":"Food-contact surfaces need to be cleaned and sanitized after handling different raw TCS fruits and vegetables.","kn":"Knowing that switching between different raw produce also requires cleaning and sanitizing.","img":false,"web":true,"opts":["Yes","No"],"ans":0,"ansText":"A. Yes"},{"id":"RD-150","src":"Review Slide Deck","no":"Slide 150","ch":10,"tp":"howclean","type":"list","q":"What are the steps for cleaning and sanitizing stationary equipment?","assigned":false,"why":"Unplugging comes first for safety; reassembly comes last, after air-drying.","kn":"Recalling the full sequence for stationary equipment, starting with unplugging it.","img":false,"web":true,"note":"Combines slides 150 and 151, which split the steps across two slides.","ansList":["Unplug the equipment","Take the removable parts off the equipment","Wash, rinse, and sanitize the removable parts by hand, or run them through a dishwasher if allowed","Scrape or remove food from the equipment surfaces","Wash the equipment surfaces","Rinse the equipment surfaces with clean water","Sanitize the equipment surfaces, making sure the sanitizer contacts each surface","Allow all surfaces to air-dry","Put the unit back together"],"ansText":"Unplug the equipment; Take the removable parts off the equipment; Wash, rinse, and sanitize the removable parts by hand, or run them through a dishwasher if allowed; Scrape or remove food from the equipment surfaces; Wash the equipment surfaces; Rinse the equipment surfaces with clean water; Sanitize the equipment surfaces, making sure the sanitizer contacts each surface; Allow all surfaces to air-dry; Put the unit back together"},{"id":"RD-152","src":"Review Slide Deck","no":"Slide 152","ch":10,"tp":"howclean","type":"short","q":"How often must clean-in-place equipment that holds and dispenses TCS food be cleaned and sanitized?","assigned":false,"why":"Equipment holding and dispensing TCS food must be cleaned and sanitized every day unless otherwise indicated by the manufacturer.","kn":"Recalling the daily cleaning rule for clean-in-place equipment that dispenses TCS food.","img":false,"web":true,"ansText":"Every day, unless the manufacturer indicates otherwise (check local regulatory requirements)"},{"id":"RD-153","src":"Review Slide Deck","no":"Slide 153","ch":10,"tp":"agents","type":"mc","q":"What is the purpose of a disinfectant?","assigned":false,"why":"Disinfectants are designed to further reduce pathogens and may inactivate or eliminate them; reducing pathogens to safe levels is what sanitizers do.","kn":"Telling a disinfectant (inactivates or eliminates pathogens) apart from a sanitizer (reduces them to safe levels).","img":false,"web":true,"opts":["To reduce pathogens to safe levels","To inactivate or eliminate pathogens"],"ans":1,"ansText":"B. To inactivate or eliminate pathogens"},{"id":"RD-154","src":"Review Slide Deck","no":"Slide 154","ch":10,"tp":"agents","type":"mc","q":"Why shouldn’t disinfectants be used all the time?","assigned":false,"why":"They can leave chemical residues on surfaces, which would require additional cleaning and sanitizing after use. Overuse also has a greater environmental impact.","kn":"Knowing the drawback of disinfectants (residues and environmental impact), not a lack of effectiveness.","img":false,"web":true,"opts":["They can leave chemical residues on surfaces.","They are ineffective in destroying fungi and viruses."],"ans":0,"ansText":"A. They can leave chemical residues on surfaces."},{"id":"RD-155","src":"Review Slide Deck","no":"Slide 155","ch":10,"tp":"agents","type":"mc","q":"What should disinfectants be used for?","assigned":false,"why":"Disinfectants are best reserved for high-risk situations that need a higher level of pathogen elimination, such as cleaning up bodily fluid spills or following directives from regulatory authorities.","kn":"Knowing that disinfectants are for high-risk jobs like bodily fluid cleanup, while everyday surfaces are sanitized.","img":false,"web":true,"opts":["Sanitizing surfaces","Cleaning up bodily fluid spills"],"ans":1,"ansText":"B. Cleaning up bodily fluid spills"},{"id":"RD-156","src":"Review Slide Deck","no":"Slide 156","ch":10,"tp":"agents","type":"list","q":"When using disinfectants, what must you make sure of?","assigned":false,"why":"Using disinfectants safely requires the right strength, approved products, the label directions, and a trained plan.","kn":"Recalling the four disinfectant safeguards, including that a bodily fluid cleanup plan is required.","img":false,"web":true,"ansList":["Disinfectant solutions are at the proper concentration: provide test kits that are available at all times and easily accessible","Disinfectants are EPA-approved: check the product label","The manufacturer’s directions are followed","A plan has been developed for using disinfectants and employees are trained on it (required for cleaning up bodily fluid spills)"],"ansText":"Disinfectant solutions are at the proper concentration: provide test kits that are available at all times and easily accessible; Disinfectants are EPA-approved: check the product label; The manufacturer’s directions are followed; A plan has been developed for using disinfectants and employees are trained on it (required for cleaning up bodily fluid spills)"},{"id":"RD-157","src":"Review Slide Deck","no":"Slide 157","ch":10,"tp":"dish","type":"mc","q":"Silverware has dried-on food. What’s the best thing to do before washing it?","assigned":true,"why":"Items are normally scraped before washing, and the slide notes they can also be rinsed or presoaked when necessary; dried-on food is the case where presoaking is needed.","kn":"Knowing the pre-wash step and when it changes: scrape normally, but presoak items with dried-on food.","img":false,"web":true,"conf":"medium","note":"The slide’s explanation (scrape, or rinse or presoak if necessary) doesn’t pick one option.","opts":["Scrape them.","Rinse them.","Soak them."],"ans":2,"ansText":"C. Soak them."},{"id":"RD-158","src":"Review Slide Deck","no":"Slide 158","ch":10,"tp":"dish","type":"list","q":"What must operations using high-temperature dishwashing machines provide staff with?","assigned":false,"why":"These tools confirm the dishwasher reaches correct sanitizing temperatures.","kn":"Knowing that high-temperature machines need a way to verify the surface temperature reached, such as heat-sensitive tape.","img":false,"web":true,"ansList":["An easy and quick way to measure the surface temperatures of items being sanitized","An irreversible record of the highest temperature reached during the sanitizing rinse (for example, maximum registering thermometers or heat-sensitive tape)"],"ansText":"An easy and quick way to measure the surface temperatures of items being sanitized; An irreversible record of the highest temperature reached during the sanitizing rinse (for example, maximum registering thermometers or heat-sensitive tape)"},{"id":"RD-159","src":"Review Slide Deck","no":"Slide 159","ch":10,"tp":"dish","type":"list","q":"How do you set up a three-compartment sink?","assigned":false,"why":"Setup starts with cleaning and sanitizing the sinks themselves.","kn":"Recalling the setup order and the 110°F (43°C) wash-water minimum.","img":false,"web":true,"ansList":["Clean and sanitize each sink and drain board","Fill the first sink with detergent and water at least 110°F (43°C)","Fill the second sink with clean water","Fill the third sink with water and sanitizer to the correct concentration","Provide a clock with a second hand so food handlers know how long items have been in the sanitizer"],"ansText":"Clean and sanitize each sink and drain board; Fill the first sink with detergent and water at least 110°F (43°C); Fill the second sink with clean water; Fill the third sink with water and sanitizer to the correct concentration; Provide a clock with a second hand so food handlers know how long items have been in the sanitizer"},{"id":"RD-160","src":"Review Slide Deck","no":"Slide 160","ch":10,"tp":"dish","type":"mc","q":"Is it okay to rinse items after sanitizing them?","assigned":false,"why":"Never rinse items after sanitizing them; this could contaminate their surfaces.","kn":"Knowing that sanitizing is the last wet step: items air-dry afterward, never rinsed.","img":false,"web":true,"opts":["Yes","No"],"ans":1,"ansText":"B. No"},{"id":"RD-161","src":"Review Slide Deck","no":"Slide 161","ch":10,"tp":"storeclean","type":"mc","q":"Have these cups been stored correctly? (The slide’s picture isn’t in the file.)","assigned":true,"why":"Glasses and cups should be stored upside down on a clean and sanitized shelf or rack.","kn":"Knowing that cups and glasses are stored upside down on a clean and sanitized shelf or rack.","img":true,"web":false,"conf":"low","note":"The slide only states the rule; “No” assumes the picture shows cups stored the wrong way.","opts":["Yes","No"],"ans":1,"ansText":"B. No"},{"id":"RD-162","src":"Review Slide Deck","no":"Slide 162","ch":10,"tp":"storeclean","type":"mc","q":"Flatware has been stored with the handles up. Has it been stored correctly?","assigned":false,"why":"Flatware and utensils should be stored with handles up so staff can pick them up without touching food-contact surfaces.","kn":"Knowing why flatware is stored handles up: to avoid touching the food-contact surfaces.","img":true,"web":true,"opts":["Yes","No"],"ans":0,"ansText":"A. Yes"},{"id":"RD-163","src":"Review Slide Deck","no":"Slide 163","ch":10,"tp":"howclean","type":"mc","q":"A server uses a dry wiping cloth to wipe food spills from tableware. Is this a safe practice?","assigned":false,"why":"It is safe to use a dry wiping cloth to wipe food spills from tableware, as long as the cloth is not visibly dirty and has no food debris.","kn":"Knowing when dry wiping cloths are acceptable: for food spills on tableware, while the cloth stays clean.","img":true,"web":true,"opts":["Yes","No"],"ans":0,"ansText":"A. Yes"},{"id":"RD-164","src":"Review Slide Deck","no":"Slide 164","ch":10,"tp":"storeclean","type":"mc","q":"A mop is being cleaned in a three-compartment sink. Is this a safe practice?","assigned":false,"why":"To prevent contamination, never clean mops, brushes, or other tools in sinks used for handwashing, food prep, or dishwashing.","kn":"Knowing where cleaning tools may be cleaned: a service sink, never a handwashing, prep or dish sink.","img":true,"web":true,"opts":["Yes","No"],"ans":1,"ansText":"B. No"},{"id":"RD-165","src":"Review Slide Deck","no":"Slide 165","ch":10,"tp":"storeclean","type":"mc","q":"A mop is stored in a way that can contaminate food. Is this a safe practice?","assigned":false,"why":"Mops should be placed in a position to air-dry without soiling walls, equipment, or supplies.","kn":"Knowing how to store mops: hung to air-dry, away from food, equipment and supplies.","img":true,"web":true,"opts":["Yes","No"],"ans":1,"ansText":"B. No"},{"id":"RD-166","src":"Review Slide Deck","no":"Slide 166","ch":10,"tp":"program","type":"list","q":"What are the rules for using foodservice chemicals?","assigned":false,"why":"These rules keep chemicals from contaminating food and keep staff informed about hazards.","kn":"Recalling the chemical-use rules, especially that an SDS is required for every chemical and must be accessible.","img":false,"web":true,"ansList":["Have an SDS for each chemical on the premises","Make sure SDS are accessible to employees at all times","Never keep chemicals that are not required to operate or maintain the establishment","Always cover or remove items that could become contaminated before using chemicals","Clean and sanitize equipment and utensils after using chemicals","Always follow the law and the manufacturer’s directions when using chemicals"],"ansText":"Have an SDS for each chemical on the premises; Make sure SDS are accessible to employees at all times; Never keep chemicals that are not required to operate or maintain the establishment; Always cover or remove items that could become contaminated before using chemicals; Clean and sanitize equipment and utensils after using chemicals; Always follow the law and the manufacturer’s directions when using chemicals"}]}</script>
<script>
'use strict';
/* =====================================================================
   DATA
   Every quiz question is multiple choice. Items that were true/false,
   select-all, put-in-order or fill-in in the source carry a rewritten
   multiple-choice version in `mcq`. Lists and short answers become
   knowledge points. Items marked web:false (picture missing) are left out.
   ===================================================================== */
const D = JSON.parse(document.getElementById('question-data').textContent);
const CHAPTERS = D.chapters || {};
const CH_IDS = Object.keys(CHAPTERS).map(Number);
const TOPICS = Object.fromEntries((D.topics || []).map(t => [t[0], t]));
const SOURCES = D.sources || [];
const ALL = (D.items || []).filter(x => x.web !== false);
const MCQ = ALL.filter(x => x.type === 'mc' || x.mcq).map(x => x.mcq
  ? Object.assign({}, x, { q: x.mcq.q, opts: x.mcq.opts, ans: x.mcq.ans, from: x.type })
  : x);
const KP = ALL.filter(x => !x.mcq && x.type !== 'mc');
const LETTERS = 'ABCDEFGHIJ';
const EXAM_N = 90, EXAM_MIN = 120, PASS = 75;
const FROM = { tf: 'a true/false question', multi: 'a select-all-that-apply question', order: 'a put-in-order question', fill: 'a fill-in-the-blank question' };
const MODE_NAME = { answer: 'Mode 1 · Show answers right away', sim: 'Mode 2 · Test me first' };
const SRC_SHORT = s => s.replace('SSM9E Activity Quiz', 'Activity Quiz').replace('Mock ServSafe Test', 'Mock Test');

const S = { view: 'home', mode: 'sim', filt: { src: 'all', n: '20' }, kp: { ch: 'all', hide: false }, quiz: null, leaveTo: null };
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const count = (arr, f) => arr.filter(f).length;
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- per-viewer history: which questions were missed last time ---------- */
let HIST = {};
try { HIST = JSON.parse(localStorage.getItem('ssm-hist') || '{}') || {}; } catch (e) { HIST = {}; }
function remember(id, ok) {
  HIST[id] = ok ? 1 : 0;
  try { localStorage.setItem('ssm-hist', JSON.stringify(HIST)); } catch (e) { /* storage unavailable */ }
}
const missedQs = () => MCQ.filter(x => HIST[x.id] === 0);

/* ---------- shared bits ---------- */
function ticketHead(x) {
  return `<div class="t-head"><span>${esc(x.id)} · CH ${x.ch}</span><span>${esc(SRC_SHORT(x.src))} · ${esc(x.no)}</span>${x.assigned ? '<span class="assigned-tag">ASSIGNED ANSWER</span>' : ''}</div>`;
}
function explain(x) {
  const tp = TOPICS[x.tp];
  let h = x.why ? `<p>${esc(x.why)}</p>` : '';
  if (x.kn) h += `<div class="kn"><b>What this tests${tp ? ' · ' + esc(tp[2]) : ''}</b><p>${esc(x.kn)}</p></div>`;
  if (x.assigned) h += `<p class="assigned"><b>Answer assigned.</b> The source doesn’t give this answer, so it was set from ServSafe Manager rules (highlighted in the spreadsheet).</p>`;
  if (x.from) h += `<p class="note">Rewritten as multiple choice from ${FROM[x.from]} in ${esc(x.src)}.</p>`;
  if (x.note) h += `<p class="note">Note: ${esc(x.note)}</p>`;
  return h;
}
/* Keep choice order when a choice points at others ("Either A or B") or the choices are a natural pair. */
const FIXED = /\b(all|none|both|either) of\b|\b(both|either) [a-d]\b|\b[a-d] (or|and) [a-d]\b|^(yes|no|accept|reject|true|false)$/i;
const keepOrder = x => x.opts.length < 3 || x.opts.some(o => FIXED.test(o));

/* ---------- rounds ---------- */
function prep(x, kind) {
  const ord = x.opts.map((_, i) => i);
  const it = { x, ord: keepOrder(x) ? ord : shuffle(ord), resp: null, done: false, ok: null };
  if (kind !== 'exam' && S.mode === 'answer') it.done = true;
  return it;
}
function launch(kind, items, title) {
  if (!items.length) return;
  S.quiz = { kind, title, mode: kind === 'exam' ? 'sim' : S.mode, items: items.map(x => prep(x, kind)), i: 0, pool: items, t0: Date.now() };
  S.leaveTo = null;
  S.view = 'quiz';
  render(true);
}
const srcOk = x => S.filt.src === 'all' || x.src === S.filt.src;
const chapterPool = c => MCQ.filter(x => (c === 'all' || x.ch === c) && srcOk(x));
function startChapter(c) {
  let pool = shuffle(chapterPool(c));
  if (S.filt.n !== 'all') pool = pool.slice(0, +S.filt.n);
  launch('practice', pool, c === 'all' ? 'All chapters' : `Chapter ${c}`);
}
function startExam() {
  // Spread the 90 questions over the chapters in proportion to the bank.
  const byCh = {};
  MCQ.forEach(x => (byCh[x.ch] = byCh[x.ch] || []).push(x));
  let pick = [];
  Object.values(byCh).forEach(list => { pick = pick.concat(shuffle(list).slice(0, Math.floor(EXAM_N * list.length / MCQ.length))); });
  pick = shuffle(pick.concat(shuffle(MCQ.filter(x => !pick.includes(x))).slice(0, EXAM_N - pick.length)));
  launch('exam', pick, 'Mock exam');
  T.mode = 'down'; T.min = EXAM_MIN; tMin.value = EXAM_MIN;
  tPanel.querySelectorAll('[data-tm]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tm === 'down')));
  tMinRow.hidden = false;
  tReset(); tToggle();
  T.exam = true;
}
const cur = () => S.quiz.items[S.quiz.i];
function stopExamClock() { if (T.exam) { if (T.run) tToggle(); T.exam = false; } }

/* ---------- answering ---------- */
function choose(v) {
  const it = cur(), q = S.quiz;
  if (it.done) return;
  it.resp = v;
  if (q.kind !== 'exam') { it.done = true; it.ok = v === it.x.ans; remember(it.x.id, it.ok); }
  render();
  if (it.done) { focusPrimary(); revealSoon(); }
}
function finish() {
  const q = S.quiz;
  if (q.kind === 'exam') {
    q.items.forEach(it => { it.ok = it.resp === it.x.ans; it.done = true; if (it.resp !== null) remember(it.x.id, it.ok); });
    stopExamClock();
  }
  q.finished = Date.now();
  S.leaveTo = null;
  S.view = 'results';
  render(true);
}
function go(d) {
  const q = S.quiz, j = q.i + d;
  S.leaveTo = null;
  if (j < 0) return;
  if (j >= q.items.length) { finish(); return; }
  q.i = j;
  render(true);
}
function focusPrimary() { const b = app.querySelector('[data-fk="primary"]'); if (b) b.focus({ preventScroll: true }); }
function revealSoon() {
  requestAnimationFrame(() => {
    const fb = document.getElementById('fb');
    if (fb && fb.getBoundingClientRect().bottom > innerHeight - 90) fb.scrollIntoView({ block: fb.offsetHeight > innerHeight * .55 ? 'start' : 'nearest', behavior: reduceMotion() ? 'auto' : 'smooth' });
  });
}
/* Leaving a scored round asks first, in the page (embedded viewers block confirm()). */
function leave(to) {
  const q = S.quiz;
  const touched = S.view === 'quiz' && q && q.mode === 'sim' && q.items.some(it => it.resp !== null);
  if (touched && S.leaveTo !== to) { S.leaveTo = to; render(); const b = app.querySelector('[data-fk="leave-yes"]'); if (b) b.focus(); return; }
  S.leaveTo = null;
  if (S.view === 'quiz' && q && q.kind === 'exam') stopExamClock();
  S.view = to;
  render(true);
}

/* ---------- views ---------- */
function vHome() {
  const missed = missedQs().length;
  return `
  <div class="stack">
    <section class="panel">
      <p class="eyebrow">ServSafe Manager · 9th edition · NUTR248</p>
      <h1 class="h1">Food safety practice kitchen</h1>
      <p class="lede">Multiple-choice practice from the class materials, sorted into the 10 book chapters, plus a timed mock exam like the real one. Every answer comes with an explanation and what the question tests.</p>
      <div class="tdz" role="img" aria-label="Temperature danger zone: 41°F to 135°F. Pathogens grow fastest from 70°F to 125°F. Poultry, stuffing and reheated food reach 165°F.">
        <div class="tdz-labels" aria-hidden="true"><span style="left:19.3%">41°F</span><span style="left:63.7%">135°F</span><span style="left:77.8%">165°F</span></div>
        <div class="tdz-bar" aria-hidden="true"><div class="tdz-zone"></div><div class="tdz-fast"></div></div>
        <div class="tdz-labels below" aria-hidden="true"><span style="left:33%">70°F</span><span style="left:59%">125°F</span></div>
        <p class="tdz-cap" aria-hidden="true">Danger zone 41–135°F (5–57°C) · fastest growth 70–125°F (21–52°C)</p>
      </div>
      <div class="facts">
        <div class="fact"><b>${MCQ.length}</b><span>multiple-choice questions</span></div>
        <div class="fact"><b>${KP.length}</b><span>knowledge points</span></div>
        <div class="fact"><b>${EXAM_N} / 2 h</b><span>mock exam, like the real one</span></div>
        <div class="fact"><b>${count(MCQ, x => x.assigned)}</b><span>answers assigned (not in the source)</span></div>
      </div>
    </section>
    <div class="modes">
      <button class="mode" data-act="mode" data-mode="answer"><span class="k">Mode 1</span><b>Show answers right away</b><span class="d">Every answer and explanation shows at once. Good for a first pass.</span></button>
      <button class="mode" data-act="mode" data-mode="sim"><span class="k">Mode 2</span><b>Test me first</b><span class="d">Answer, then see if you were right and why, with a score at the end. The mock exam is here.</span></button>
      <button class="mode kp" data-act="kp"><span class="k">Study</span><b>Knowledge points</b><span class="d">Lists and short answers to know by heart: Big Six, FAT TOM, HACCP principles and more.</span></button>
    </div>
    ${missed ? `<p class="foot">${missed} question${missed === 1 ? '' : 's'} you missed ${missed === 1 ? 'is' : 'are'} saved in this browser. Find them under Mode 2.</p>` : ''}
    <p class="foot">Sources: ${SOURCES.map(esc).join(', ')}. Questions whose answer isn’t given in the source are tagged “Assigned answer”. Picture-only questions are left out.</p>
  </div>`;
}
function vMenu() {
  const f = S.filt, sim = S.mode === 'sim';
  const opt = (arr, v) => arr.map(([k, l]) => `<option value="${esc(k)}"${k === v ? ' selected' : ''}>${esc(l)}</option>`).join('');
  const srcOpts = [['all', 'All sources']].concat(SOURCES.map(s => [s, s]));
  const nOpts = [['10', '10'], ['20', '20'], ['40', '40'], ['all', 'All']];
  const per = n => f.n !== 'all' && n > +f.n ? `${f.n} of ${n}` : `${n}`;
  const allN = chapterPool('all').length, missed = missedQs();
  const rows = CH_IDS.map(c => {
    const pool = chapterPool(c);
    const from = [...new Set(pool.map(x => SRC_SHORT(x.src).replace(/ \d+$/, '')))].join(' · ');
    return `<button class="row" data-act="chapter" data-ch="${c}"${pool.length ? '' : ' disabled'}><span class="row-n">${c}</span><span class="row-t"><b>${esc(CHAPTERS[c])}</b><small>${esc(from || 'None from this source')}</small></span><span class="row-c">${per(pool.length)}</span><span aria-hidden="true">›</span></button>`;
  }).join('');
  return `
  <div class="crumbs"><button class="link" data-act="home">‹ Home</button><button class="link" data-act="switch">Switch to ${sim ? 'mode 1 · show answers' : 'mode 2 · test me first'}</button></div>
  <section class="panel">
    <p class="eyebrow"><span class="chip-mode">${MODE_NAME[S.mode]}</span></p>
    <h1 class="h1">Pick a chapter</h1>
    <p class="lede">${sim ? 'Answer each question; then the right answer, explanation and what it tests appear.' : 'Every answer is shown right away, with its explanation.'}</p>
    <div class="filters">
      <label>Source<select data-filter="src" data-fk="fsrc">${opt(srcOpts, f.src)}</select></label>
      <label>Questions per round<select data-filter="n" data-fk="fn">${opt(nOpts, f.n)}</select></label>
    </div>
    <div class="rows">
      <button class="row" data-act="chapter" data-ch="all"${allN ? '' : ' disabled'}><span class="row-n">★</span><span class="row-t"><b>All chapters, mixed</b><small>Shuffled across chapters 1–10</small></span><span class="row-c">${per(allN)}</span><span aria-hidden="true">›</span></button>
      ${rows}
      ${sim && missed.length ? `<button class="row missed" data-act="missed"><span class="row-n">↺</span><span class="row-t"><b>Questions I missed</b><small>Saved in this browser from earlier rounds</small></span><span class="row-c">${missed.length}</span><span aria-hidden="true">›</span></button>` : ''}
      ${sim ? `<button class="row exam" data-act="exam"><span class="row-n">⏱</span><span class="row-t"><b>Mock exam: ${EXAM_N} questions, 2 hours</b><small>Like the real exam: all chapters, a 2-hour countdown, answers and score at the end. ${PASS}% to pass. Ignores the filters above.</small></span><span class="row-c">${EXAM_N}</span><span aria-hidden="true">›</span></button>` : ''}
    </div>
  </section>`;
}
function vQuiz() {
  const q = S.quiz, it = cur(), x = it.x, n = q.items.length, last = q.i === n - 1, exam = q.kind === 'exam', sim = q.mode === 'sim';
  const done = q.items.filter(i => i.done), right = count(done, i => i.ok);
  const opts = it.ord.map((oi, k) => {
    let cls = '';
    if (it.done) cls = oi === x.ans ? 'ok' : it.resp === oi ? 'no' : 'dim';
    else if (it.resp === oi) cls = 'sel';
    return `<button class="opt ${cls}" data-act="choose" data-v="${oi}" data-fk="o${k}"${it.done ? ' aria-disabled="true"' : ''}><span class="ltr">${LETTERS[k]}</span><span>${esc(x.opts[oi])}</span></button>`;
  }).join('');
  let fb = '';
  if (it.done) {
    const head = sim ? `<p class="fb-h ${it.ok ? 'ok' : 'no'}">${it.ok ? 'Correct' : 'Not quite'}</p>` : '<p class="fb-h">Answer</p>';
    fb = `<div class="fb" id="fb" role="status">${head}<p class="fb-a">Answer: ${LETTERS[it.ord.indexOf(x.ans)]}. ${esc(x.opts[x.ans])}</p>${explain(x)}</div>`;
  }
  let label;
  if (exam) label = last ? 'Finish and score' : 'Next ›';
  else if (!it.done) label = last ? 'Skip and finish' : 'Skip ›';
  else label = last ? (sim ? 'Finish and see score' : 'Finish') : 'Next ›';
  const meta = exam ? `${count(q.items, i => i.resp !== null)} answered` : sim ? `Score ${right} / ${done.length}` : 'Answers shown';
  return `
  <div class="qtop"><button class="link" data-act="menu">‹ Chapters</button><button class="link" data-act="finish">${exam ? 'Submit exam' : sim ? 'End and score' : 'End review'}</button></div>
  ${S.leaveTo ? `<div class="leave" role="alertdialog" aria-labelledby="lvq"><p id="lvq"><b>Leave this round?</b> Your answers so far won’t be scored.</p>
    <div class="btn-row"><button class="btn primary" data-act="leave-yes" data-fk="leave-yes">Leave</button><button class="btn" data-act="leave-no">Keep going</button></div></div>` : ''}
  <div class="prog" role="progressbar" aria-label="Progress" aria-valuemin="1" aria-valuemax="${n}" aria-valuenow="${q.i + 1}"><span style="width:${(q.i + 1) / n * 100}%"></span></div>
  <div class="qmeta"><span>${esc(q.title)} · ${q.i + 1} of ${n}</span><span class="score">${meta}</span></div>
  <article class="ticket" id="qcard" tabindex="-1" aria-label="Question ${q.i + 1} of ${n}">
    ${ticketHead(x)}
    <div class="t-body"><p class="q-text">${esc(x.q)}</p><div class="opts" role="group" aria-label="Answer choices">${opts}</div>${fb}</div>
  </article>
  <nav class="qnav" aria-label="Question navigation"><div class="qnav-in">
    <button class="btn" data-act="prev"${q.i === 0 ? ' disabled' : ''}>‹ Back</button>
    <button class="btn primary" data-act="primary" data-fk="primary">${label}</button>
  </div><p class="keys">Keys: 1–4 or A–D to answer · Enter to continue · ← → to move</p></nav>`;
}
function missCard(it) {
  const x = it.x;
  return `<div class="miss"><p class="t">${esc(x.id)} · CH ${x.ch} · ${esc(SRC_SHORT(x.src))}${x.assigned ? ' · ASSIGNED ANSWER' : ''}</p><p class="q">${esc(x.q)}</p>
    <p class="r"><span class="lab">Answer</span>${esc(x.opts[x.ans])}</p><p class="r"><span class="lab">Yours</span>${it.resp === null ? 'Not answered' : esc(x.opts[it.resp])}</p>
    ${x.why ? `<p class="r">${esc(x.why)}</p>` : ''}${x.kn ? `<p class="r"><span class="lab">Tests</span>${esc(x.kn)}</p>` : ''}</div>`;
}
function vResults() {
  const q = S.quiz, items = q.items, exam = q.kind === 'exam', sim = q.mode === 'sim';
  const mins = Math.max(1, Math.round((q.finished - q.t0) / 60000));
  if (!sim) {
    return `<section class="panel"><div class="result"><div class="placard plain" aria-hidden="true"><div><big>${q.i + 1}</big><small>REVIEWED</small></div></div>
      <div><p class="eyebrow">${esc(q.title)} · ${MODE_NAME.answer}</p><h1 class="h1">${q.i + 1} of ${items.length} reviewed</h1><p class="lede">Ready to test yourself on the same questions?</p></div></div>
      <div class="btn-row"><button class="btn primary" data-act="to-sim">Test me on these</button><button class="btn" data-act="menu">Chapters</button></div></section>`;
  }
  const scored = exam ? items : items.filter(i => i.done);
  const right = count(scored, i => i.ok), pct = scored.length ? Math.round(100 * right / scored.length) : 0, pass = pct >= PASS;
  const missed = items.filter(i => !i.ok);
  const rows = CH_IDS.map(c => {
    const s = scored.filter(i => i.x.ch === c);
    if (!s.length) return '';
    const r = count(s, i => i.ok), p = Math.round(100 * r / s.length);
    return `<tr><td>${c}</td><td>${esc(CHAPTERS[c])}</td><td style="width:26%"><div class="bar"><span class="${p < PASS ? 'low' : ''}" style="width:${p}%"></span></div></td><td class="n">${r} / ${s.length}</td></tr>`;
  }).join('');
  return `
  <div class="stack">
    <section class="panel">
      <div class="result">
        <div class="placard${pass ? '' : ' fail'}" aria-hidden="true"><div><big>${pct}%</big><small>${pass ? 'PASS' : 'KEEP STUDYING'}</small></div></div>
        <div>
          <p class="eyebrow">${esc(q.title)} · score</p>
          <h1 class="h1">${right} of ${scored.length} correct</h1>
          <p class="lede">${exam ? `The real ServSafe Manager exam needs ${PASS}% to pass. ` : ''}${scored.length < items.length ? `${items.length - scored.length} skipped. ` : ''}Time: ${mins} min.</p>
        </div>
      </div>
      ${rows ? `<table class="breakdown"><thead><tr><th>Ch</th><th>Chapter</th><th>Score</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : ''}
      <div class="btn-row">
        ${missed.length ? `<button class="btn primary" data-act="retry">Retry the ${missed.length} missed</button>` : ''}
        <button class="btn${missed.length ? '' : ' primary'}" data-act="again">${exam ? 'New mock exam' : 'New round'}</button>
        <button class="btn" data-act="menu">Chapters</button>
      </div>
    </section>
    ${missed.length ? `<h2 class="h2" style="margin-top:8px">Review what you missed</h2><div class="miss-list">${missed.map(missCard).join('')}</div>` : '<h2 class="h2">Nothing missed. Nice work.</h2>'}
  </div>`;
}
function kpAnswer(x) {
  if (x.type === 'list') return `<ul>${x.ansList.map(s => `<li>${esc(s)}</li>`).join('')}</ul>`;
  return `<p>${esc(x.ansText).replace(/\n/g, '<br>')}</p>`;
}
function vKP() {
  const k = S.kp;
  const list = KP.filter(x => k.ch === 'all' || String(x.ch) === k.ch).sort((a, b) => a.ch - b.ch);
  const opt = [['all', 'All chapters']].concat(CH_IDS.map(c => [String(c), `${c} · ${CHAPTERS[c]}`])).map(([v, l]) => `<option value="${v}"${v === k.ch ? ' selected' : ''}>${esc(l)}</option>`).join('');
  let h = '', ch = null;
  list.forEach(x => {
    if (x.ch !== ch) { h += `${ch === null ? '' : '</div>'}<h2 class="ch-head"><small>Chapter ${x.ch}</small>${esc(CHAPTERS[x.ch])}</h2><div class="kp-list">`; ch = x.ch; }
    const tp = TOPICS[x.tp];
    h += `<article class="kp-card${k.hide ? ' hide' : ''}"><p class="t">${esc(x.id)} · ${esc(SRC_SHORT(x.src))} · ${esc(x.no)}${tp ? ' · ' + esc(tp[2]) : ''}</p><p class="q">${esc(x.q)}</p>
      ${k.hide ? '<button class="link" data-act="reveal" aria-expanded="false">Show answer</button>' : ''}
      <div class="kp-ans">${kpAnswer(x)}${x.kn ? `<div class="kn"><b>Why it matters</b><p>${esc(x.kn)}</p></div>` : ''}</div></article>`;
  });
  return `
  <div class="crumbs"><button class="link" data-act="home">‹ Home</button></div>
  <section class="panel">
    <p class="eyebrow">Study</p>
    <h1 class="h1">Knowledge points</h1>
    <p class="lede">The lists and short answers from the quizzes and review slides: things to know by heart for the exam.</p>
    <div class="filters"><label>Chapter<select data-kp="ch" data-fk="kpch">${opt}</select></label></div>
    <label class="check"><input type="checkbox" data-kp="hide" data-fk="kphide"${k.hide ? ' checked' : ''}> Hide answers so I can quiz myself</label>
    <p class="foot">${list.length} knowledge point${list.length === 1 ? '' : 's'}</p>
  </section>
  ${list.length ? h + '</div>' : '<p class="lede" style="margin-top:16px">No knowledge points for this chapter.</p>'}`;
}

/* ---------- render ---------- */
function render(toTop) {
  const fk = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fk : null;
  const v = S.view;
  app.innerHTML = v === 'home' ? vHome() : v === 'menu' ? vMenu() : v === 'kp' ? vKP() : v === 'quiz' ? vQuiz() : vResults();
  if (toTop) {
    scrollTo(0, 0);
    const card = document.getElementById('qcard');
    if (card) card.focus({ preventScroll: true });
  } else if (fk) {
    const el = app.querySelector(`[data-fk="${fk}"]`);
    if (el) el.focus({ preventScroll: true });
  }
}

/* ---------- events ---------- */
const ACT = {
  home: () => leave('home'),
  menu: () => leave('menu'),
  mode: b => { S.mode = b.dataset.mode; S.view = 'menu'; render(true); },
  switch: () => { S.mode = S.mode === 'sim' ? 'answer' : 'sim'; render(); },
  kp: () => { S.view = 'kp'; render(true); },
  chapter: b => startChapter(b.dataset.ch === 'all' ? 'all' : +b.dataset.ch),
  missed: () => launch('practice', shuffle(missedQs()), 'Questions I missed'),
  exam: () => startExam(),
  choose: b => choose(+b.dataset.v),
  prev: () => go(-1),
  primary: () => go(1),
  finish: () => finish(),
  'leave-yes': () => { const to = S.leaveTo; S.leaveTo = null; if (S.quiz && S.quiz.kind === 'exam') stopExamClock(); S.view = to; render(true); },
  'leave-no': () => { S.leaveTo = null; render(); focusPrimary(); },
  retry: () => launch('practice', shuffle(S.quiz.items.filter(i => !i.ok).map(i => i.x)), 'Retry missed'),
  again: () => S.quiz.kind === 'exam' ? startExam() : launch(S.quiz.kind, shuffle(S.quiz.pool), S.quiz.title),
  'to-sim': () => { S.mode = 'sim'; launch(S.quiz.kind, shuffle(S.quiz.pool), S.quiz.title); },
  reveal: b => { const c = b.closest('.kp-card'), open = c.classList.toggle('shown'); b.textContent = open ? 'Hide answer' : 'Show answer'; b.setAttribute('aria-expanded', String(open)); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled || b.getAttribute('aria-disabled') === 'true') return;
  if (S.leaveTo && !['leave-yes', 'leave-no', 'home', 'menu'].includes(b.dataset.act)) S.leaveTo = null;
  const fn = ACT[b.dataset.act];
  if (fn) fn(b, e);
});
app.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.filter) { S.filt[el.dataset.filter] = el.value; render(); }
  if (el.dataset.kp) { S.kp[el.dataset.kp] = el.type === 'checkbox' ? el.checked : el.value; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !tPanel.hidden) { closePanel(); tFace.focus(); return; }
  if (e.key === 'Escape' && S.leaveTo) { ACT['leave-no'](); return; }
  if (S.view !== 'quiz' || e.metaKey || e.ctrlKey || e.altKey) return;
  const el = e.target, tag = el.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || (el.closest && el.closest('.t-panel'))) return;
  const it = cur(), k = e.key.toLowerCase();
  if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
  else if (e.key === 'Enter' && (tag === 'BODY' || el.id === 'qcard')) { e.preventDefault(); go(1); }
  else if (!it.done) {
    let n = '123456789'.indexOf(e.key);
    if (n < 0) n = 'abcdefghi'.indexOf(k);
    if (n >= 0 && n < it.ord.length) choose(it.ord[n]);
  }
});

/* ---------- timer ---------- */
const T = { mode: 'up', min: EXAM_MIN, acc: 0, t0: 0, run: false, fired: false, exam: false };
const tFace = document.getElementById('tFace'), tPlay = document.getElementById('tPlay'), tTime = document.getElementById('tTime');
const tPanel = document.getElementById('tPanel'), tBig = document.getElementById('tBig'), tStart = document.getElementById('tStart');
const tMin = document.getElementById('tMin'), tMinRow = document.getElementById('tMinRow'), timerEl = document.getElementById('timer');
const ICON_PLAY = '<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="6" y="4.5" width="4.2" height="15" rx="1" fill="currentColor"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1" fill="currentColor"/></svg>';
const tElapsed = () => T.acc + (T.run ? Date.now() - T.t0 : 0);
const timerUsed = () => T.run || T.acc > 0;
function fmtTime(ms) {
  const s = T.mode === 'down' ? Math.ceil(ms / 1000) : Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60, p = n => String(n).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(sec)}` : `${p(m)}:${p(sec)}`;
}
function tToggle() {
  if (T.run) { T.acc = tElapsed(); T.run = false; }
  else {
    if (T.mode === 'down' && tElapsed() >= T.min * 60000) { T.acc = 0; T.fired = false; }
    T.t0 = Date.now(); T.run = true;
  }
  tPaint();
}
function tReset() { T.acc = 0; T.run = false; T.fired = false; tPaint(); }
function tPaint() {
  const el = tElapsed();
  let shown = el, expired = false;
  if (T.mode === 'down') {
    const left = T.min * 60000 - el;
    shown = Math.max(0, left);
    if (left <= 0 && timerUsed()) {
      expired = true;
      if (T.run) { T.acc = T.min * 60000; T.run = false; }
      if (!T.fired) {
        T.fired = true;
        if (T.exam && S.view === 'quiz' && S.quiz && S.quiz.kind === 'exam') { toast('Time is up. Your mock exam has been scored.'); finish(); }
        else toast('Time is up. The countdown has finished.');
      }
    }
  }
  const idle = !timerUsed();
  tTime.textContent = idle ? (T.mode === 'down' ? fmtTime(T.min * 60000) : 'Timer') : fmtTime(shown);
  tBig.textContent = fmtTime(idle && T.mode === 'down' ? T.min * 60000 : shown);
  timerEl.classList.toggle('running', T.run);
  timerEl.classList.toggle('expired', expired);
  if (tPlay.dataset.state !== String(T.run)) { tPlay.innerHTML = T.run ? ICON_PAUSE : ICON_PLAY; tPlay.dataset.state = String(T.run); }
  tPlay.setAttribute('aria-label', T.run ? 'Pause timer' : (idle ? 'Start timer' : 'Resume timer'));
  tStart.textContent = T.run ? 'Pause' : (idle ? 'Start' : 'Resume');
}
function closePanel() { tPanel.hidden = true; tFace.setAttribute('aria-expanded', 'false'); }
tFace.addEventListener('click', () => { tPanel.hidden = !tPanel.hidden; tFace.setAttribute('aria-expanded', String(!tPanel.hidden)); });
tPlay.addEventListener('click', tToggle);
tStart.addEventListener('click', tToggle);
document.getElementById('tReset').addEventListener('click', tReset);
tPanel.querySelectorAll('[data-tm]').forEach(b => b.addEventListener('click', () => {
  T.mode = b.dataset.tm; T.exam = false;
  tPanel.querySelectorAll('[data-tm]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  tMinRow.hidden = T.mode !== 'down';
  tReset();
}));
tMin.addEventListener('change', () => {
  const v = Math.min(300, Math.max(1, parseInt(tMin.value, 10) || EXAM_MIN));
  tMin.value = v; T.min = v;
  if (!T.run) tReset(); else tPaint();
});
document.addEventListener('click', e => { if (!tPanel.hidden && !tPanel.contains(e.target) && !timerEl.contains(e.target)) closePanel(); });
setInterval(tPaint, 250);

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 4500);
}

/* ---------- theme ---------- */
const themeBtn = document.getElementById('themeBtn');
const MOON = '<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>';
const SUN = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>';
const isDark = () => { const t = document.documentElement.getAttribute('data-theme'); return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
function paintTheme() { const d = isDark(); themeBtn.innerHTML = d ? SUN : MOON; themeBtn.setAttribute('aria-label', d ? 'Switch to light theme' : 'Switch to dark theme'); }
themeBtn.addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('ssm-theme', next); } catch (e) { /* storage unavailable */ }
  paintTheme();
});
paintTheme();
tPaint();
render();
</script>
</body>
</html>
