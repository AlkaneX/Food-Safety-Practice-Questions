awed and refrozen and must be rejected.","kn":"Recognizing ice crystals on frozen food as a sign it thawed and was refrozen (time-temperature abuse), so it must be rejected.","img":false,"web":true,"mcq":{"q":"A delivery of frozen steaks is covered in ice crystals. What should you do?","opts":["Accept it and freeze it again right away","Accept it and cook the steaks within 24 hours","Accept it, because ice crystals are normal for frozen food","Reject it, because it may have thawed and been refrozen"],"ans":3}},{"id":"AQ05-04","src":"SSM9E Activity Quiz 5","no":"True or False #4","ch":5,"tp":"storage","type":"tf","q":"Unwashed produce must be separated from ready-to-eat food.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"Dirt and pathogens on unwashed produce can contaminate ready-to-eat food.","kn":"Knowing that unwashed produce can carry pathogens to ready-to-eat food and must be stored away from it.","img":false,"web":true,"mcq":{"q":"How should unwashed produce be stored?","opts":["Above ready-to-eat food","Mixed with washed produce","Separated from ready-to-eat food","In any container on the floor"],"ans":2}},{"id":"AQ05-05","src":"SSM9E Activity Quiz 5","no":"Complete the Label","ch":5,"tp":"label","type":"fill","q":"On Sunday, 8/3, you prepped melon balls at 2:00 p.m. You used some for a fruit salad and stored the rest. Complete the “USE BY” label for the food you stored: Date ____; time ____ (a.m. or p.m.); food name ____.","ansText":"8/9; 2:00 p.m.; Melon balls","assigned":false,"why":"Cut melon is a ready-to-eat TCS food; label it with its name and a use-by date 7 days out, counting the prep day as day 1.","kn":"Applying date marking: ready-to-eat TCS food prepped on-site can be kept 7 days at 41°F or lower, and the prep day counts as day 1, so 8/3 becomes 8/9.","img":true,"web":true,"note":"The original shows a blank label to fill in; the answer key shows the completed label as a picture.","mcq":{"q":"On Sunday, 8/3, at 2:00 p.m. you prepped melon balls, used some for a fruit salad, and stored the rest. What should the “USE BY” label on the stored melon balls say?","opts":["Melon balls, use by 8/10, 2:00 p.m.","Melon balls, use by 8/9, 2:00 p.m.","Melon balls, use by 8/5, 2:00 p.m.","Melon balls, use by 8/3, 6:00 p.m."],"ans":1}},{"id":"AQ05-06","src":"SSM9E Activity Quiz 5","no":"Fill in the Blank #1","ch":5,"tp":"storage","type":"fill","q":"Store food at least ____ inch(es) [____ centimeter(s)] off the floor.","ansText":"six; fifteen","assigned":false,"why":"Store food away from walls and at least 6 inches (15 centimeters) off the floor.","kn":"Recalling the storage height rule: 6 inches (15 cm) off the floor, which also applies to stationary equipment on legs.","img":false,"web":true,"mcq":{"q":"Store food at least how far off the floor?","opts":["2 inches (5 centimeters)","4 inches (10 centimeters)","6 inches (15 centimeters)","12 inches (30 centimeters)"],"ans":2}},{"id":"AQ05-07","src":"SSM9E Activity Quiz 5","no":"Fill in the Blank #2","ch":5,"tp":"storage","type":"fill","q":"Store raw meat, poultry, and seafood ____ ready-to-eat food.","ansText":"below","assigned":false,"why":"Raw meat, poultry and seafood go below ready-to-eat food (or in separate coolers).","kn":"Knowing the top-to-bottom storage rule: raw meat, poultry and seafood go below ready-to-eat food so drips can’t contaminate it.","img":false,"web":true,"mcq":{"q":"Where should raw meat, poultry, and seafood be stored in relation to ready-to-eat food?","opts":["Above the ready-to-eat food","Below the ready-to-eat food","On the same shelf, side by side","Anywhere, as long as both are covered"],"ans":1}},{"id":"AQ05-08","src":"SSM9E Activity Quiz 5","no":"Fill in the Blank #3","ch":5,"tp":"supplier","type":"fill","q":"Purchase food from ____, reputable suppliers.","ansText":"approved","assigned":false,"why":"Approved suppliers have been inspected and meet all applicable local, state and federal laws.","kn":"Knowing that all food must come from approved, reputable suppliers that meet applicable laws.","img":false,"web":true,"mcq":{"q":"Food must be purchased from which kind of supplier?","opts":["The supplier with the lowest prices","A home kitchen with a good reputation","Any supplier with a business license","An approved, reputable supplier"],"ans":3}},{"id":"AQ05-09","src":"SSM9E Activity Quiz 5","no":"Fill in the Blank #4","ch":5,"tp":"label","type":"fill","q":"Store ready-to-eat TCS food that is prepared on-site for no more than ____ days.","ansText":"seven","assigned":false,"why":"Ready-to-eat TCS food prepped on-site can be stored for up to 7 days at 41°F (5°C) or lower.","kn":"Recalling the date-marking limit: 7 days at 41°F (5°C) or lower for ready-to-eat TCS food prepped on-site.","img":false,"web":true,"mcq":{"q":"Ready-to-eat TCS food prepared on-site and held at 41°F (5°C) or lower can be stored for no more than","opts":["3 days","5 days","7 days","14 days"],"ans":2}},{"id":"AQ05-10","src":"SSM9E Activity Quiz 5","no":"Store the Food #1","ch":5,"tp":"storage","type":"mc","q":"A cooler has three shelves: A (top), B (middle) and C (bottom). Raw poultry, ground beef and a cake must all be stored in it. Which shelf should the raw poultry go on?","opts":["Shelf A (top)","Shelf B (middle)","Shelf C (bottom)"],"ans":2,"ansText":"C. Shelf C (bottom)","assigned":false,"why":"Store food by minimum internal cooking temperature, highest at the bottom: poultry goes on the lowest shelf.","kn":"Applying storage order by minimum cooking temperature: poultry (165°F) goes lowest, below ground meat and ready-to-eat food.","img":true,"web":true,"note":"The original shows a picture of the cooler."},{"id":"AQ05-11","src":"SSM9E Activity Quiz 5","no":"Store the Food #2","ch":5,"tp":"storage","type":"mc","q":"A cooler has three shelves: A (top), B (middle) and C (bottom). Raw poultry, ground beef and a cake must all be stored in it. Which shelf should the ground beef go on?","opts":["Shelf A (top)","Shelf B (middle)","Shelf C (bottom)"],"ans":1,"ansText":"B. Shelf B (middle)","assigned":false,"why":"Ground meat goes above poultry and below ready-to-eat food.","kn":"Applying storage order: ground beef (155°F) goes above poultry (165°F) but below ready-to-eat food.","img":true,"web":true,"note":"The original shows a picture of the cooler."},{"id":"AQ05-12","src":"SSM9E Activity Quiz 5","no":"Store the Food #3","ch":5,"tp":"storage","type":"mc","q":"A cooler has three shelves: A (top), B (middle) and C (bottom). Raw poultry, ground beef and a cake must all be stored in it. Which shelf should the cake go on?","opts":["Shelf A (top)","Shelf B (middle)","Shelf C (bottom)"],"ans":0,"ansText":"A. Shelf A (top)","assigned":false,"why":"Ready-to-eat food goes on the top shelf so nothing raw can drip onto it.","kn":"Applying storage order: ready-to-eat food such as cake goes on the top shelf, above all raw meat.","img":true,"web":true,"note":"The original shows a picture of the cooler."},{"id":"AQ06-01","src":"SSM9E Activity Quiz 6","no":"True or False #1","ch":6,"tp":"cool","type":"tf","q":"Coolers are designed to cool hot food quickly.","opts":["True","False"],"ans":1,"ansText":"False","assigned":false,"why":"Coolers keep cold food cold; hot food placed in them cools too slowly and can warm the food around it.","kn":"Knowing that coolers are built to keep cold food cold, not to cool hot food, so other cooling methods are needed.","img":false,"web":true,"mcq":{"q":"Why shouldn’t hot food be placed directly in a cooler to cool?","opts":["Coolers keep cold food cold and aren’t designed to cool hot food quickly","Coolers cool hot food too fast, which damages its quality","It is allowed if the cooler door stays closed","Hot food can only be cooled in a freezer"],"ans":0}},{"id":"AQ06-02","src":"SSM9E Activity Quiz 6","no":"True or False #2","ch":6,"tp":"cooktemp","type":"tf","q":"Cook a whole turkey to a minimum internal cooking temperature of 155°F (68°C) for 17 seconds.","opts":["True","False"],"ans":1,"ansText":"False","assigned":false,"why":"Poultry must be cooked to 165°F (74°C) for <1 second.","kn":"Recalling that all poultry, whole or ground, must reach 165°F (74°C) for <1 second. 155°F for 17 seconds is the ground-meat temperature.","img":false,"web":true,"mcq":{"q":"What is the minimum internal cooking temperature for a whole turkey?","opts":["145°F (63°C) for 15 seconds","155°F (68°C) for 17 seconds","165°F (74°C) for <1 second","135°F (57°C)"],"ans":2}},{"id":"AQ06-03","src":"SSM9E Activity Quiz 6","no":"True or False #3","ch":6,"tp":"cool","type":"tf","q":"The first step in cooling TCS food is to cool it from 135°F to 70°F (57°C to 21°C) within four hours.","opts":["True","False"],"ans":1,"ansText":"False","assigned":false,"why":"Stage 1 is 135°F to 70°F within two hours; stage 2 is 70°F to 41°F within the next four hours.","kn":"Recalling two-stage cooling: 135°F to 70°F within 2 hours, then 70°F to 41°F within the next 4 hours. The trap swaps the two time limits.","img":false,"web":true,"mcq":{"q":"In the first stage of cooling, TCS food must go from 135°F to 70°F (57°C to 21°C) within how long?","opts":["Two hours","Four hours","Six hours","One hour"],"ans":0}},{"id":"AQ06-04","src":"SSM9E Activity Quiz 6","no":"True or False #4","ch":6,"tp":"cooktemp","type":"tf","q":"Fish cooked in a microwave must be cooked to a minimum internal temperature of 145°F (63°C).","opts":["True","False"],"ans":1,"ansText":"False","assigned":false,"why":"Microwave-cooked meat, seafood, poultry and eggs must reach 165°F (74°C), then stand 2 minutes covered.","kn":"Knowing the microwave rule: meat, seafood, poultry and eggs cooked in a microwave must reach 165°F (74°C). 145°F is for fish cooked other ways.","img":false,"web":true,"mcq":{"q":"To what minimum internal temperature must fish cooked in a microwave be cooked?","opts":["145°F (63°C)","155°F (68°C)","135°F (57°C)","165°F (74°C)"],"ans":3}},{"id":"AQ06-05","src":"SSM9E Activity Quiz 6","no":"True or False #5","ch":6,"tp":"prep","type":"tf","q":"Unwashed produce must be separated from ready-to-eat foods.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"Pathogens on unwashed produce can spread to ready-to-eat food.","kn":"Knowing that unwashed produce can contaminate ready-to-eat food during prep and storage.","img":false,"web":true,"mcq":{"q":"During prep, how should unwashed produce be handled?","opts":["It can be prepped next to ready-to-eat food","It must be kept separate from ready-to-eat food","It only needs to be separated from raw meat","It can be stored above ready-to-eat food"],"ans":1}},{"id":"AQ06-06","src":"SSM9E Activity Quiz 6","no":"Methods of Thawing","ch":6,"tp":"thaw","type":"list","q":"What are the four acceptable methods of thawing food?","ansList":["In the cooler (at 41°F/5°C or lower)","Submerged under running drinkable water at 70°F (21°C) or lower","In a microwave (if cooked immediately afterward)","As part of the cooking process"],"ansText":"In the cooler (at 41°F/5°C or lower); Submerged under running drinkable water at 70°F (21°C) or lower; In a microwave (if cooked immediately afterward); As part of the cooking process","assigned":false,"why":"Food must be thawed in ways that keep it out of the temperature danger zone.","kn":"Recalling the four safe thawing methods. Thawing at room temperature is never acceptable.","img":false,"web":true},{"id":"AQ06-07","src":"SSM9E Activity Quiz 6","no":"Minimum Internal Cooking Temperatures #1","ch":6,"tp":"cooktemp","type":"mc","q":"What is the minimum internal cooking temperature for swordfish steaks?","opts":["165°F (74°C) for <1 second","155°F (68°C) for 17 seconds","145°F (63°C) for 15 seconds","145°F (63°C) for 4 minutes","135°F (57°C)"],"ans":2,"ansText":"C. 145°F (63°C) for 15 seconds","assigned":false,"why":"Seafood, including fish such as swordfish, must reach 145°F (63°C) for 15 seconds.","kn":"Recalling that seafood (fish steaks and fillets) is cooked to 145°F (63°C) for 15 seconds.","img":false,"web":true},{"id":"AQ06-08","src":"SSM9E Activity Quiz 6","no":"Minimum Internal Cooking Temperatures #2","ch":6,"tp":"cooktemp","type":"mc","q":"What is the minimum internal cooking temperature for a whole chicken?","opts":["165°F (74°C) for <1 second","155°F (68°C) for 17 seconds","145°F (63°C) for 15 seconds","145°F (63°C) for 4 minutes","135°F (57°C)"],"ans":0,"ansText":"A. 165°F (74°C) for <1 second","assigned":false,"why":"Poultry (whole or ground chicken, turkey, duck) must reach 165°F (74°C) for <1 second.","kn":"Recalling that all poultry is cooked to 165°F (74°C) for <1 second.","img":false,"web":true},{"id":"AQ06-09","src":"SSM9E Activity Quiz 6","no":"Minimum Internal Cooking Temperatures #3","ch":6,"tp":"cooktemp","type":"mc","q":"What is the minimum internal cooking temperature for pork chops?","opts":["165°F (74°C) for <1 second","155°F (68°C) for 17 seconds","145°F (63°C) for 15 seconds","145°F (63°C) for 4 minutes","135°F (57°C)"],"ans":2,"ansText":"C. 145°F (63°C) for 15 seconds","assigned":false,"why":"Pork chops are whole-muscle steaks/chops: 145°F (63°C) for 15 seconds.","kn":"Recalling that steaks and chops of pork, beef, veal and lamb are cooked to 145°F (63°C) for 15 seconds. 4 minutes is for roasts.","img":false,"web":true},{"id":"AQ06-10","src":"SSM9E Activity Quiz 6","no":"Minimum Internal Cooking Temperatures #4","ch":6,"tp":"cooktemp","type":"mc","q":"What is the minimum internal cooking temperature for ground-beef patties?","opts":["165°F (74°C) for <1 second","155°F (68°C) for 17 seconds","145°F (63°C) for 15 seconds","145°F (63°C) for 4 minutes","135°F (57°C)"],"ans":1,"ansText":"B. 155°F (68°C) for 17 seconds","assigned":false,"why":"Ground meat (beef, pork, other meat) must reach 155°F (68°C) for 17 seconds.","kn":"Recalling that ground meat is cooked to 155°F (68°C) for 17 seconds because grinding spreads surface pathogens through the meat.","img":false,"web":true},{"id":"AQ06-11","src":"SSM9E Activity Quiz 6","no":"Minimum Internal Cooking Temperatures #5","ch":6,"tp":"cooktemp","type":"mc","q":"What is the minimum internal cooking temperature for glazed carrots that will be hot-held?","opts":["165°F (74°C) for <1 second","155°F (68°C) for 17 seconds","145°F (63°C) for 15 seconds","145°F (63°C) for 4 minutes","135°F (57°C)"],"ans":4,"ansText":"E. 135°F (57°C)","assigned":false,"why":"Plant foods cooked for hot holding must reach 135°F (57°C).","kn":"Recalling that fruit, vegetables, grains and legumes cooked for hot holding need 135°F (57°C).","img":false,"web":true},{"id":"AQ06-12","src":"SSM9E Activity Quiz 6","no":"Cooling Food","ch":6,"tp":"cool","type":"short","q":"What is one way you can correctly cool a large pot of chili?","ansText":"Divide it into smaller containers, then cool it with one of these: place it in an ice-water bath and stir it; stir it with ice paddles; or put it in a blast chiller. The chili could also be made with less water, and cold water or ice added after cooking.","assigned":false,"why":"Large amounts of food cool too slowly; dividing them and using an active cooling method gets them through the danger zone in time.","kn":"Applying cooling methods: first divide the food into smaller containers, then use an ice-water bath, ice paddles, a blast chiller, or add ice or cold water to a reduced-water recipe.","img":false,"web":true},{"id":"AQ07-01","src":"SSM9E Activity Quiz 7","no":"True or False #1","ch":7,"tp":"hold","type":"tf","q":"Hold cold TCS food at an internal temperature of 41°F (5°C) or lower.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"Cold TCS food must be held at 41°F (5°C) or lower.","kn":"Recalling the cold-holding temperature.","img":false,"web":true,"mcq":{"q":"At what internal temperature must cold TCS food be held?","opts":["45°F (7°C) or lower","50°F (10°C) or lower","41°F (5°C) or lower","32°F (0°C) or lower"],"ans":2}},{"id":"AQ07-02","src":"SSM9E Activity Quiz 7","no":"True or False #2","ch":7,"tp":"hold","type":"tf","q":"Hold hot TCS food at an internal temperature of 120°F (49°C) or higher.","opts":["True","False"],"ans":1,"ansText":"False","assigned":false,"why":"Hot TCS food must be held at 135°F (57°C) or higher.","kn":"Recalling the hot-holding temperature, 135°F (57°C); 120°F is inside the temperature danger zone.","img":false,"web":true,"mcq":{"q":"At what internal temperature must hot TCS food be held?","opts":["120°F (49°C) or higher","135°F (57°C) or higher","125°F (52°C) or higher","165°F (74°C) or higher"],"ans":1}},{"id":"AQ07-03","src":"SSM9E Activity Quiz 7","no":"True or False #3","ch":7,"tp":"hold","type":"tf","q":"Your operation may be allowed to hold chicken salad without temperature control if the operation has written procedures maintained on-site and made available to the regulatory authority upon request.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"Holding food without temperature control requires written procedures available to the regulatory authority.","kn":"Knowing that time can be used as a control for TCS food only with written procedures kept on-site and approved by the regulatory authority if required.","img":false,"web":true,"mcq":{"q":"What does an operation need before it can hold chicken salad without temperature control?","opts":["Written procedures kept on-site and available to the regulatory authority","A HACCP plan written for the chicken salad and approved by the FDA in advance","A sign telling customers the food isn’t temperature-controlled","A thermometer placed inside the salad and checked by customers"],"ans":0}},{"id":"AQ07-04","src":"SSM9E Activity Quiz 7","no":"True or False #4","ch":7,"tp":"hold","type":"tf","q":"When holding TCS food for service, the internal temperature must be checked at least every four hours.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"Check held food at least every four hours; checking every two hours leaves time to fix problems.","kn":"Recalling how often to check held food: at least every four hours (every two hours leaves time for corrective action).","img":false,"web":true,"mcq":{"q":"How often must the internal temperature of TCS food held for service be checked?","opts":["At least once per shift","At least every six hours","Only when the food is first put out","At least every four hours"],"ans":3}},{"id":"AQ07-05","src":"SSM9E Activity Quiz 7","no":"True or False #5","ch":7,"tp":"serve","type":"tf","q":"A serving utensil cannot be stored outside of the food.","opts":["True","False"],"ans":1,"ansText":"False","assigned":false,"why":"Serving utensils can be stored in the food with the handle extended above the rim, or on a clean and sanitized food-contact surface.","kn":"Knowing the acceptable places for serving utensils: in the food with the handle out, or on a clean and sanitized food-contact surface.","img":false,"web":true,"mcq":{"q":"Where can serving utensils be stored between uses?","opts":["Only in a drawer or bin away from the food, never touching any surface","In a container of room-temperature water placed right next to the food being served","In the food with the handle above the rim, or on a clean, sanitized surface","Fully submerged in the food"],"ans":2}},{"id":"AQ07-06","src":"SSM9E Activity Quiz 7","no":"True or False #6","ch":7,"tp":"serve","type":"tf","q":"A single-service carryout container cannot be refilled for a customer.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"Single-service containers are not designed to be cleaned and sanitized, so they must not be refilled.","kn":"Knowing that single-service items are designed to be used once and can’t be safely cleaned and reused.","img":false,"web":true,"mcq":{"q":"A customer asks you to refill their single-service carryout container. What should you do?","opts":["Refill it if it looks clean","Rinse it with hot water, then refill it","Refill it only with the same food it held before","Don’t refill it; serve the food in a new container"],"ans":3}},{"id":"AQ07-07","src":"SSM9E Activity Quiz 7","no":"Service Guidelines #1","ch":7,"tp":"serve","type":"short","q":"A server puts ice into a glass with their bare hands. What is the server doing wrong, and what should they do instead?","ansText":"The server is using their hands to put ice into a glass. The server should use an ice scoop or tongs.","assigned":false,"why":"Ice is a ready-to-eat food; bare hands can contaminate it.","kn":"Recognizing that ice is a ready-to-eat food and must never be handled with bare hands; use an ice scoop or tongs.","img":true,"web":true,"note":"The original shows a picture; the question is written from the answer key’s description of it."},{"id":"AQ07-08","src":"SSM9E Activity Quiz 7","no":"Service Guidelines #2","ch":7,"tp":"serve","type":"short","q":"A server holds a serving spoon by the bowl, the part that touches food. What is the server doing wrong, and what should they do instead?","ansText":"The server is holding the spoon by the food-contact surface. The server should hold the spoon by the handle.","assigned":false,"why":"Touching the food-contact surface of a utensil can transfer pathogens to the food.","kn":"Knowing to hold serving utensils by the handle so hands never touch food-contact surfaces.","img":true,"web":true,"note":"The original shows a picture; the question is written from the answer key’s description of it."},{"id":"AQ07-09","src":"SSM9E Activity Quiz 7","no":"Service Guidelines #3","ch":7,"tp":"serve","type":"short","q":"A server carries a cup with their fingers touching the inside of it, where the drink goes. What is the server doing wrong, and what should they do instead?","ansText":"The server is touching the food-contact surface of the cup. The server should carry cups and glasses in a rack or on a tray to avoid touching the food-contact surfaces.","assigned":false,"why":"The inside and rim of a cup are food-contact surfaces; fingers can contaminate them.","kn":"Knowing to avoid touching the food-contact surfaces of cups and glasses by carrying them in a rack or on a tray.","img":true,"web":true,"note":"The original shows a picture; the question is written from the answer key’s description of it."},{"id":"AQ07-10","src":"SSM9E Activity Quiz 7","no":"Short Answer #1","ch":7,"tp":"serve","type":"short","q":"Why shouldn’t a server use a glass to scoop ice?","ansText":"The glass may break or chip.","assigned":false,"why":"Broken glass in ice is a physical contaminant that is hard to see.","kn":"Knowing the physical-contamination risk: a glass can break or chip into the ice.","img":false,"web":true},{"id":"AQ07-11","src":"SSM9E Activity Quiz 7","no":"Short Answer #2","ch":7,"tp":"serve","type":"short","q":"When serving food, how many serving utensils must be available?","ansText":"A separate utensil for each food item.","assigned":false,"why":"Sharing one utensil between foods can spread pathogens and allergens.","kn":"Knowing that each food item needs its own serving utensil to prevent cross-contamination and cross-contact.","img":false,"web":true},{"id":"AQ08-01","src":"SSM9E Activity Quiz 8","no":"True or False #1","ch":8,"tp":"culture","type":"tf","q":"Active managerial control can be achieved through simple solutions such as self-inspections.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"The FDA says active managerial control can use simple tools such as self-inspections or comprehensive solutions such as HACCP.","kn":"Knowing that active managerial control ranges from simple tools (self-inspections, training) to comprehensive systems like HACCP.","img":false,"web":true,"mcq":{"q":"How can active managerial control be achieved?","opts":["Through simple tools like self-inspections or comprehensive ones like HACCP","Only through a full HACCP plan approved by the regulatory authority","Only through regular inspections carried out by the local regulatory authority","Only by hiring a third-party auditor"],"ans":0}},{"id":"AQ08-02","src":"SSM9E Activity Quiz 8","no":"True or False #2","ch":8,"tp":"culture","type":"tf","q":"The purpose of a food safety management system is to control risks and hazards throughout the flow of food.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"A food safety management system is a group of practices and procedures that control risks and hazards throughout the flow of food.","kn":"Knowing what a food safety management system is for: preventing foodborne illness by controlling risks across the flow of food.","img":false,"web":true,"mcq":{"q":"What is the purpose of a food safety management system?","opts":["To track food costs and reduce waste","To control risks and hazards throughout the flow of food","To replace regulatory inspections","To set employee schedules around food prep"],"ans":1}},{"id":"AQ08-03","src":"SSM9E Activity Quiz 8","no":"True or False #3","ch":8,"tp":"culture","type":"tf","q":"Making employees aware of the purpose of food safety training is important for building a strong food safety culture.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"Employees who understand why food safety matters follow practices more consistently.","kn":"Knowing that a strong food safety culture comes from staff understanding why the rules matter, not just following them.","img":false,"web":true,"mcq":{"q":"Which helps build a strong food safety culture?","opts":["Training employees only after a violation","Leaving food safety decisions to the manager alone","Making employees aware of why food safety training matters","Relying on inspectors to find problems"],"ans":2}},{"id":"AQ08-04","src":"SSM9E Activity Quiz 8","no":"True or False #4","ch":8,"tp":"culture","type":"tf","q":"Food establishments must have a food safety management system documented in writing.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"Written policies and procedures make the system consistent and let it be trained, monitored and verified.","kn":"Knowing that the quiz expects a food safety management system to be documented in writing.","img":false,"web":true,"note":"The quiz key marks this True. The FDA Food Code itself only requires written plans in specific cases (such as HACCP plans), so treat this as the course’s rule.","mcq":{"q":"How should a food establishment’s food safety management system be kept?","opts":["Documented in writing","Kept in the manager’s memory","Explained to staff only on their first day","Written only after a failed inspection"],"ans":0}},{"id":"AQ08-05","src":"SSM9E Activity Quiz 8","no":"True or False #5","ch":8,"tp":"haccp","type":"tf","q":"Cooking poultry to 165°F (74°C) is a critical limit.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"A critical limit is a measurable requirement at a CCP, such as cooking poultry to 165°F (74°C).","kn":"Recognizing a critical limit: the minimum or maximum value that must be met at a critical control point, such as a cooking temperature.","img":false,"web":true,"mcq":{"q":"Cooking poultry to 165°F (74°C) is an example of which HACCP term?","opts":["A corrective action","A critical limit","A hazard analysis","Record keeping"],"ans":1}},{"id":"AQ08-06","src":"SSM9E Activity Quiz 8","no":"Common Risk Factors","ch":8,"tp":"culture","type":"list","q":"List the five common risk factors responsible for foodborne illness.","ansList":["Purchasing food from unsafe sources","Failing to cook food correctly","Holding food at incorrect temperatures","Using contaminated equipment","Practicing poor personal hygiene"],"ansText":"Purchasing food from unsafe sources; Failing to cook food correctly; Holding food at incorrect temperatures; Using contaminated equipment; Practicing poor personal hygiene","assigned":false,"why":"These are the five most common risk factors identified by the CDC.","kn":"Recalling the five CDC risk factors that active managerial control is designed to control.","img":false,"web":true},{"id":"AQ08-07","src":"SSM9E Activity Quiz 8","no":"Active Managerial Control","ch":8,"tp":"culture","type":"list","q":"List two of the six steps in implementing active managerial control.","ansList":["Find potential risks","Monitor critical activities in the operation","Take corrective action","Oversee staff","Train staff","Re-evaluate the program"],"need":2,"ansText":"Any 2 of: Find potential risks; Monitor critical activities in the operation; Take corrective action; Oversee staff; Train staff; Re-evaluate the program","assigned":false,"why":"Active managerial control is a cycle of identifying, monitoring, correcting, overseeing, training and re-evaluating.","kn":"Recalling the active managerial control cycle, from finding risks to re-evaluating the program.","img":false,"web":true},{"id":"AQ08-08","src":"SSM9E Activity Quiz 8","no":"FDA Public Health Interventions","ch":8,"tp":"culture","type":"multi","q":"Which of these are FDA public health interventions? Select every one that applies.","opts":["Demonstration of knowledge","Staff health controls","Controlling hands as a vehicle of contamination","Time and temperature parameters for controlling pathogens","Consumer advisories","HACCP planning"],"ans":[0,1,2,3,4],"ansText":"A, B, C, D, E: Demonstration of knowledge; Staff health controls; Controlling hands as a vehicle of contamination; Time and temperature parameters for controlling pathogens; Consumer advisories","assigned":false,"why":"The FDA’s five interventions: demonstration of knowledge, staff health controls, controlling hands, time and temperature parameters, consumer advisories.","kn":"Recalling the five FDA public health interventions. HACCP planning is the trap: it is a separate food safety system, not one of the five.","img":false,"web":true,"mcq":{"q":"Which of these is NOT one of the FDA’s public health interventions?","opts":["Staff health controls","Consumer advisories","HACCP planning","Demonstration of knowledge"],"ans":2}},{"id":"AQ08-09","src":"SSM9E Activity Quiz 8","no":"HACCP","ch":8,"tp":"haccp","type":"fill","q":"What does the acronym HACCP stand for?","ansText":"Hazard Analysis Critical Control Point","assigned":false,"why":"HACCP: Hazard Analysis Critical Control Point.","kn":"Recalling what HACCP stands for.","img":false,"web":true,"note":"The answer key heading misspells it “HAACP”.","mcq":{"q":"What does the acronym HACCP stand for?","opts":["Health and Allergen Control Compliance Plan","Hazard Assessment and Corrective Control Procedure","Hazard Analysis Critical Control Point","Health Analysis of Critical Cooking Points"],"ans":2}},{"id":"AQ09-01","src":"SSM9E Activity Quiz 9","no":"True or False #1","ch":9,"tp":"utilities","type":"tf","q":"Different areas of a facility have different lighting intensity requirements.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"Lighting requirements vary by area; prep areas need brighter light than dry storage.","kn":"Knowing that required lighting intensity depends on the area (for example, prep areas need more light than storage areas).","img":false,"web":true,"mcq":{"q":"Which statement about lighting in a food facility is correct?","opts":["All areas must have the same lighting intensity","Lighting rules apply only to dining areas","Different areas have different lighting intensity requirements","Only dry storage areas have lighting requirements"],"ans":2}},{"id":"AQ09-02","src":"SSM9E Activity Quiz 9","no":"True or False #2","ch":9,"tp":"design","type":"tf","q":"When mounted on legs, stationary equipment must be at least 2 inches (5 centimeters) off the floor.","opts":["True","False"],"ans":1,"ansText":"False","assigned":false,"why":"Stationary equipment on legs must be at least 6 inches (15 centimeters) off the floor.","kn":"Recalling the 6-inch (15 cm) rule for floor-mounted equipment on legs; 4 inches applies to tabletop equipment.","img":false,"web":true,"mcq":{"q":"When stationary equipment is mounted on legs, how far off the floor must it be?","opts":["At least 2 inches (5 centimeters)","At least 4 inches (10 centimeters)","At least 6 inches (15 centimeters)","At least 12 inches (30 centimeters)"],"ans":2}},{"id":"AQ09-03","src":"SSM9E Activity Quiz 9","no":"True or False #3","ch":9,"tp":"emerg","type":"tf","q":"An electrical power outage is considered by local regulatory authorities to be an imminent health hazard.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"A power outage is an imminent health hazard that may require closing the operation.","kn":"Recognizing imminent health hazards: power outages, water interruptions, sewage backups, fire, flood and pest infestations.","img":false,"web":true,"mcq":{"q":"How do regulatory authorities treat an electrical power outage in a food operation?","opts":["As a minor issue that can wait until the next inspection","As an imminent health hazard","As a pest control issue","As an issue only if it lasts more than 24 hours"],"ans":1}},{"id":"AQ09-04","src":"SSM9E Activity Quiz 9","no":"True or False #4","ch":9,"tp":"design","type":"tf","q":"The EPA creates national standards for foodservice equipment that comes in contact with food.","opts":["True","False"],"ans":1,"ansText":"False","assigned":false,"why":"Equipment standards come from ANAB-accredited certification programs such as NSF, UL EPH and ETL sanitation.","kn":"Knowing who certifies food equipment: ANAB-accredited programs such as NSF, not the EPA.","img":false,"web":true,"mcq":{"q":"Who creates the standards for foodservice equipment that comes in contact with food?","opts":["The EPA","ANAB-accredited programs such as NSF, UL EPH and ETL","The equipment’s manufacturer alone","The local fire department"],"ans":1}},{"id":"AQ09-05","src":"SSM9E Activity Quiz 9","no":"True or False #5","ch":9,"tp":"design","type":"tf","q":"A plan must be submitted to the regulatory authority before starting a remodeling project.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"Before new construction or remodeling, submit plans to the regulatory authority for review.","kn":"Knowing the plan-review rule for new construction and remodeling.","img":false,"web":true,"mcq":{"q":"What must be done before starting a remodeling project?","opts":["Submit a plan to the regulatory authority","Hire a pest control operator","Close the operation for one week","Notify customers in writing"],"ans":0}},{"id":"AQ09-06","src":"SSM9E Activity Quiz 9","no":"True or False #6","ch":9,"tp":"utilities","type":"tf","q":"Dirty mop water can be disposed of into a public storm drain.","opts":["True","False"],"ans":1,"ansText":"False","assigned":false,"why":"Wastewater, including mop water, must be dumped into a service sink or floor drain connected to an approved sewage system.","kn":"Knowing that wastewater must go into an approved sewage system (service sink or floor drain), never a storm drain.","img":false,"web":true,"mcq":{"q":"Where should dirty mop water be dumped?","opts":["Into a public storm drain","Into a handwashing sink","Into a three-compartment sink","Into a service sink or floor drain"],"ans":3}},{"id":"AQ09-07","src":"SSM9E Activity Quiz 9","no":"Handwashing Stations","ch":9,"tp":"hwstation","type":"list","q":"What items are needed in a handwashing station?","ansList":["Running water at a temperature of at least 85°F (29°C)","Soap","A way to dry hands","Garbage container","Signage telling staff members to wash hands"],"ansText":"Running water at a temperature of at least 85°F (29°C); Soap; A way to dry hands; Garbage container; Signage telling staff members to wash hands","assigned":false,"why":"Handwashing stations must be fully stocked and available at all times.","kn":"Recalling everything a handwashing station must have, including the minimum water temperature.","img":false,"web":true},{"id":"AQ09-08","src":"SSM9E Activity Quiz 9","no":"Building Systems #1","ch":9,"tp":"plumbing","type":"mc","q":"Which definition matches “air gap”?","opts":["Air space that separates an outlet of safe water from a potentially contaminated source of water","Backup of sewage from an operation’s floor drain","Mechanical device that prevents backsiphonage","Reverse flow of contaminants through a cross-connection into a drinkable water supply","Measure of lighting intensity","Physical link between safe water and dirty water","Protective lighting"],"ans":0,"ansText":"A. Air space that separates an outlet of safe water from a potentially contaminated source of water","assigned":false,"why":"An air gap is the air space between a water supply outlet and the flood rim of a sink or other source of dirty water.","kn":"Defining an air gap: an air space between the water outlet and a possibly contaminated source, the only completely reliable way to prevent backflow.","img":false,"web":true},{"id":"AQ09-09","src":"SSM9E Activity Quiz 9","no":"Building Systems #2","ch":9,"tp":"plumbing","type":"mc","q":"Which definition matches “backflow”?","opts":["Air space that separates an outlet of safe water from a potentially contaminated source of water","Backup of sewage from an operation’s floor drain","Mechanical device that prevents backsiphonage","Reverse flow of contaminants through a cross-connection into a drinkable water supply","Measure of lighting intensity","Physical link between safe water and dirty water","Protective lighting"],"ans":3,"ansText":"D. Reverse flow of contaminants through a cross-connection into a drinkable water supply","assigned":false,"why":"Backflow is the unwanted reverse flow of contaminants through a cross-connection into a drinkable water supply.","kn":"Defining backflow as the reverse flow of contaminants through a cross-connection into drinkable water. The trap is the sewage-backup option.","img":false,"web":true},{"id":"AQ09-10","src":"SSM9E Activity Quiz 9","no":"Building Systems #3","ch":9,"tp":"plumbing","type":"mc","q":"Which definition matches “cross-connection”?","opts":["Air space that separates an outlet of safe water from a potentially contaminated source of water","Backup of sewage from an operation’s floor drain","Mechanical device that prevents backsiphonage","Reverse flow of contaminants through a cross-connection into a drinkable water supply","Measure of lighting intensity","Physical link between safe water and dirty water","Protective lighting"],"ans":5,"ansText":"F. Physical link between safe water and dirty water","assigned":false,"why":"A cross-connection is a physical link through which contaminants can enter a drinkable water supply.","kn":"Defining a cross-connection: a physical link between safe and dirty water (for example a hose in a mop bucket).","img":false,"web":true},{"id":"AQ09-11","src":"SSM9E Activity Quiz 9","no":"Building Systems #4","ch":9,"tp":"plumbing","type":"mc","q":"Which definition matches “vacuum breaker”?","opts":["Air space that separates an outlet of safe water from a potentially contaminated source of water","Backup of sewage from an operation’s floor drain","Mechanical device that prevents backsiphonage","Reverse flow of contaminants through a cross-connection into a drinkable water supply","Measure of lighting intensity","Physical link between safe water and dirty water","Protective lighting"],"ans":2,"ansText":"C. Mechanical device that prevents backsiphonage","assigned":false,"why":"A vacuum breaker is a mechanical backflow prevention device that stops backsiphonage.","kn":"Defining a vacuum breaker as a mechanical device that prevents backsiphonage. Don’t confuse the device with the air gap, which is a space.","img":false,"web":true},{"id":"AQ10-01","src":"SSM9E Activity Quiz 10","no":"True or False #1","ch":10,"tp":"howclean","type":"tf","q":"Surfaces must be sanitized before they are cleaned.","opts":["True","False"],"ans":1,"ansText":"False","assigned":false,"why":"Cleaning removes food and dirt; sanitizing afterward reduces pathogens to safe levels.","kn":"Knowing the order: clean first, then sanitize. Sanitizer can’t work on a dirty surface.","img":false,"web":true,"mcq":{"q":"In what order must a surface be cleaned and sanitized?","opts":["Sanitize it first, then clean it","Clean it first, then sanitize it","Clean and sanitize it at the same time with one product","Either order works"],"ans":1}},{"id":"AQ10-02","src":"SSM9E Activity Quiz 10","no":"True or False #2","ch":10,"tp":"agents","type":"tf","q":"Cleaning reduces the number of pathogens on a surface to safe levels.","opts":["True","False"],"ans":1,"ansText":"False","assigned":false,"why":"Sanitizing, not cleaning, reduces pathogens to safe levels.","kn":"Telling cleaning from sanitizing: cleaning removes dirt and food; sanitizing is what reduces pathogens to safe levels.","img":false,"web":true,"mcq":{"q":"Which step reduces the number of pathogens on a surface to safe levels?","opts":["Sanitizing","Cleaning","Rinsing","Air-drying"],"ans":0}},{"id":"AQ10-03","src":"SSM9E Activity Quiz 10","no":"True or False #3","ch":10,"tp":"dish","type":"tf","q":"Utensils cleaned and sanitized in a three-compartment sink should be dried with a clean towel.","opts":["True","False"],"ans":1,"ansText":"False","assigned":false,"why":"Air-dry items on a clean and sanitized surface; never towel-dry them.","kn":"Knowing that sanitized items must air-dry; towels can recontaminate them.","img":false,"web":true,"mcq":{"q":"How should utensils be dried after cleaning and sanitizing in a three-compartment sink?","opts":["With a clean towel","With a single-use paper towel","Air-dried on a clean and sanitized surface","Rinsed and wiped with a wiping cloth"],"ans":2}},{"id":"AQ10-04","src":"SSM9E Activity Quiz 10","no":"True or False #4","ch":10,"tp":"dish","type":"tf","q":"Soaking items for 30 seconds in water at least 171°F (77°C) is an acceptable way to sanitize items.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"Heat sanitizing by hand: soak items in water at least 171°F (77°C) for 30 seconds.","kn":"Recalling the heat-sanitizing rule for manual dishwashing: at least 171°F (77°C) for 30 seconds.","img":false,"web":true,"mcq":{"q":"Which is an acceptable way to heat-sanitize items by hand?","opts":["Soak them for 30 seconds in water at least 171°F (77°C)","Soak them for 10 seconds in water at least 140°F (60°C)","Rinse them for 5 seconds in water at least 110°F (43°C)","Soak them for 30 seconds in water at least 135°F (57°C)"],"ans":0}},{"id":"AQ10-05","src":"SSM9E Activity Quiz 10","no":"True or False #5","ch":10,"tp":"agents","type":"tf","q":"Disinfectants may inactivate or eliminate pathogens.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"Disinfectants go further than sanitizers and may inactivate or eliminate pathogens.","kn":"Telling disinfectants (inactivate or eliminate pathogens) apart from sanitizers (reduce pathogens to safe levels).","img":false,"web":true,"mcq":{"q":"What can a disinfectant do?","opts":["Remove food and dirt from a surface","Inactivate or eliminate pathogens","Replace handwashing","Reduce pathogens only on food, not surfaces"],"ans":1}},{"id":"AQ10-06","src":"SSM9E Activity Quiz 10","no":"True or False #6","ch":10,"tp":"storeclean","type":"tf","q":"Wastewater can be disposed of in a service sink.","opts":["True","False"],"ans":0,"ansText":"True","assigned":false,"why":"Dump mop water and other wastewater into a service sink or floor drain.","kn":"Knowing where dirty water goes: a service sink or floor drain, never a handwashing, prep or dishwashing sink.","img":false,"web":true,"mcq":{"q":"Where can wastewater be disposed of?","opts":["In a food prep sink","In a public storm drain","In a handwashing sink","In a service sink"],"ans":3}},{"id":"AQ10-07","src":"SSM9E Activity Quiz 10","no":"When to Clean and Sanitize","ch":10,"tp":"howclean","type":"list","q":"List five instances when a food-contact surface must be cleaned and sanitized.","ansList":["After it is used","Before food handlers start working with a different type of food","After handling different raw TCS fruits and vegetables (for example, between cutting melons and leafy greens)","After four hours if items are in constant use","Any time a task is interrupted and the items being used may have been contaminated"],"ansText":"After it is used; Before food handlers start working with a different type of food; After handling different raw TCS fruits and vegetables (for example, between cutting melons and leafy greens); After four hours if items are in constant use; Any time a task is interrupted and the items being used may have been contaminated","assigned":false,"why":"These are the times when a surface could have picked up pathogens or allergens.","kn":"Recalling the five times food-contact surfaces must be cleaned and sanitized, including the four-hour rule for items in constant use.","img":false,"web":true},{"id":"AQ10-08","src":"SSM9E Activity Quiz 10","no":"Clean-In-Place Equipment","ch":10,"tp":"howclean","type":"order","q":"In what order must the steps for cleaning and sanitizing stationary equipment be completed?","opts":["Take removable parts off and wash, rinse, and sanitize them by hand or in a dishwasher if allowed.","Unplug the equipment.","Sanitize the equipment surfaces.","Rinse the equipment surfaces with clean water.","Allow the surfaces to air-dry.","Scrape or remove food from the equipment surface.","Wash the equipment surfaces."],"ans":[1,0,5,6,3,2,4],"ansText":"1. Unplug the equipment. (B); 2. Take removable parts off and wash, rinse, and sanitize them by hand or in a dishwasher if allowed. (A); 3. Scrape or remove food from the equipment surface. (F); 4. Wash the equipment surfaces. (G); 5. Rinse the equipment surfaces with clean water. (D); 6. Sanitize the equipment surfaces. (C); 7. Allow the surfaces to air-dry. (E)","assigned":false,"why":"Unplug first for safety, clean before sanitizing, and let everything air-dry.","kn":"Recalling the stationary-equipment sequence: unplug, remove parts, scrape, wash, rinse, sanitize, air-dry.","img":false,"web":true,"mcq":{"q":"What is the correct order for cleaning and sanitizing stationary equipment?","opts":["Scrape → unplug → remove and clean parts → wash → rinse → sanitize → air-dry","Unplug → remove and clean parts → scrape → wash → rinse → sanitize → air-dry","Unplug → remove and clean parts → scrape → wash → sanitize → rinse → air-dry","Unplug → scrape → wash → rinse → sanitize → air-dry → remove and clean parts"],"ans":1}},{"id":"AQ10-09","src":"SSM9E Activity Quiz 10","no":"Sanitizers","ch":10,"tp":"agents","type":"list","q":"List the five factors that affect a sanitizer’s effectiveness.","ansList":["Concentration","Temperature","Contact time","Water hardness","pH"],"ansText":"Concentration; Temperature; Contact time; Water hardness; pH","assigned":false,"why":"A sanitizer only works at the right concentration and temperature, for the right contact time, in water of suitable hardness and pH.","kn":"Recalling the five factors that decide whether a sanitizer works.","img":false,"web":true},{"id":"AQ10-10","src":"SSM9E Activity Quiz 10","no":"Cleaning and Sanitizing in a Three-Compartment Sink","ch":10,"tp":"dish","type":"order","q":"Put the steps for cleaning and sanitizing in a three-compartment sink in the correct order.","opts":["Sanitize items in the third sink.","Air-dry items on a clean and sanitized surface.","Rinse items in the second sink.","Rinse, scrape, or soak items before washing them.","Wash items in the first sink."],"ans":[3,4,2,0,1],"ansText":"1. Rinse, scrape, or soak items before washing them. (D); 2. Wash items in the first sink. (E); 3. Rinse items in the second sink. (C); 4. Sanitize items in the third sink. (A); 5. Air-dry items on a clean and sanitized surface. (B)","assigned":false,"why":"Each sink has one job (wash, rinse, sanitize), and items always air-dry at the end.","kn":"Recalling the three-compartment sink sequence: prep (rinse, scrape or soak), wash, rinse, sanitize, air-dry.","img":false,"web":true,"mcq":{"q":"What is the correct order for cleaning and sanitizing items in a three-compartment sink?","opts":["Wash (sink 1) → rinse, scrape, or soak → rinse (sink 2) → sanitize (sink 3) → air-dry","Rinse, scrape, or soak → wash (sink 1) → sanitize (sink 2) → rinse (sink 3) → air-dry","Rinse, scrape, or soak → wash (sink 1) → rinse (sink 2) → sanitize (sink 3) → towel-dry","Rinse, scrape, or soak → wash (sink 1) → rinse (sink 2) → sanitize (sink 3) → air-dry"],"ans":3}},{"id":"PT-01","src":"Practice Test","no":"Q1","type":"mc","q":"What is important when creating a self-inspection program?","opts":["It should mirror a regulatory inspection.","It should focus on foodborne-illness complaints.","It should focus on customer satisfaction surveys.","It should focus on food safety violations that are easy to fix."],"ans":0,"assigned":false,"ch":8,"tp":"selfinsp","why":"A self-inspection program works best when it follows the same standards a regulatory inspector uses.","kn":"Knowing that self-inspections should mirror the regulatory inspection. The traps narrow the program to complaints, customer surveys or easy fixes instead of the full set of food safety standards.","note":"Similar to DT-01 and MT-24.","ansText":"A. It should mirror a regulatory inspection.","img":false,"web":true},{"id":"PT-02","src":"Practice Test","no":"Q2","type":"mc","q":"When should self-inspections be performed in an operation?","opts":["Only when food safety issues are suspected","Primarily when preparing for a regulatory inspection","Only after receiving a customer food safety complaint","In addition to and more often than regulatory inspections"],"ans":3,"assigned":false,"ch":8,"tp":"selfinsp","why":"Self-inspections are done in addition to, and more often than, regulatory inspections, so problems are caught early.","kn":"Recognizing that self-inspections are routine and frequent, not reactive. The wrong options limit them to suspected problems, complaints or getting ready for the inspector.","ansText":"D. In addition to and more often than regulatory inspections","img":false,"web":true},{"id":"PT-03","src":"Practice Test","no":"Q3","type":"mc","q":"Who should be restricted from working with or around food?","opts":["A food handler who is vomiting","A food handler who has diarrhea","A food handler who has jaundice","A food handler with a sore throat and fever"],"ans":3,"assigned":false,"ch":3,"tp":"illness","why":"A sore throat with fever calls for restricting the food handler (excluding only when serving a high-risk population). Vomiting, diarrhea and jaundice call for exclusion.","kn":"Telling restrict from exclude: sore throat with fever is the restrict case in a regular operation, while vomiting, diarrhea and jaundice mean exclude.","note":"Similar to DT-15 and MT-01.","ansText":"D. A food handler with a sore throat and fever","img":false,"web":true},{"id":"PT-04","src":"Practice Test","no":"Q4","type":"mc","q":"Which symptoms must be reported to the regulatory authority?","opts":["Vomiting","Diarrhea","Jaundice","Sore throat and fever"],"ans":2,"assigned":false,"ch":3,"tp":"illness","why":"Jaundice must be reported to the regulatory authority. Vomiting and diarrhea alone are not reported unless they come with a reportable diagnosis.","kn":"Recalling which symptom triggers a report to the regulatory authority: jaundice. Vomiting and diarrhea mean exclusion and sore throat with fever means restriction, but none of them alone is reported.","ansText":"C. Jaundice","img":false,"web":true},{"id":"PT-05","src":"Practice Test","no":"Q5","type":"mc","q":"What is the maximum amount of time single-use gloves can be worn before they must be changed?","opts":["One hour","Two hours","Three hours","Four hours"],"ans":3,"assigned":false,"ch":3,"tp":"gloves","why":"Single-use gloves must be changed at least every four hours during continual use.","kn":"Recalling the four-hour maximum for continual glove use. Shorter times are distractors; gloves also change sooner when torn, dirty or when switching tasks.","note":"Similar to DT-18.","ansText":"D. Four hours","img":false,"web":true},{"id":"PT-06","src":"Practice Test","no":"Q6","type":"mc","q":"Why are short fingernails required for food handlers?","opts":["They are easier to keep clean.","They reduce the need to wash hands.","They prevent single-use gloves from slipping off.","They reduce the risk of spreading airborne pathogens."],"ans":0,"assigned":false,"ch":3,"tp":"handwash","why":"Short, filed nails are easier to keep clean. Long or ragged nails hold dirt and pathogens and can break off into food.","kn":"Linking short fingernails to keeping hands clean. The traps suggest short nails replace handwashing or have to do with glove fit or airborne pathogens.","ansText":"A. They are easier to keep clean.","img":false,"web":true},{"id":"PT-07","src":"Practice Test","no":"Q7","type":"mc","q":"Which is one of the Big Nine food allergens?","opts":["Avocado","Celery","Sesame","Mustard"],"ans":2,"assigned":false,"ch":2,"tp":"allergen","why":"Sesame is one of the Big Nine: milk, eggs, fish, crustacean shellfish, tree nuts, peanuts, wheat, soy and sesame.","kn":"Recalling the Big Nine allergens. Avocado, celery and mustard sound plausible but are not on the U.S. list.","note":"Similar to DT-22.","ansText":"C. Sesame","img":false,"web":true},{"id":"PT-08","src":"Practice Test","no":"Q8","type":"mc","q":"Which is a symptom of an allergic reaction?","opts":["Sweating","Wheezing","Vomiting","Jaundice"],"ans":1,"assigned":false,"ch":2,"tp":"allergen","why":"Wheezing (shortness of breath) is a classic allergic-reaction symptom.","kn":"Recognizing allergic-reaction symptoms such as wheezing, hives and swelling. Jaundice points to hepatitis A, not an allergy.","note":"ServSafe also lists vomiting among allergic-reaction symptoms, so C is arguably correct too. The key wants wheezing, the classic sign.","ansText":"B. Wheezing","img":false,"web":true},{"id":"PT-09","src":"Practice Test","no":"Q9","type":"mc","q":"Which situation would result in cross-contact?","opts":["Storing raw beef above ready-to-eat food","Cooking chicken and shrimp in the same fryer","Using the same cutting board for raw chicken and lettuce","Temping chicken and then ground beef with the same thermometer"],"ans":1,"assigned":false,"ch":2,"tp":"allergen","why":"Shrimp is a crustacean shellfish allergen. Frying chicken in the same oil carries the allergen onto the chicken, which is cross-contact.","kn":"Separating cross-contact (an allergen moving to another food) from cross-contamination (pathogens moving). The other three options are cross-contamination examples.","ansText":"B. Cooking chicken and shrimp in the same fryer","img":false,"web":true},{"id":"PT-10","src":"Practice Test","no":"Q10","type":"mc","q":"What must be included on the label of a restaurant’s signature BBQ sauce sold to the public?","opts":["pH of the sauce","Instructions for use","Nutritional information","Source of each major food allergen"],"ans":3,"assigned":false,"ch":5,"tp":"label","why":"Food packaged on-site for retail sale must list the source of each major food allergen it contains.","kn":"Knowing what a retail label must include. Instructions for use, pH and nutrition facts are not the required item here; the allergen source is.","note":"Similar to DT-27 and MT-03.","ansText":"D. Source of each major food allergen","img":false,"web":true},{"id":"PT-11","src":"Practice Test","no":"Q11","type":"mc","q":"What is required to be an approved supplier?","opts":["They use tamper-evident packaging.","They have a clean and modern facility.","They offer traceability for all ingredients.","They meet all applicable local, state, and federal laws."],"ans":3,"assigned":false,"ch":5,"tp":"supplier","why":"An approved supplier has been inspected and meets all applicable local, state and federal laws.","kn":"Defining an approved supplier by legal compliance and inspection. Tamper-evident packaging, a modern facility and traceability sound good but do not make a supplier approved.","note":"Similar to DT-28.","ansText":"D. They meet all applicable local, state, and federal laws.","img":false,"web":true},{"id":"PT-12","src":"Practice Test","no":"Q12","type":"mc","q":"At what temperature must most cold TCS food be received?","opts":["41°F (5°C) or lower","45°F (7°C) or lower","50°F (10°C) or lower","55°F (13°C) or lower"],"ans":0,"assigned":false,"ch":5,"tp":"recvtemp","why":"Most cold TCS food must be received at 41°F (5°C) or lower. Milk, shell eggs and shellfish have their own exceptions.","kn":"Recalling the standard receiving temperature for cold TCS food, 41°F. The 45°F option is the exception for milk, shell eggs and some shellfish, not the general rule.","ansText":"A. 41°F (5°C) or lower","img":false,"web":true},{"id":"PT-13","src":"Practice Test","no":"Q13","type":"mc","q":"What discard date should be placed on a label of beef chili prepared on October 1?","opts":["October 1","October 3","October 7","October 8"],"ans":2,"assigned":false,"ch":5,"tp":"label","why":"Ready-to-eat TCS food held at 41°F (5°C) can be kept 7 days, counting the prep day as day 1, so chili made October 1 is discarded October 7.","kn":"Applying the 7-day date-marking rule with the prep day counted as day 1. October 8 is the trap from counting the prep day as day 0.","note":"Similar to DT-45.","ansText":"C. October 7","img":false,"web":true},{"id":"PT-14","src":"Practice Test","no":"Q14","type":"mc","q":"These foods must be stored in the same cooler. In which top-to-bottom order should they be stored to prevent cross-contamination?","opts":["Salad greens; raw beef roast; raw salmon; raw chicken; raw ground beef","Salad greens; raw salmon; raw beef roast; raw ground beef; raw chicken","Salad greens; raw ground beef; raw salmon; raw beef roast; raw chicken","Salad greens; raw salmon; raw ground beef; raw beef roast; raw chicken"],"ans":1,"assigned":false,"ch":5,"tp":"storage","why":"Store top to bottom by minimum internal cooking temperature: ready-to-eat food, seafood, whole cuts of beef and pork, ground meat, then poultry.","kn":"Applying the cooler storage order, which follows each food’s minimum cooking temperature. The traps put ground beef, roast and salmon out of order; poultry always goes on the bottom.","note":"Similar to DT-31.","ansText":"B. Salad greens; raw salmon; raw beef roast; raw ground beef; raw chicken","img":false,"web":true},{"id":"PT-15","src":"Practice Test","no":"Q15","type":"mc","q":"Which food is in the temperature danger zone?","opts":["Soup held in a hot-holding unit at 136°F (58°C)","Meat loaf stored in a cooler at 38°F (3°C)","Raw chicken delivered at 40°F (4°C)","Cooked rice at 72°F (22°C) and left out for two hours"],"ans":3,"assigned":false,"ch":4,"tp":"tdz","why":"Cooked rice at 72°F (22°C) is inside the temperature danger zone of 41°F to 135°F (5°C to 57°C).","kn":"Spotting food inside the 41°F–135°F danger zone. Soup hot-held at 136°F and cold food at 38°F–40°F are outside it, so they are safe.","ansText":"D. Cooked rice at 72°F (22°C) and left out for two hours","img":false,"web":true},{"id":"PT-16","src":"Practice Test","no":"Q16","type":"mc","q":"Which food was thawed correctly?","opts":["Salmon thawed on a prep table","Turkey thawed in a cooler at 38°F (3°C)","Shrimp thawed in a sink full of water at 70°F (21°C)","Steaks thawed in a microwave and then placed in a cooler until needed"],"ans":1,"assigned":false,"ch":6,"tp":"thaw","why":"Thawing in a cooler at 41°F (5°C) or lower is safe. A prep table, standing water, and microwaving without cooking right away are not.","kn":"Recognizing the safe thawing methods: cooler, running water at 70°F or lower, microwave (then cook right away), or as part of cooking. Standing water and microwave-then-store are the traps.","ansText":"B. Turkey thawed in a cooler at 38°F (3°C)","img":false,"web":true},{"id":"PT-17","src":"Practice Test","no":"Q17","type":"mc","q":"Which food must be cooked to a minimum internal temperature of 155°F (68°C) for 17 seconds?","opts":["Blackened catfish","Cheeseburger","New York strip steak","Stuffed pasta"],"ans":1,"assigned":false,"ch":6,"tp":"cooktemp","why":"Ground meat, such as a cheeseburger patty, must reach 155°F (68°C) for 17 seconds.","kn":"Matching foods to cooking temperatures: 155°F for 17 seconds is for ground meat. Catfish and strip steak are 145°F; stuffed pasta is 165°F.","ansText":"B. Cheeseburger","img":false,"web":true},{"id":"PT-18","src":"Practice Test","no":"Q18","type":"mc","q":"Which food must be cooked to a minimum internal temperature of 165°F (74°C) for 15 seconds?","opts":["Lamb chops","Ostrich steak","Oyster stuffing","Buffalo burger"],"ans":2,"assigned":false,"ch":6,"tp":"cooktemp","why":"Stuffing, including stuffing made with fish or shellfish such as oyster stuffing, must be cooked to 165°F (74°C).","kn":"Knowing that stuffing and stuffed foods go to 165°F. Lamb chops are 145°F, and ostrich steak and buffalo burgers are 155°F.","note":"Current ServSafe wording for 165°F is “for <1 second”; “for 15 seconds” in this question is older wording. The answer is the same.","ansText":"C. Oyster stuffing","img":false,"web":true},{"id":"PT-19","src":"Practice Test","no":"Q19","type":"mc","q":"What minimum internal temperature must rice be cooked to?","opts":["135°F (57°C)","145°F (63°C) for 15 seconds","155°F (68°C) for 17 seconds","165°F (74°C) for 15 seconds"],"ans":0,"assigned":false,"ch":6,"tp":"cooktemp","why":"Plant foods such as rice that will be hot-held must be cooked to 135°F (57°C).","kn":"Recalling that fruits, vegetables, grains and legumes cooked for hot holding need only 135°F. The higher temperatures are for seafood, meat and poultry.","ansText":"A. 135°F (57°C)","img":false,"web":true},{"id":"PT-20","src":"Practice Test","no":"Q20","type":"mc","q":"Chicken breasts will be partially cooked, cooled, and then finished as they are ordered. What is the maximum amount of time allowed for the initial cooking step?","opts":["15 minutes","30 minutes","60 minutes","90 minutes"],"ans":2,"assigned":false,"ch":6,"tp":"prep","why":"When partially cooking food for later service, the initial cooking must last no longer than 60 minutes.","kn":"Recalling the 60-minute limit on the first cook in partial cooking. Longer times keep food in the danger zone too long.","note":"Similar to DT-37.","ansText":"C. 60 minutes","img":false,"web":true},{"id":"PT-21","src":"Practice Test","no":"Q21","type":"mc","q":"Which food was cooled correctly?","opts":["Clam chowder cooled from 135°F to 70°F (57°C to 21°C) in one hour and then from 70°F to 41°F (21°C to 5°C) in six hours","Chili cooled from 135°F to 70°F (57°C to 21°C) in two hours and then from 70°F to 41°F (21°C to 5°C) in four hours","Jambalaya cooled from 135°F to 70°F (57°C to 21°C) in three hours and then from 70°F to 41°F (21°C to 5°C) in two hours","Macaroni and cheese cooled from 135°F to 70°F (57°C to 21°C) in four hours and then from 70°F to 41°F (21°C to 5°C) in two hours"],"ans":1,"assigned":false,"ch":6,"tp":"cool","why":"Cool from 135°F to 70°F (57°C to 21°C) within 2 hours, then to 41°F (5°C) or lower within the next 4 hours, 6 hours total. Only the chili meets both limits.","kn":"Applying two-stage cooling: 2 hours to reach 70°F, 6 hours total. The clam chowder trap meets the first stage but takes 7 hours in all.","note":"Similar to DT-40 and MT-48.","ansText":"B. Chili cooled from 135°F to 70°F (57°C to 21°C) in two hours and then from 70°F to 41°F (21°C to 5°C) in four hours","img":false,"web":true},{"id":"PT-22","src":"Practice Test","no":"Q22","type":"mc","q":"Which is an acceptable method for cooling hot food?","opts":["Placing the food directly in a cooler","Placing the food in an ice-water bath","Leaving the food at room temperature","Rinsing the food with cold water"],"ans":1,"assigned":false,"ch":6,"tp":"cool","why":"An ice-water bath is an approved way to cool hot food. Coolers are not designed to cool hot food quickly.","kn":"Knowing the approved cooling methods: ice-water bath, ice paddle, blast chiller, or adding ice as an ingredient. Putting hot food straight into the cooler is the common trap.","note":"Similar to DT-38.","ansText":"B. Placing the food in an ice-water bath","img":false,"web":true},{"id":"PT-23","src":"Practice Test","no":"Q23","type":"mc","q":"To what temperature must TCS food be reheated for hot holding?","opts":["135°F (57°C) within two hours","145°F (63°C) for 15 seconds within two hours","155°F (68°C) for 17 seconds within two hours","165°F (74°C) for 15 seconds within two hours"],"ans":3,"assigned":false,"ch":6,"tp":"cool","why":"TCS food reheated for hot holding must reach 165°F (74°C) for 15 seconds within 2 hours.","kn":"Recalling the reheating rule for hot holding: 165°F for 15 seconds within 2 hours. 135°F is the holding temperature, not the reheating target.","note":"Similar to DT-41 and KH-21.","ansText":"D. 165°F (74°C) for 15 seconds within two hours","img":false,"web":true},{"id":"PT-24","src":"Practice Test","no":"Q24","type":"mc","q":"Which food is being held safely?","opts":["Minestrone soup held at 125°F (52°C)","Chili held at 136°F (58°C)","Potato salad held at 70°F (21°C)","Cut melon held at 65°F (18°C)"],"ans":1,"assigned":false,"ch":7,"tp":"hold","why":"Hot TCS food must be held at 135°F (57°C) or higher and cold TCS food at 41°F (5°C) or lower. Chili at 136°F is the only safe one.","kn":"Applying hot- and cold-holding temperatures. Soup at 125°F, potato salad at 70°F and cut melon at 65°F are all in the danger zone.","ansText":"B. Chili held at 136°F (58°C)","img":false,"web":true},{"id":"PT-25","src":"Practice Test","no":"Q25","type":"mc","q":"What is the minimum amount of time that food temperatures must be checked when holding food?","opts":["At least hourly","At least every two hours","At least every three hours","At least every four hours"],"ans":3,"assigned":false,"ch":7,"tp":"hold","why":"Check the temperature of held food at least every four hours. Checking every two hours leaves time to take corrective action.","kn":"Recalling the four-hour minimum for checking held food. Two hours is the recommended practice, which makes it a tempting but wrong answer for the minimum.","note":"Similar to MT-39.","ansText":"D. At least every four hours","img":false,"web":true},{"id":"PT-26","src":"Practice Test","no":"Q26","type":"mc","q":"What is required in jurisdictions that permit the refilling of containers returned by a customer?","opts":["The container must be a single-service container.","The container must be cleaned and sanitized by the food handler.","The container must be visually inspected by the customer.","The container must be verified by the FDA."],"ans":1,"assigned":false,"ch":7,"tp":"serve","why":"Where refilling returned take-home containers is allowed, the container must be cleaned and sanitized by the operation before it is refilled.","kn":"Knowing the condition for refilling a customer’s returned container: it must be cleaned and sanitized. Single-service containers can never be refilled, and a customer’s own check doesn’t count.","note":"Related to DT-09 and MT-42.","ansText":"B. The container must be cleaned and sanitized by the food handler.","img":false,"web":true},{"id":"PT-27","src":"Practice Test","no":"Q27","type":"mc","q":"Which foods cannot be re-served to another customer?","opts":["Bread rolls","Bottle of ketchup","Condiment packets","Unopened cracker packages"],"ans":0,"assigned":false,"ch":7,"tp":"serve","why":"Uneaten bread rolls cannot be re-served. Only unopened, prepackaged food in good condition, such as condiment packets or wrapped crackers, can be.","kn":"Telling which items can be re-served: unopened, packaged ones. Bread from a basket has been exposed to a customer, so it can’t go to anyone else.","note":"Similar to DT-52.","ansText":"A. Bread rolls","img":false,"web":true},{"id":"PT-28","src":"Practice Test","no":"Q28","type":"mc","q":"What factors influence the effectiveness of a sanitizer?","opts":["Color, odor, packaging date, and brand","Type of surface, lighting, air temperature, and humidity","Storage temperature, expiration date, dilution method, and type","Concentration, water temperature, contact time, water hardness, and pH"],"ans":3,"assigned":false,"ch":10,"tp":"agents","why":"Sanitizer effectiveness depends on concentration, water temperature, contact time, water hardness and pH.","kn":"Recalling the five factors that affect how well a sanitizer works. The distractors list unrelated features like color, brand or lighting.","ansText":"D. Concentration, water temperature, contact time, water hardness, and pH","img":false,"web":true},{"id":"PT-29","src":"Practice Test","no":"Q29","type":"mc","q":"An employee needed to clean and sanitize a prep table. They removed food from the surface, washed the surface with soapy water, rinsed the surface with clean water, sanitized the surface with a sanitizing solution, and dried the surface with a paper towel. What mistake did the employee make?","opts":["They washed the surface with soapy water.","They rinsed the surface with clean water.","They dried the surface with a paper towel.","They sanitized the surface with sanitizer solution."],"ans":2,"assigned":false,"ch":10,"tp":"howclean","why":"After sanitizing, a surface must air-dry. Drying it with a towel can recontaminate it.","kn":"Knowing the five steps for cleaning a surface: scrape, wash, rinse, sanitize, air-dry. Every step in the story is right except drying with a towel.","note":"Similar to DT-58.","ansText":"C. They dried the surface with a paper towel.","img":false,"web":true},{"id":"PT-30","src":"Practice Test","no":"Q30","type":"mc","q":"What is the difference between a sanitizer and a disinfectant?","opts":["A sanitizer is stronger.","A sanitizer is best reserved for cleaning bodily fluid spills.","A disinfectant reduces pathogens to safe levels.","A disinfectant inactivates or eliminates pathogens."],"ans":3,"assigned":false,"ch":10,"tp":"agents","why":"A sanitizer reduces pathogens to safe levels; a disinfectant goes further and may inactivate or eliminate them.","kn":"Distinguishing sanitizers from disinfectants. Option C gives the sanitizer’s definition, and disinfectants (not sanitizers) are the ones reserved for bodily-fluid cleanup.","note":"Similar to DT-60.","ansText":"D. A disinfectant inactivates or eliminates pathogens.","img":false,"web":true},{"id":"PT-31","src":"Practice Test","no":"Q31","type":"mc","q":"Chemicals must be stored","opts":["in their original containers.","in a locked cabinet at all times.","in a secure location when not in use.","above food, equipment, utensils, and linens."],"ans":0,"assigned":false,"ch":10,"tp":"storeclean","why":"Keep chemicals in their original containers (or in working containers labeled with the chemical’s common name), stored away from food and food-contact items.","kn":"Knowing how chemicals are stored: in original or properly labeled containers, away from and never above food, equipment, utensils and linens.","ansText":"A. in their original containers.","img":false,"web":true},{"id":"PT-32","src":"Practice Test","no":"Q32","type":"mc","q":"What must be done before starting a new construction or remodeling project in a food establishment?","opts":["A zoning request must be obtained.","A plan must be submitted to the regulatory authority.","A preliminary inspection must be conducted by the fire department.","A food safety audit must be conducted by the regulatory authority."],"ans":1,"assigned":false,"ch":9,"tp":"design","why":"Before new construction or remodeling, a plan must be submitted to the regulatory authority and, if required, approved.","kn":"Recalling the plan-review requirement. Zoning requests, fire inspections and audits sound official but are not the food safety requirement.","note":"Similar to DT-04 and DT-64.","ansText":"B. A plan must be submitted to the regulatory authority.","img":false,"web":true},{"id":"PT-33","src":"Practice Test","no":"Q33","type":"mc","q":"To be effective, a food safety management system relies on the establishment of food safety policies and procedures, employee training on them, and","opts":["modeling to ensure employees remember them.","monitoring to ensure employees are following them.","auditing to ensure there are no food safety violations.","verification to ensure the program is working as intended."],"ans":1,"assigned":false,"ch":8,"tp":"culture","why":"A food safety management system works when policies and procedures are set, staff are trained on them, and managers monitor that staff follow them.","kn":"Knowing that monitoring is how managers confirm training is followed. Verification is a HACCP principle for checking that a plan works, so it is a tempting look-alike.","ansText":"B. monitoring to ensure employees are following them.","img":false,"web":true},{"id":"PT-34","src":"Practice Test","no":"Q34","type":"mc","q":"An employee drops a running hose into a mop bucket to fill it up. Why is this a bad practice?","opts":["The employee has created backflow.","The employee has created an air gap.","The employee has created a backsiphonage.","The employee has created a cross-connection."],"ans":3,"assigned":false,"ch":9,"tp":"plumbing","why":"A hose dropped into a mop bucket is a cross-connection: a physical link between safe water and dirty water that can allow backflow.","kn":"Recognizing a cross-connection. Backflow and backsiphonage are what the link can cause, and an air gap is the fix, so all three are close look-alikes.","note":"Similar to DT-67.","ansText":"D. The employee has created a cross-connection.","img":false,"web":true},{"id":"PT-35","src":"Practice Test","no":"Q35","type":"mc","q":"Which situation is considered an imminent health hazard?","opts":["A pest sighting near the back door of a facility","A dishwasher leaking water onto a kitchen floor","A sewage backup that contaminates food in dry storage","A power failure that shuts off power to walk-in coolers for one hour"],"ans":2,"assigned":false,"ch":9,"tp":"emerg","why":"A sewage backup that contaminates food is an imminent health hazard: a significant threat that needs immediate correction or closing.","kn":"Recognizing an imminent health hazard: something that puts food at risk now. A short power outage, a leak or a pest sighting outside does not meet that bar.","note":"Similar to DT-77.","ansText":"C. A sewage backup that contaminates food in dry storage","img":false,"web":true},{"id":"PT-36","src":"Practice Test","no":"Q36","type":"mc","q":"Who should apply pesticides in an operation?","opts":["The manager","Janitorial staff","A regulatory agency","A pest control operator"],"ans":3,"assigned":false,"ch":9,"tp":"pest","why":"Pesticides should be applied only by a licensed pest control operator (PCO).","kn":"Knowing who applies pesticides: a licensed PCO, not the manager, janitorial staff or a regulator.","ansText":"D. A pest control operator","img":false,"web":true},{"id":"PT-37","src":"Practice Test","no":"Q37","type":"mc","q":"How should animals on the premises be handled?","opts":["Do not intervene.","Prevent them from entering.","Allow all animals on the premises.","Check with your local regulatory authority."],"ans":3,"assigned":false,"ch":9,"tp":"pest","why":"Rules for animals on the premises (beyond service animals) vary by jurisdiction, so check with the local regulatory authority.","kn":"Knowing that the rule for animals on the premises comes from the local regulatory authority. The traps are absolute answers: never intervening, keeping every animal out, or allowing all.","note":"The key’s answer matches DT-76. Keeping animals out (B) is the general pest-prevention habit, but the question asks for the rule, which comes from your local regulatory authority.","ansText":"D. Check with your local regulatory authority.","img":false,"web":true},{"id":"PT-38","src":"Practice Test","no":"Q38","type":"mc","q":"A shipment of oysters has arrived at an establishment. How long must the accompanying shellstock tags be kept on file?","opts":["7 days","30 days","60 days","90 days"],"ans":3,"assigned":false,"ch":5,"tp":"recvpack","why":"Shellstock tags must be kept on file for 90 days from the date the last shellfish was sold or served from the container.","kn":"Recalling the 90-day rule for shellstock tags. 7, 30 and 60 days are distractors.","note":"Similar to MT-38.","ansText":"D. 90 days","img":false,"web":true},{"id":"PT-39","src":"Practice Test","no":"Q39","type":"mc","q":"Sewage has backed up from one of the drains in an establishment. What should a manager do next?","opts":["Call a plumber.","Close the establishment.","Call the regulatory authority.","Determine if the hazard will affect food safety."],"ans":3,"assigned":false,"ch":9,"tp":"emerg","why":"In a crisis such as a sewage backup, the manager first determines whether it threatens food safety. If there is a significant risk, service stops and the regulatory authority is notified.","kn":"Knowing the order of response to a facility emergency: assess the risk to food first. Calling a plumber, closing or calling the authority come after that decision.","note":"The key’s answer is defensible: assessing the risk comes first. DT-78 covers the next step when the risk is significant (stop service and notify the regulatory authority).","ansText":"D. Determine if the hazard will affect food safety.","img":false,"web":true},{"id":"PT-40","src":"Practice Test","no":"Q40","type":"mc","q":"What should be done with a food item that has been recalled?","opts":["FIFO the item.","Discount the item.","Use the item immediately.","Remove the item from inventory and label it."],"ans":3,"assigned":false,"ch":5,"tp":"supplier","why":"A recalled item must be removed from inventory, labeled so it isn’t used, and stored separately until the supplier says what to do with it.","kn":"Knowing how to handle a recalled item: remove it, label it and keep it apart. Discounting it, using it quickly or rotating it (FIFO) keeps it in circulation.","note":"Similar to DT-80, KH-09 and MT-27.","ansText":"D. Remove the item from inventory and label it.","img":false,"web":true},{"id":"DT-01","src":"Diagnostic Test","no":"Q1","type":"mc","ch":8,"q":"Which is true about self-inspections?","opts":["They should be performed annually.","They can be performed in place of the regulatory inspection.","They should mirror inspections performed by the regulatory authority.","They are unnecessary if the establishment has regulatory inspections."],"ans":2,"assigned":false,"bookHeading":"Self-Inspections","bookPage":"183","tp":"selfinsp","ansText":"C. They should mirror inspections performed by the regulatory authority.","why":"Self-inspections work best when they use the same standards and checklist the regulatory authority uses, so problems are caught before an official inspection.","kn":"Know that self-inspections copy the regulatory inspection and happen in addition to it. Traps: a once-a-year schedule, or treating them as a substitute for official inspections.","img":false,"web":true,"note":"Same question as MT-24; similar to PT-01."},{"id":"DT-02","src":"Diagnostic Test","no":"Q2","type":"mc","ch":8,"q":"What should be looked for when conducting a self-inspection?","opts":["How crisis management is handled","How new hire orientation is conducted","How customer complaints are logged","How pest control contracts are negotiated"],"ans":0,"assigned":false,"bookHeading":"Self-Inspections","bookPage":"183–184","tp":"selfinsp","ansText":"A. How crisis management is handled","why":"A self-inspection reviews the operation’s food safety practices, including whether it is ready to handle a crisis; orientation, complaint logs and pest contracts are business tasks, not inspection items.","kn":"
