Tests what a self-inspection covers: food safety readiness, such as crisis management. The distractors are administrative jobs that sound responsible but are not part of a food safety self-inspection.","img":false,"web":true},{"id":"DT-03","src":"Diagnostic Test","no":"Q3","type":"mc","ch":9,"q":"What is needed to operate a food establishment?","opts":["A HACCP program","A permit to operate","A crisis management plan","A variance from the regulatory authority"],"ans":1,"assigned":false,"bookHeading":"Plan Review","bookPage":"192","tp":"design","ansText":"B. A permit to operate","why":"Every food establishment needs a permit to operate from the regulatory authority. HACCP plans and variances are only needed for specific processes.","kn":"Know the one thing every establishment must have: a permit to operate. HACCP plans and variances are required only for special processes, so they are look-alike traps.","img":false,"web":true,"note":"Same question as MT-18."},{"id":"DT-04","src":"Diagnostic Test","no":"Q4","type":"mc","ch":9,"q":"What must be done before starting any new construction or remodeling project?","opts":["A licensed plumber must be hired.","A pest control operator (PCO) must be contacted.","A plan must be submitted to the regulatory authority.","A cleaning company must be hired to deep clean the facility."],"ans":2,"assigned":false,"bookHeading":"Plan Review","bookPage":"192","tp":"design","ansText":"C. A plan must be submitted to the regulatory authority.","why":"Before any new construction or remodeling, a plan must be submitted to the regulatory authority, and approved if required, before work begins.","kn":"Recall the plan-review rule: submit plans to the regulatory authority before building or remodeling. Plumbers, pest control and cleaners may be involved later but are not the required first step.","img":false,"web":true,"note":"Similar to PT-32 and DT-64."},{"id":"DT-05","src":"Diagnostic Test","no":"Q5","type":"mc","ch":8,"q":"Which is critical to building a strong food safety culture?","opts":["Assigning a single point of contact to handle food safety","Relying on written policies instead of ongoing training","Using checklists as the main method of accountability","Modeling desired behaviors expected from employees"],"ans":3,"assigned":false,"bookHeading":"Food Safety Culture","bookPage":"176","tp":"culture","ansText":"D. Modeling desired behaviors expected from employees","why":"A strong food safety culture is built when leaders model the behaviors they expect; written policies, one contact person or checklists alone do not change shared attitudes.","kn":"Tests that food safety culture comes from leadership modeling and ongoing training. Traps rely on paperwork or a single person instead of shared behavior.","img":false,"web":true},{"id":"DT-06","src":"Diagnostic Test","no":"Q6","type":"mc","ch":8,"q":"Which behavior contributes to a strong food safety culture?","opts":["A manager distributes new thermometers to employees prior to an inspection","A food handler washes their hands because they know people can get sick if they don’t","A food handler relies on management to monitor food safety","A team member follows food safety rules to avoid getting written up"],"ans":1,"assigned":false,"bookHeading":"Food Safety Culture","bookPage":"176–177","tp":"culture","ansText":"B. A food handler washes their hands because they know people can get sick if they don’t","why":"In a strong culture, people follow food safety practices because they understand why they matter, not just to pass an inspection or avoid discipline.","kn":"Spot the behavior driven by understanding (“people can get sick”). Traps show compliance only for inspections, fear of write-ups, or leaving food safety to managers.","img":false,"web":true},{"id":"DT-07","src":"Diagnostic Test","no":"Q7","type":"mc","ch":8,"q":"When is a HACCP plan required?","opts":["In most cases, it is not required.","When an establishment primarily serves rare meat","When an establishment smokes food to enhance the flavor","When an operation cools food using the two-stage cooling method"],"ans":0,"assigned":false,"bookHeading":"When a HACCP Plan Is Required","bookPage":"183","tp":"haccp","ansText":"A. In most cases, it is not required.","why":"A HACCP plan is required only for specialized processes (such as smoking food as a preservation method, curing, or reduced-oxygen packaging), so most operations don’t need one.","kn":"Know that HACCP plans are required only for special processes. Trap: smoking food for flavor is not the same as smoking it to preserve it, which does need a plan or variance.","img":false,"web":true},{"id":"DT-08","src":"Diagnostic Test","no":"Q8","type":"mc","ch":8,"q":"Which is a critical control point (CCP)?","opts":["Cooking chicken to 165°F (74°C) for <1 second","Purchasing chicken with a USDA grading","Prepping chicken on a yellow cutting board","Labeling chicken casserole on a buffet with allergen information"],"ans":0,"assigned":false,"bookHeading":"The Seven HACCP Principles","bookPage":"182","tp":"haccp","ansText":"A. Cooking chicken to 165°F (74°C) for <1 second","why":"A CCP is a point where a hazard can be prevented, eliminated or reduced to safe levels; cooking chicken to 165°F (74°C) kills pathogens, so it is a CCP with a critical limit.","kn":"Tests the definition of a critical control point: a step that controls a hazard. Grading, board color and labeling are quality or good-practice steps, not pathogen-control points.","img":false,"web":true},{"id":"DT-09","src":"Diagnostic Test","no":"Q9","type":"mc","ch":7,"q":"A customer returns a carryout container to a restaurant to be refilled with food. It looks clean, but they will not refill it. Is the restaurant correct to refuse?","opts":["Yes, because the container is a single-service container that is not designed to be refilled.","Yes, because the container may not have been appropriately cleaned and sanitized.","No, because the container was made to hold food.","No, because the container can be refilled for personal consumption."],"ans":0,"assigned":false,"bookHeading":"Refilling containers","bookPage":"160","tp":"serve","ansText":"A. Yes, because the container is a single-service container that is not designed to be refilled.","why":"Single-service carryout containers are designed for one use and cannot be refilled, however clean they look.","kn":"Know that single-service containers cannot be refilled for customers. Trap: “may not have been cleaned” sounds reasonable, but the reason is that the container is single-use.","img":false,"web":true,"note":"Same question as MT-42."},{"id":"DT-10","src":"Diagnostic Test","no":"Q10","type":"mc","ch":2,"q":"What can employees do to reduce the risk of intentional contamination?","opts":["Secure all ingredients and supplies","Check the internal temperature of food","Discard food if cross-contact has occurred","Use disinfectants on surfaces instead of sanitizers"],"ans":0,"assigned":false,"bookHeading":"Food Defense","bookPage":"40","tp":"defense","ansText":"A. Secure all ingredients and supplies","why":"Food defense focuses on keeping people from deliberately tampering with food, so securing ingredients, supplies and finished products is the key step.","kn":"Separates intentional contamination (food defense) from food safety tasks. Temping food, cross-contact and disinfectants address accidental hazards, not tampering.","img":false,"web":true,"note":"Same question as MT-26."},{"id":"DT-11","src":"Diagnostic Test","no":"Q11","type":"mc","ch":1,"q":"A manager can ensure employees are following their training by","opts":["monitoring them.","having them complete a written assessment.","asking them if they can do what they were trained to do.","reviewing the most current regulatory inspection report."],"ans":0,"assigned":false,"bookHeading":"Training","bookPage":"14","tp":"mgr","ansText":"A. monitoring them.","why":"Managers confirm training is working by monitoring employees as they work; tests and self-reports don’t show what people actually do on the job.","kn":"Tests that ongoing monitoring is how managers verify training. Traps: written tests, asking employees, or reading old inspection reports measure knowledge or history, not daily behavior.","img":false,"web":true,"note":"Same question as MT-09 (this key supplies the answer MT-09 lacks)."},{"id":"DT-12","src":"Diagnostic Test","no":"Q12","type":"mc","ch":1,"q":"When should employees be trained?","opts":["After they have committed a violation","Not until they actually need the training","After formally assessing their knowledge","When first hired and on an ongoing basis"],"ans":3,"assigned":false,"bookHeading":"Training","bookPage":"14","tp":"mgr","ansText":"D. When first hired and on an ongoing basis","why":"Employees should be trained when they are first hired and on an ongoing basis so their knowledge stays current.","kn":"Know the timing of training: at hire and continuously. Traps delay training until after a violation or until it is needed.","img":false,"web":true},{"id":"DT-13","src":"Diagnostic Test","no":"Q13","type":"mc","ch":3,"q":"When can a food handler who is vomiting return to work?","opts":["When symptom-free for 24 hours","After scheduling an appointment with a physician","When they say they are feeling better","When they do not have any other symptoms"],"ans":0,"assigned":false,"bookHeading":"Restricting or Excluding Staff for Medical Conditions","bookPage":"78","tp":"illness","ansText":"A. When symptom-free for 24 hours","why":"Food handlers excluded for vomiting may return after they have had no symptoms for at least 24 hours (or have a written release from a medical practitioner).","kn":"Recall the return-to-work rule for vomiting or diarrhea: 24 hours symptom-free. Traps: feeling better, booking an appointment, or having no other symptoms.","img":false,"web":true,"note":"Same question as MT-28."},{"id":"DT-14","src":"Diagnostic Test","no":"Q14","type":"mc","ch":3,"q":"A cook is constantly sneezing while preparing food. What should the manager do?","opts":["Exclude the person from the operation","Report the illness to the local regulatory authority","Speak with the person’s medical practitioner","Restrict the person from working with exposed food utensils and equipment"],"ans":3,"assigned":false,"bookHeading":"Restricting or Excluding Staff for Medical Conditions","bookPage":"78","tp":"illness","ansText":"D. Restrict the person from working with exposed food utensils and equipment","why":"Persistent sneezing, coughing or runny nose that causes discharge calls for restricting the food handler from working with exposed food, utensils and equipment, not excluding them.","kn":"Distinguish restrict from exclude: respiratory symptoms like constant sneezing mean restrict. Exclusion and reporting are for conditions such as vomiting, diarrhea, jaundice or a Big Six diagnosis.","img":false,"web":true},{"id":"DT-15","src":"Diagnostic Test","no":"Q15","type":"mc","ch":3,"q":"How should a quick service employee with a sore throat and fever be handled?","opts":["Exclude the person from the operation","Report the person to the local regulatory authority","Speak with the person’s medical practitioner","Restrict the person from working with exposed food utensils and equipment"],"ans":3,"assigned":false,"bookHeading":"Restricting or Excluding Staff for Medical Conditions","bookPage":"78","tp":"illness","ansText":"D. Restrict the person from working with exposed food utensils and equipment","why":"In an operation that does not mainly serve a high-risk population, a sore throat with fever means restricting the food handler; exclusion applies when serving high-risk groups.","kn":"Tests the sore-throat-with-fever rule and how the setting changes it: restrict in a regular or quick-service operation, exclude where high-risk populations are served.","img":false,"web":true,"note":"Similar to MT-01 and PT-03."},{"id":"DT-16","src":"Diagnostic Test","no":"Q16","type":"mc","ch":3,"q":"A food handler is wearing a necklace, watch, earrings, and facial jewelry. Which item(s) must be removed before prepping food?","opts":["The necklace","The watch","The earrings","The facial jewelry"],"ans":1,"assigned":false,"bookHeading":"Work Attire Guidelines","bookPage":"75","tp":"attire","ansText":"B. The watch","why":"Jewelry must be removed from hands and arms before prepping food, so the watch has to come off (a plain band ring is the only exception).","kn":"Recall that the jewelry rule targets hands and arms: rings (except a plain band), bracelets and watches. Necklaces, earrings and facial jewelry are not what the rule names.","img":false,"web":true},{"id":"DT-17","src":"Diagnostic Test","no":"Q17","type":"mc","ch":3,"q":"A food handler washed their hands in the three-compartment sink. They wet them with warm water, scrubbed them with soap for 10 seconds, rinsed them with warm water, and dried them with a single-use towel. What did they do wrong?","opts":["Wet them with warm water","Washed them in a three-compartment sink","Scrubbed them for only 10 seconds","Dried them with a single-use towel"],"ans":1,"assigned":false,"bookHeading":"Where to Wash Hands","bookPage":"64","tp":"handwash","ansText":"B. Washed them in a three-compartment sink","why":"Hands must be washed only in a designated handwashing sink, never in a three-compartment sink used for dishes or food prep.","kn":"Spot the one wrong step: the sink. Warm water, scrubbing 10–15 seconds and a single-use towel are all correct, so the trap is thinking 10 seconds is too short.","img":false,"web":true},{"id":"DT-18","src":"Diagnostic Test","no":"Q18","type":"mc","ch":3,"q":"When must a food handler who is assembling boxed lunches change gloves?","opts":["After one hour","After two hours","After three hours","After four hours"],"ans":3,"assigned":false,"bookHeading":"When to Change Gloves","bookPage":"71","tp":"gloves","ansText":"D. After four hours","why":"Gloves used for a continuous task must be changed at least every four hours.","kn":"Recall the four-hour maximum for single-use gloves on the same task. The shorter times are traps; gloves also change sooner if torn, dirty or the task changes.","img":false,"web":true,"note":"Similar to PT-05."},{"id":"DT-19","src":"Diagnostic Test","no":"Q19","type":"mc","ch":3,"q":"A food handler has an infected wound on the palm of their hand. What must be done for them to be able to work with food?","opts":["The wound must be covered with an impermeable cover and a single-use glove must be worn.","The wound must be covered with an impermeable cover and contact with food must be limited.","Hands must be sanitized and the wound must be bandaged with an impermeable cover.","Ointment must be applied to the wound and it must be bandaged with an impermeable cover."],"ans":0,"assigned":false,"bookHeading":"Hand-Care Guidelines","bookPage":"68","tp":"handwash","ansText":"A. The wound must be covered with an impermeable cover and a single-use glove must be worn.","why":"A wound on the hand must be covered with an impermeable cover such as a bandage or finger cot, and then a single-use glove worn over it.","kn":"Know the two-part rule for hand wounds: impermeable cover plus a single-use glove. Traps stop at one layer, add ointment, or only limit contact with food.","img":false,"web":true,"note":"Similar to MT-17."},{"id":"DT-20","src":"Diagnostic Test","no":"Q20","type":"mc","ch":2,"q":"Where may you find allergens listed on a food label?","opts":["Within the ingredient listing","Within the “Nutrition Facts” panel","Within the “Best By” or Use-By” date section","Within the “Amount per serving” section"],"ans":0,"assigned":false,"bookHeading":"Food Labels","bookPage":"45","tp":"allergen","ansText":"A. Within the ingredient listing","why":"Food allergens are identified on the label within the ingredient list (often with a “Contains” statement), not in the Nutrition Facts panel or date code.","kn":"Tests where to look for allergens on a package: the ingredient listing. The Nutrition Facts panel and serving information don’t list allergens.","img":false,"web":true},{"id":"DT-21","src":"Diagnostic Test","no":"Q21","type":"mc","ch":2,"q":"How should an establishment handle ingredient substitutions from a vendor to prevent an allergic reaction?","opts":["Reject any product substitutions from vendors","Take the item requiring the ingredients off the menu","Trust the substitution and use the ingredients as provided","Identify possible substitutions in advance and evaluate the substitution for acceptability"],"ans":3,"assigned":false,"bookHeading":"How to Avoid Cross-Contact","bookPage":"47","tp":"allergen","ansText":"D. Identify possible substitutions in advance and evaluate the substitution for acceptability","why":"Vendor substitutions can bring in new allergens, so managers should plan for likely substitutions and check each one’s ingredients before accepting it.","kn":"Know that substitutions must be evaluated for allergens in advance. Traps: blindly trusting the vendor, or overreacting by rejecting every substitution or dropping the menu item.","img":false,"web":true},{"id":"DT-22","src":"Diagnostic Test","no":"Q22","type":"mc","ch":2,"q":"Which food item is a common allergen?","opts":["Sesame","Olive oil","Black pepper","Garlic"],"ans":0,"assigned":false,"bookHeading":"Most Common Food Allergens","bookPage":"44","tp":"allergen","ansText":"A. Sesame","why":"Sesame is one of the Big Nine food allergens (milk, eggs, fish, crustacean shellfish, tree nuts, peanuts, wheat, soy and sesame).","kn":"Recall the Big Nine allergens; sesame is the newest addition. Olive oil, pepper and garlic are common ingredients but not major allergens.","img":false,"web":true,"note":"Similar to PT-07."},{"id":"DT-23","src":"Diagnostic Test","no":"Q23","type":"mc","ch":2,"q":"What must be provided in an establishment to prevent allergic reactions?","opts":["An allergen-free area for preparing food","Allergen labeling on all food being prepared","Written notification of major allergens in the food served","Designated handwashing sinks for allergen special order preparation"],"ans":2,"assigned":false,"bookHeading":"Preventing Allergic Reactions: Posting Notification","bookPage":"45","tp":"allergen","ansText":"C. Written notification of major allergens in the food served","why":"Establishments must give customers written notification of the major food allergens in the food they serve (for example, on menus or table tents).","kn":"Know the notification requirement: written information about major allergens. Allergen-free kitchens or special sinks are good practice, not the required item.","img":false,"web":true},{"id":"DT-24","src":"Diagnostic Test","no":"Q24","type":"mc","ch":2,"q":"To prevent cross-contact,","opts":["use only food-grade equipment.","clean and sanitize surfaces utensils and equipment before each use.","store ready-to-eat food and raw food separately.","thaw food in a cooler at 41°F (5°C) or lower."],"ans":1,"assigned":false,"bookHeading":"How to Avoid Cross-Contact","bookPage":"47","tp":"allergen","ansText":"B. clean and sanitize surfaces utensils and equipment before each use.","why":"Cleaning and sanitizing surfaces, utensils and equipment before each use removes allergen residue and prevents cross-contact.","kn":"Separate cross-contact (allergens) from cross-contamination (pathogens). Storing raw and ready-to-eat food apart and thawing correctly prevent pathogen problems, not allergen transfer.","img":false,"web":true},{"id":"DT-25","src":"Diagnostic Test","no":"Q25","type":"mc","ch":2,"q":"What should food handlers do to prevent food allergens from being transferred to food?","opts":["Use separate utensils and equipment for allergen special orders","Cook food to the appropriate minimum internal temperature","Store cold food at 41°F (5°C) or lower","Label chemical containers correctly"],"ans":0,"assigned":false,"bookHeading":"How to Avoid Cross-Contact","bookPage":"47","tp":"allergen","ansText":"A. Use separate utensils and equipment for allergen special orders","why":"Using separate, clean utensils and equipment for allergen special orders keeps allergens from being transferred to the food.","kn":"Tests a direct cross-contact control: separate equipment for allergen orders. Cooking and cold holding control pathogens, and cooking does not destroy allergens.","img":false,"web":true},{"id":"DT-26","src":"Diagnostic Test","no":"Q26","type":"mc","ch":2,"q":"A cook preparing a Caesar salad places hard-boiled egg slices on top before remembering the guest has an egg allergy. Since cross-contact has occurred, what do they need to do?","opts":["Discard the salad","Remove the egg slices and serve the salad","Rinse the lettuce and remake the salad","Tell the guest and let them decide what to do"],"ans":0,"assigned":false,"bookHeading":"What to Do if Cross-Contact has Occurred","bookPage":"47","tp":"allergen","ansText":"A. Discard the salad","why":"Once cross-contact has happened, the food must be thrown out and remade; removing the allergen does not make it safe.","kn":"Know that removing the allergen or rinsing food is not enough after cross-contact: discard and start over. Letting the guest decide is also a trap.","img":false,"web":true},{"id":"DT-27","src":"Diagnostic Test","no":"Q27","type":"mc","ch":5,"q":"A restaurant is bottling their house salad dressing for retail sale. What must be included on the label?","opts":["Storage recommendations for the dressing","Source of major food allergens in the dressing","Nutrition information for the dressing","Preparation instructions for the dressing"],"ans":1,"assigned":false,"bookHeading":"Labeling Food That Is Packaged On-Site for Retail Sale","bookPage":"115","tp":"label","ansText":"B. Source of major food allergens in the dressing","why":"Food packaged on-site for retail sale must list the source of each major food allergen it contains, along with the name, quantity, ingredients and business information.","kn":"Recall the retail label requirements and that allergen sources are mandatory. Storage tips, nutrition facts and prep instructions are optional extras here.","img":false,"web":true,"note":"Same question as MT-03; similar to PT-10."},{"id":"DT-28","src":"Diagnostic Test","no":"Q28","type":"mc","ch":5,"q":"What is the most important factor in choosing an approved food supplier?","opts":["It has a HACCP program or other food safety system.","It has documented manufacturing and packing practices.","Its warehouse is close to the operation, reducing shipping time.","It has been inspected and complies with local, state, and federal laws."],"ans":3,"assigned":false,"bookHeading":"Approved, reputable suppliers","bookPage":"106","tp":"supplier","ansText":"D. It has been inspected and complies with local, state, and federal laws.","why":"An approved supplier has been inspected and meets all applicable local, state and federal laws; that is the requirement, not convenience or extra programs.","kn":"Know what makes a supplier approved: inspection and compliance with all laws. A HACCP program or nearby warehouse is nice, but is not the defining factor.","img":false,"web":true,"note":"Similar to PT-11."},{"id":"DT-29","src":"Diagnostic Test","no":"Q29","type":"mc","ch":5,"q":"A food delivery truck arrives at a foodservice establishment. What is the first step that must be taken?","opts":["The delivery must be inspected.","The delivery truck must be inspected.","All TCS products must be inspected.","All frozen products must be inspected."],"ans":1,"assigned":false,"bookHeading":"Receiving and Inspecting","bookPage":"107","tp":"recvpack","ansText":"B. The delivery truck must be inspected.","why":"Receiving starts by inspecting the delivery truck for signs of contamination or pests before any products are accepted.","kn":"Tests the order of receiving: check the truck first, then the food. Inspecting TCS or frozen products is important but comes after the vehicle check.","img":false,"web":true},{"id":"DT-30","src":"Diagnostic Test","no":"Q30","type":"mc","ch":5,"q":"Which item should be rejected during receiving?","opts":["Milk received at 45°F (7°C)","Cans with small dents in the can body","Live oysters received at an internal temperature of 50°F (10°C)","Single-use cups with dirty packaging"],"ans":3,"assigned":false,"bookHeading":"Packaging","bookPage":"111","note":"The answer key’s chapter list leaves out Q30 (it lists Q39 under both Chapter 5 and Chapter 6); Q30 is a receiving question, so Chapter 5.","tp":"recvpack","ansText":"D. Single-use cups with dirty packaging","why":"Nonfood items such as single-use cups must arrive in packaging that is intact and clean, so dirty packaging is rejected.","kn":"Know the exceptions that are acceptable: milk at 45°F (7°C), shellstock at an internal 50°F (10°C) and cans with small body dents. Dirty packaging is the clear reject.","img":false,"web":true},{"id":"DT-31","src":"Diagnostic Test","no":"Q31","type":"mc","ch":5,"q":"In what top-to-bottom order should raw salmon, chicken, ground beef, and a beef roast be stored in a cooler?","opts":["1. chicken, 2. ground beef, 3. beef roast, 4. salmon","1. ground beef, 2. chicken, 3. salmon, 4. beef roast","1. beef roast, 2. ground beef, 3. chicken, 4. salmon","1. salmon, 2. beef roast, 3. ground beef, 4. chicken"],"ans":3,"assigned":false,"bookHeading":"Storage Order","bookPage":"118","tp":"storage","ansText":"D. 1. salmon, 2. beef roast, 3. ground beef, 4. chicken","why":"Store raw items top to bottom by minimum cooking temperature: seafood, whole cuts of beef and pork, ground meat and ground fish, then poultry on the bottom.","kn":"Recall the storage order by cooking temperature: salmon (145°F) above roast, ground beef (155°F), then chicken (165°F) lowest. Traps put poultry or ground meat too high.","img":false,"web":true,"note":"Similar to PT-14."},{"id":"DT-32","src":"Diagnostic Test","no":"Q32","type":"mc","ch":5,"q":"Food should be stored away from walls and at least _________ off the floor.","opts":["2 inches (5 centimeters)","4 inches (10 centimeters)","5 inches (13 centimeters)","6 inches (15 centimeters)"],"ans":3,"assigned":false,"bookHeading":"Supplies","bookPage":"118","tp":"storage","ansText":"D. 6 inches (15 centimeters)","why":"Food and supplies must be stored away from walls and at least 6 inches (15 centimeters) off the floor.","kn":"Recall the 6-inch (15 cm) storage rule. The smaller distances are traps; note the 6-inch rule also applies to floor-mounted equipment legs.","img":false,"web":true,"note":"Similar to KH-11."},{"id":"DT-33","src":"Diagnostic Test","no":"Q33","type":"mc","ch":3,"q":"When must single-use gloves be changed?","opts":["As soon as they become torn","Every two hours, regardless of the task","When stopping to talk with a coworker","After assembling one tray of sandwiches and before starting another"],"ans":0,"assigned":false,"bookHeading":"When to Change Gloves","bookPage":"71","tp":"gloves","ansText":"A. As soon as they become torn","why":"Single-use gloves must be changed as soon as they become dirty or torn, as well as when changing tasks and after four hours of continuous use.","kn":"Know when gloves must be changed: torn or dirty, between tasks, after handling raw meat, and every four hours. Traps: a two-hour rule, a conversation, or switching between trays of the same task.","img":false,"web":true},{"id":"DT-34","src":"Diagnostic Test","no":"Q34","type":"mc","ch":3,"q":"Which food item may be handled with bare hands?","opts":["Fresh buns for deli sandwiches","Chopped potatoes for soup","Peeled hard-boiled eggs for salads","Pickled watermelon for garnish"],"ans":1,"assigned":false,"bookHeading":"Bare-Hand Contact with Ready-to-Eat Food","bookPage":"71–72","tp":"gloves","ansText":"B. Chopped potatoes for soup","why":"Bare hands may touch ready-to-eat food that is an ingredient in a dish that will be cooked to the required minimum temperature, like potatoes going into soup.","kn":"Tests the exception to the no-bare-hand rule: food that will be cooked. Buns, peeled eggs and garnishes are ready-to-eat and won’t be cooked, so they need gloves or utensils.","img":false,"web":true,"note":"Same question stem as MT-08 (different options)."},{"id":"DT-35","src":"Diagnostic Test","no":"Q35","type":"mc","ch":4,"q":"A cook must check the internal temperature of a chicken breast. Where should they insert the thermometer probe?","opts":["In the thinnest part of the chicken breast","In the thickest part of the chicken breast","On the bottom of the chicken breast","On the top of the chicken breast"],"ans":1,"assigned":false,"bookHeading":"How to Check Temperatures","bookPage":"138","tp":"thermo","ansText":"B. In the thickest part of the chicken breast","why":"Temperatures are taken in the thickest part of the food, where it heats or cools last.","kn":"Know where to probe food: the thickest part. Thinnest, top or bottom readings can show a safe number while the center is still unsafe.","img":false,"web":true,"note":"Same question as MT-35; similar to KH-23."},{"id":"DT-36","src":"Diagnostic Test","no":"Q36","type":"mc","ch":6,"q":"What is the minimum internal cooking temperature for salmon?","opts":["135°F (57°C)","145°F (63°C) for 15 seconds","155°F (68°C) for 17 seconds","165°F (74°C) for <1 second"],"ans":1,"assigned":false,"bookHeading":"Cooking Requirements for Specific Types of Food","bookPage":"139","tp":"cooktemp","ansText":"B. 145°F (63°C) for 15 seconds","why":"Seafood, including salmon, must be cooked to at least 145°F (63°C) for 15 seconds.","kn":"Recall the seafood cooking temperature: 145°F (63°C) for 15 seconds. 155°F is for ground meat and 165°F for poultry and stuffing, which are the look-alike traps.","img":false,"web":true,"note":"Same question as MT-06."},{"id":"DT-37","src":"Diagnostic Test","no":"Q37","type":"mc","ch":6,"q":"Chicken breasts will be partially cooked for later service. What is the maximum amount of time to cook the chicken during initial cooking?","opts":["60 minutes","70 minutes","80 minutes","90 minutes"],"ans":0,"assigned":false,"bookHeading":"Partial Cooking during Preparation","bookPage":"140","tp":"cooktemp","ansText":"A. 60 minutes","why":"With partial cooking, the initial cooking step must not last longer than 60 minutes; the food is then cooled and later cooked to its full minimum temperature.","kn":"Recall the 60-minute limit for the first stage of partial cooking. The longer options are traps that keep food in the danger zone too long.","img":false,"web":true,"note":"Similar to PT-20."},{"id":"DT-38","src":"Diagnostic Test","no":"Q38","type":"mc","ch":6,"q":"Where should a small stockpot of meat sauce be placed to cool?","opts":["A cooler","A freezer","A sink of ice water","A prep table"],"ans":2,"assigned":false,"bookHeading":"Methods for Cooling Food","bookPage":"145","tp":"cool","ansText":"C. A sink of ice water","why":"An ice-water bath (with stirring) cools a small stockpot quickly through the temperature danger zone. A cooler or freezer alone cools too slowly and warms other food.","kn":"Know the approved ways to cool food: ice-water bath, ice paddle, blast chiller. Trap: putting hot food straight in a cooler or freezer is not an acceptable cooling method.","img":false,"web":true,"note":"Similar to PT-22."},{"id":"DT-39","src":"Diagnostic Test","no":"Q39","type":"mc","ch":6,"q":"Food must be cooled from 135°F to 70°F (57°C to 21°C) within ___ hours and then from 70°F to 41°F (21°C to 5°C) or lower in the next ___ hours.","opts":["two, four","four, two","three, five","five, three"],"ans":0,"assigned":false,"bookHeading":"Temperature Requirements for Cooling Food","bookPage":"144","tp":"cool","ansText":"A. two, four","why":"Two-stage cooling: 135°F to 70°F (57°C to 21°C) within two hours, then 70°F to 41°F (21°C to 5°C) or lower in the next four hours.","kn":"Recall the two-stage cooling times, 2 then 4 hours (6 total). Trap: reversing them to 4 then 2.","img":false,"web":true,"note":"Similar to KH-27."},{"id":"DT-40","src":"Diagnostic Test","no":"Q40","type":"mc","ch":6,"q":"Which TCS food has been cooled correctly?","opts":["Clam chowder cooled from 135°F to 70°F (57°C to 21°C) in four hours and then from 70°F to 41°F (21°C to 5°C) in two hours","Beef chili cooled from 135°F to 70°F (57°C to 21°C) in two hours and then from 70°F to 41°F (21°C to 5°C) in six hours","Pulled pork cooled from 135°F to 70°F (57°C to 21°C) in three hours and then from 70°F to 41°F (21°C to 5°C) in two hours","Shrimp fried rice cooled from 135°F to 70°F (57°C to 21°C) in one hour and then from 70°F to 41°F (21°C to 5°C) in four hours"],"ans":3,"assigned":false,"bookHeading":"Temperature Requirements for Cooling Food","bookPage":"144–145","tp":"cool","ansText":"D. Shrimp fried rice cooled from 135°F to 70°F (57°C to 21°C) in one hour and then from 70°F to 41°F (21°C to 5°C) in four hours","why":"The first stage (135°F to 70°F) must take no more than two hours and the whole process no more than six; one hour plus four hours meets both limits.","kn":"Apply the two-stage cooling limits to examples. Traps either miss the two-hour first-stage limit or the six-hour total, even when the total looks reasonable.","img":false,"web":true,"note":"Similar to MT-48 and PT-21."},{"id":"DT-41","src":"Diagnostic Test","no":"Q41","type":"mc","ch":6,"q":"Meatballs are being reheated for hot holding on a buffet. What temperature must the meatballs be reheated too?","opts":["135°F (57°C) for 15 seconds within two hours","145°F (63°C) for 15 seconds within two hours","155°F (68°C) for 15 seconds within two hours","165°F (74°C) for 15 seconds within two hours"],"ans":3,"assigned":false,"bookHeading":"Reheating Food","bookPage":"146","tp":"cool","ansText":"D. 165°F (74°C) for 15 seconds within two hours","why":"TCS food reheated for hot holding must reach 165°F (74°C) for 15 seconds within two hours.","kn":"Recall the reheating-for-hot-holding rule: 165°F (74°C) for 15 seconds within 2 hours. Lower temperatures are holding or cooking temperatures for other foods.","img":false,"web":true,"note":"Similar to PT-23 and KH-21."},{"id":"DT-42","src":"Diagnostic Test","no":"Q42","type":"mc","ch":6,"q":"To what temperature must you reheat chili for immediate service?","opts":["Any temperature","135°F (57°C)","145°F (63°C)","165°F (68°C)"],"ans":0,"assigned":false,"bookHeading":"Reheating Food","bookPage":"146","tp":"cool","ansText":"A. Any temperature","why":"Food reheated for immediate service, such as a bowl of chili, can be reheated to any temperature as long as it was cooked and cooled correctly.","kn":"Distinguish reheating for immediate service (any temperature) from reheating for hot holding (165°F). The specific temperatures are traps.","img":false,"web":true,"note":"Option D’s Celsius value is a typo in the source: 165°F is 74°C."},{"id":"DT-43","src":"Diagnostic Test","no":"Q43","type":"mc","ch":6,"q":"What temperature must commercially processed and packaged ready-to-eat food be reheated to?","opts":["Any temperature","135°F (57°C)","145°F (63°C)","155°F (68°C)"],"ans":1,"assigned":false,"bookHeading":"Reheating Food","bookPage":"146","tp":"cool","ansText":"B. 135°F (57°C)","why":"Commercially processed and packaged ready-to-eat food reheated for hot holding must reach at least 135°F (57°C).","kn":"Know that commercially processed RTE food has a lower reheat target, 135°F (57°C), than food cooked and cooled on-site (165°F). The other numbers are traps.","img":false,"web":true},{"id":"DT-44","src":"Diagnostic Test","no":"Q44","type":"mc","ch":5,"q":"What should be done with ready-to-eat TCS food that will be prepped on-site and held for longer than 24 hours?","opts":["Date-mark it.","Sell it.","Throw it away.","Serve it within the next hour."],"ans":0,"assigned":false,"bookHeading":"Date-Marking","bookPage":"115","tp":"label","ansText":"A. Date-mark it.","why":"Ready-to-eat TCS food prepped on-site and held longer than 24 hours must be date-marked with the date it must be sold, eaten or thrown out.","kn":"Recall the 24-hour date-marking trigger. Throwing it out or rushing it to service are traps; the food just needs a date mark.","img":false,"web":true,"note":"Similar to KH-12 and MT-05."},{"id":"DT-45","src":"Diagnostic Test","no":"Q45","type":"mc","ch":5,"q":"When must you discard tuna salad that was prepped on July 19?","opts":["July 21st","July 23rd","July 25th","July 27th"],"ans":2,"assigned":false,"bookHeading":"Date-Marking","bookPage":"115","tp":"label","ansText":"C. July 25th","why":"Ready-to-eat TCS food held at 41°F (5°C) or lower can be kept for up to seven days, counting the prep day as day 1, so food prepped July 19 is discarded July 25.","kn":"Calculate a seven-day discard date with the prep day as day 1. The traps come from counting days wrongly (July 26 or 27) or using a shorter limit.","img":false,"web":true,"note":"Similar to PT-13."},{"id":"DT-46","src":"Diagnostic Test","no":"Q46","type":"mc","ch":6,"q":"Which method is a safe way to thaw frozen shrimp?","opts":["As part of the cooking process","Under running water at 125°F (52°C) or higher","Submerged in a sink of standing water at 70°F (21°C)","On a prep table at room temperature"],"ans":0,"assigned":false,"bookHeading":"Methods and Guidelines for Thawing TCS Food","bookPage":"132","tp":"thaw","ansText":"A. As part of the cooking process","why":"Thawing as part of the cooking process is one of the four approved methods, along with in a cooler, under running water at 70°F (21°C) or lower, and in a microwave.","kn":"Know the four safe thawing methods. Traps: running water that is too hot, standing (not running) water, and thawing on a counter at room temperature.","img":false,"web":true},{"id":"DT-47","src":"Diagnostic Test","no":"Q47","type":"mc","ch":6,"q":"A package of vacuum-packed frozen tuna states that the fish should remain frozen until used. When should the tuna be removed from the packaging?","opts":["Before it’s stored in the freezer","Before it’s thawed in the refrigerator","After it’s received","After it’s been date-marked"],"ans":1,"assigned":false,"bookHeading":"Thawing ROP Fish","bookPage":"132","tp":"thaw","ansText":"B. Before it’s thawed in the refrigerator","why":"Frozen reduced-oxygen-packaged fish labeled “keep frozen until used” must be removed from its packaging before it is thawed in the cooler, to prevent botulism.","kn":"Tests the ROP fish rule: take it out of the vacuum package before thawing. Removing it at receiving or before freezing are traps.","img":false,"web":true},{"id":"DT-48","src":"Diagnostic Test","no":"Q48","type":"mc","ch":9,"q":"A manager is purchasing equipment for the operation. What mark should the manager look for to ensure the equipment is safe to use with food?","opts":["FDA mark, USDA mark, or OSHA mark","NSF mark, UL EPH classified mark, or ETL sanitation mark","Energy Star mark, AHRI mark, or RU mark","FCC mark, CE mark, or USP mark"],"ans":1,"assigned":false,"bookHeading":"Equipment Selection","bookPage":"192–193","tp":"design","ansText":"B. NSF mark, UL EPH classified mark, or ETL sanitation mark","why":"Equipment that is safe for food contact carries a sanitation mark from an ANAB-accredited program, such as NSF, UL EPH or ETL Sanitation.","kn":"Recall the three sanitation certification marks: NSF, UL EPH and ETL Sanitation. Trap: agency names like FDA, USDA and OSHA sound official but don’t certify equipment.","img":false,"web":true},{"id":"DT-49","src":"Diagnostic Test","no":"Q49","type":"mc","ch":7,"q":"What is the minimum temperature that must be maintained when holding chicken soup for service?","opts":["135°F (57°C)","145°F (63°C)","155°F (68°C)","165°F (74°C)"],"ans":0,"assigned":false,"bookHeading":"Guidelines for Holding Food","bookPage":"156","tp":"hold","ansText":"A. 135°F (57°C)","why":"Hot TCS food must be held at 135°F (57°C) or higher.","kn":"Recall the hot-holding minimum of 135°F (57°C). Higher numbers are cooking or reheating temperatures, not the holding requirement.","img":false,"web":true},{"id":"DT-50","src":"Diagnostic Test","no":"Q50","type":"mc","ch":7,"q":"A food handler has been holding chicken salad for sandwiches in a cold well for four hours. When they check the salad’s temperature, it is 50°F (10°C). What do they need to do?","opts":["Sell the remaining chicken salad immediately","Sell the remaining chicken salad within two hours","Cool the chicken salad to 41°F (5°C)","Discard the chicken salad"],"ans":3,"assigned":false,"bookHeading":"Guidelines for Holding Food","bookPage":"156","tp":"hold","ansText":"D. Discard the chicken salad","why":"Cold TCS food must stay at 41°F (5°C) or lower; if it is found above 41°F and you can’t tell how long it has been out of temperature, or it’s been four hours, it must be thrown out.","kn":"Apply the holding rule: food found above 41°F after four hours must be discarded. Cooling it back down or selling it fast are traps.","img":false,"web":true},{"id":"DT-51","src":"Diagnostic Test","no":"Q51","type":"mc","ch":6,"q":"When do menu items containing TCS food need a customer advisory?","opts":["When the items are raw or undercooked","When the items contain a potential allergen","When the operation provides only counter service","When the operation primarily serves a high-risk population"],"ans":0,"assigned":false,"bookHeading":"Consumer Advisories","bookPage":"141","tp":"advisory","ansText":"A. When the items are raw or undercooked","why":"A consumer advisory (disclosure plus reminder) is required for menu items with TCS food served raw or undercooked, such as rare burgers or raw oysters.","kn":"Know what triggers a consumer advisory: raw or undercooked animal food. Allergens need allergen notification instead, a different requirement that is the main trap.","img":false,"web":true,"note":"Similar to KH-26."},{"id":"DT-52","src":"Diagnostic Test","no":"Q52","type":"mc","ch":7,"q":"Which item may be re-served to another customer?","opts":["A partially used cup of salsa","Unopened condiment packets","Uneaten bread from a breadbasket","An uneaten pickle used as a plate garnish"],"ans":1,"assigned":false,"bookHeading":"Re-Serving Food","bookPage":"163","tp":"serve","ansText":"B. Unopened condiment packets","why":"Only unopened, prepackaged food in good condition, such as condiment packets, may be re-served to another customer.","kn":"Recall the re-serving rule: unopened, prepackaged items only. Used salsa cups, bread from a basket and plate garnishes have been exposed and cannot be re-served.","img":false,"web":true,"note":"Similar to PT-27."},{"id":"DT-53","src":"Diagnostic Test","no":"Q53","type":"mc","ch":7,"q":"What should the label for soup on a buffet include?","opts":["Name of the food","Prep date","Soup’s ingredients","Use-by date"],"ans":0,"assigned":false,"bookHeading":"Self-Service Areas","bookPage":"164","tp":"selfsvc","ansText":"A. Name of the food","why":"Food on a self-service buffet must be labeled with its name so customers know what it is.","kn":"Know the buffet labeling requirement: the food’s name. Prep dates and use-by dates are for storage labels in the kitchen, not self-service displays.","img":false,"web":true},{"id":"DT-54","src":"Diagnostic Test","no":"Q54","type":"mc","ch":7,"q":"Which utensil has been stored correctly?","opts":["A pair of tongs stored flat on the top of a Caesar salad","A serving spoon stored in meatballs with the handle above the container rim","A pair of tongs stored in the center of several holding wells for serving multiple foods","Ice scoop laying on ice in an ice machine"],"ans":1,"assigned":false,"bookHeading":"Clean and sanitized utensils","bookPage":"160","tp":"serve","ansText":"B. A serving spoon stored in meatballs with the handle above the container rim","why":"A serving utensil may be stored in the food with its handle extended above the rim of the container.","kn":"Tests safe utensil storage: in the food, handle out. Traps lay tongs flat on food, share one utensil between foods, or leave an ice scoop on the ice.","img":false,"web":true},{"id":"DT-55","src":"Diagnostic Test","no":"Q55","type":"mc","ch":10,"q":"Utensils that are used continuously must be cleaned and sanitized at least once every ___ hours.","opts":["two","three","four","six"],"ans":2,"assigned":false,"bookHeading":"When to Clean and Sanitize","bookPage":"214","tp":"howclean","ansText":"C. four","why":"Items in constant use must be cleaned and sanitized at least every four hours.","kn":"Recall the four-hour cleaning interval for items in constant use. The shorter or longer intervals are traps.","img":false,"web":true,"note":"Same question as MT-19."},{"id":"DT-56","src":"Diagnostic Test","no":"Q56","type":"mc","ch":7,"q":"Storing raw meat separately from ready-to-eat food during transport for off-site service helps prevent","opts":["cross-contamination.","time-temperature abuse.","allergic reactions.","physical contamination."],"ans":0,"assigned":false,"bookHeading":"Off-Site Service","bookPage":"165","tp":"selfsvc","ansText":"A. cross-contamination.","why":"Keeping raw meat separate from ready-to-eat food during transport prevents pathogens from the raw meat spreading to other food, which is cross-contamination.","kn":"Distinguish cross-contamination (pathogens between foods) from time-temperature abuse and allergen cross-contact. Separation in transport targets raw-to-RTE transfer.","img":false,"web":true},{"id":"DT-57","src":"Diagnostic Test","no":"Q57","type":"mc","ch":10,"q":"A slicer is being used continuously to slice deli meat. How often must it be cleaned and sanitized?","opts":["Every hour","Every two hours","Every three hours","Every four hours"],"ans":3,"assigned":false,"bookHeading":"When to Clean and Sanitize","bookPage":"214","tp":"howclean","ansText":"D. Every four hours","why":"Equipment in constant use, like a deli slicer, must be cleaned and sanitized at least every four hours.","kn":"Apply the four-hour rule to equipment in continuous use. Traps use one, two or three hours.","img":false,"web":true,"note":"Similar to DT-55."},{"id":"DT-58","src":"Diagnostic Test","no":"Q58","type":"mc","ch":10,"q":"What is the correct way to clean and sanitize a prep table?","opts":["Remove food from surface, rinse, clean, sanitize, air-dry","Remove food from surface, clean, rinse, sanitize, air-dry","Sanitize, remove food from surface, clean, rinse, air-dry","Air-dry, remove food from surface, rinse, sanitize, clean"],"ans":1,"assigned":false,"bookHeading":"Cleaning and Sanitizing Surfaces","bookPage":"215","tp":"howclean","ansText":"B. Remove food from surface, clean, rinse, sanitize, air-dry","why":"Surfaces are cleaned and sanitized in this order: remove food, wash, rinse, sanitize, then air-dry.","kn":"Know the five steps in order. Traps rinse before washing, or sanitize first; sanitizing only works on a clean, rinsed surface.","img":false,"web":true,"note":"Similar to PT-29."},{"id":"DT-59","src":"Diagnostic Test","no":"Q59","type":"mc","ch":10,"q":"What is the first step for cleaning and sanitizing items in a three-compartment sink?","opts":["Air-dry items.","Wash items in the detergent solution","Immerse items in the sanitizer solution","Scrape or remove food from the surface of items."],"ans":3,"assigned":false,"bookHeading":"Cleaning and Sanitizing in a Three-Compartment Sink","bookPage":"221","tp":"dish","ansText":"D. Scrape or remove food from the surface of items.","why":"In a three-compartment sink, items are first scraped (or rinsed or soaked) to remove food, then washed, rinsed, sanitized and air-dried.","kn":"Recall the first step of manual dishwashing: scrape or remove food. Washing, sanitizing and air-drying are later steps used as traps.","img":false,"web":true,"note":"Similar to MT-02 (which asks about setting up the sink)."},{"id":"DT-60","src":"Diagnostic Test","no":"Q60","type":"mc","ch":10,"q":"What’s the difference between a disinfectant and a sanitizer?","opts":["Sanitizers are stronger than disinfectants.","Sanitizers are regulated by the EPA while disinfectants are not.","Disinfectants are weaker than sanitizers and are used for everyday cleaning.","Sanitizers reduce pathogens while disinfectants inactivate or eliminate them."],"ans":3,"assigned":false,"bookHeading":"Disinfectants","bookPage":"216","tp":"agents","ansText":"D. Sanitizers reduce pathogens while disinfectants inactivate or eliminate them.","why":"Sanitizers reduce pathogens on a surface to safe levels, while disinfectants are designed to inactivate or eliminate pathogens.","kn":"Distinguish sanitizer (reduce to safe levels) from disinfectant (inactivate or eliminate). Traps reverse their strength or wrongly say only one is regulated.","img":false,"web":true,"note":"Similar to PT-30."},{"id":"DT-61","src":"Diagnostic Test","no":"Q61","type":"mc","ch":10,"q":"A manager just finished creating a master cleaning schedule. What’s the next step?","opts":["Train staff to follow the program","Determine who should do each task","Time staff on how long they take to clean","Determine what should be cleaned"],"ans":0,"assigned":false,"bookHeading":"Developing a Cleaning Program","bookPage":"227","tp":"program","ansText":"A. Train staff to follow the program","why":"After the master cleaning schedule is created, staff must be trained to follow it; then the program is monitored.","kn":"Know the order of building a cleaning program: create the schedule, train staff, then monitor. Deciding what to clean and who does it are already part of the schedule.","img":false,"web":true,"note":"Similar to MT-44."},{"id":"DT-62","src":"Diagnostic Test","no":"Q62","type":"mc","ch":10,"q":"What information must a master cleaning schedule contain?","opts":["What should be cleaned and when","What should be cleaned, when, and by whom","What should be cleaned, when, by whom, and how","What should be cleaned, when, by whom, how, and why"],"ans":2,"assigned":false,"bookHeading":"Creating a Master Cleaning Schedule","bookPage":"227","tp":"program","ansText":"C. What should be cleaned, when, by whom, and how","why":"A master cleaning schedule lists what should be cleaned, when, by whom and how.","kn":"Recall the four parts of a master cleaning schedule: what, when, who and how. “Why” is the extra item in the trap.","img":false,"web":true},{"id":"DT-63","src":"Diagnostic Test","no":"Q63","type":"mc","ch":10,"q":"An employee is pouring a cleaner from its original container into a spray bottle. What must the food handler write on the label of the spray bottle?","opts":["The common name of the chemical","The expiration date of the chemical","The date the chemical was transferred","Their initials"],"ans":0,"assigned":false,"bookHeading":"Using Foodservice Chemicals","bookPage":"226","tp":"program","ansText":"A. The common name of the chemical","why":"When a chemical is moved into a working container such as a spray bottle, the bottle must be labeled with the common name of the chemical.","kn":"Know the working-container label rule: the chemical’s common name. Dates and initials sound useful but are not required.","img":false,"web":true,"note":"Similar to MT-11."},{"id":"DT-64","src":"Diagnostic Test","no":"Q64","type":"mc","ch":9,"q":"The owner of a small Italian restaurant plans on expanding the size of their kitchen. What must be submitted to the regulatory authority before starting construction?","opts":["Proof of insurance","The plan for the project","A zoning variance request","An environmental impact statement"],"ans":1,"assigned":false,"bookHeading":"Plan Review","bookPage":"192","tp":"design","ansText":"B. The plan for the project","why":"Before construction or remodeling starts, a plan for the project must be submitted to the regulatory authority.","kn":"Apply the plan-review rule to an expansion. Insurance, zoning and environmental paperwork may come up but are not the food-safety requirement.","img":false,"web":true,"note":"Similar to DT-04 and PT-32."},{"id":"DT-65","src":"Diagnostic Test","no":"Q65","type":"mc","ch":8,"q":"What is the purpose of a food safety management system?","opts":["To keep all areas of the facility clean and pest-free","To identify, tag, and repair faulty equipment within the facility","To prevent foodborne illness by controlling risks and hazards","To use the correct methods for purchasing and receiving food"],"ans":2,"assigned":false,"bookHeading":"Food Safety Management Systems","bookPage":"177","tp":"culture","ansText":"C. To prevent foodborne illness by controlling risks and hazards","why":"A food safety management system is a group of practices and procedures meant to prevent foodborne illness by actively controlling risks and hazards throughout the flow of food.","kn":"Recall the purpose of a food safety management system: control risks and hazards to prevent foodborne illness. Each trap names only one narrow program.","img":false,"web":true},{"id":"DT-66","src":"Diagnostic Test","no":"Q66","type":"mc","ch":9,"q":"Which is an approved source for potable water?","opts":["Untested private well","Water transport vehicle","Water in a cistern","Water from a rainwater harvesting system"],"ans":1,"assigned":false,"bookHeading":"Water and Plumbing","bookPage":"196","tp":"plumbing","ansText":"B. Water transport vehicle","why":"Approved potable water sources include public water mains, regularly tested private wells, bottled water, closed portable containers and water transport vehicles.","kn":"Know the approved water sources. Traps: an untested well, a cistern or rainwater harvesting, which are not approved potable sources on their own.","img":false,"web":true},{"id":"DT-67","src":"Diagnostic Test","no":"Q67","type":"mc","ch":9,"q":"A food handler drops the end of a hose into a mop bucket and turns on water to fill it. What has the food handler done wrong?","opts":["Created a cross-connection","Created an air gap","Prevented backflow","Prevented backsiphonage"],"ans":0,"assigned":false,"bookHeading":"Water and Plumbing","bookPage":"196","tp":"plumbing","ansText":"A. Created a cross-connection","why":"A hose dropped into a mop bucket creates a cross-connection, a physical link between safe water and dirty water that can lead to backflow.","kn":"Name the hazard: a cross-connection. An air gap is the safe fix, and backflow or backsiphonage is what the cross-connection can cause, so those are traps.","img":false,"web":true,"note":"Similar to PT-34."},{"id":"DT-68","src":"Diagnostic Test","no":"Q68","type":"mc","ch":9,"q":"At what minimum temperature must running water be supplied to a handwashing station?","opts":["70°F (21°C)","75°F (24°C)","80°F (27°C)","85°F (29°C)"],"ans":3,"assigned":false,"bookHeading":"Requirements at a Handwashing Station","bookPage":"195","tp":"hwstation","ansText":"D. 85°F (29°C)","why":"Handwashing stations must supply running water at least 85°F (29°C).","kn":"Recall the 85°F (29°C) minimum for handwashing water. The lower temperatures are traps.","img":false,"web":true},{"id":"DT-69","src":"Diagnostic Test","no":"Q69","type":"mc","ch":9,"q":"Where must wastewater be disposed of?","opts":["A storm drain","A retention pond","A gravel pit in a dry well","An approved sewage system"],"ans":3,"assigned":false,"bookHeading":"Water and Plumbing","bookPage":"197","tp":"utilities","ansText":"D. An approved sewage system","why":"Wastewater must go into an approved sewage system, such as a service sink or floor drain connected to sewage, never a storm drain.","kn":"Know where wastewater goes: an approved sewage system. Storm drains, ponds and gravel pits are the traps.","img":false,"web":true},{"id":"DT-70","src":"Diagnostic Test","no":"Q70","type":"mc","ch":9,"q":"Which locations in an establishment typically require the brightest lighting?","opts":["Prep areas","Dry storage rooms","Self-service areas","Walk-in coolers"],"ans":0,"assigned":false,"bookHeading":"Lighting","bookPage":"199","tp":"utilities","ansText":"A. Prep areas","why":"Prep areas need the brightest lighting so food handlers can see clearly while working; storage and service areas need less.","kn":"Know that lighting intensity varies by area and prep areas are brightest. Storage rooms and coolers need less light.","img":false,"web":true},{"id":"DT-71","src":"Diagnostic Test","no":"Q71","type":"mc","ch":9,"q":"What is one way to keep an operation pest-free?","opts":["Deny pests access to the operation.","Keep outdoor garbage containers open.","Clean up food spills at the end of each shift.","Store food and supplies one inch off the floor in storage."],"ans":0,"assigned":false,"bookHeading":"Pest Prevention","bookPage":"202","tp":"pest","ansText":"A. Deny pests access to the operation.","why":"The best pest control is denying pests access to the operation, along with denying them food, water and shelter.","kn":"Recall the core pest-prevention approach: deny access. Open garbage, end-of-shift cleanup and 1-inch storage are mistakes (food should be 6 inches off the floor).","img":false,"web":true},{"id":"DT-72","src":"Diagnostic Test","no":"Q72","type":"mc","ch":9,"q":"Which is a good reason to carefully clean an establishment?","opts":["It destroys insect eggs.","It removes pests from the establishment.","It eliminates the need to hire a pest control operator (PCO).","It eliminates the need for pest inspections."],"ans":0,"assigned":false,"bookHeading":"Pest Prevention","bookPage":"202","tp":"pest","ansText":"A. It destroys insect eggs.","why":"Careful cleaning removes the food and shelter pests need and destroys insect eggs.","kn":"Know what cleaning does for pest control. Traps claim cleaning removes existing pests or replaces the PCO or inspections, which it does not.","img":false,"web":true},{"id":"DT-73","src":"Diagnostic Test","no":"Q73","type":"mc","ch":9,"q":"When should you repair or replace equipment in the operation?","opts":["When it’s worn","When the warranty expires","When it’s scheduled for calibration","When the equipment is not energy-efficient"],"ans":0,"assigned":false,"bookHeading":"Installing and Maintaining Equipment","bookPage":"193","tp":"design","ansText":"A. When it’s worn","why":"Equipment should be repaired or replaced when it is worn and no longer meets food safety requirements.","kn":"Tests the equipment maintenance rule: repair or replace worn equipment. Warranty dates, calibration schedules and energy efficiency are not food safety triggers.","img":false,"web":true},{"id":"DT-74","src":"Diagnostic Test","no":"Q74","type":"mc","ch":9,"q":"Outdoor garbage containers should be","opts":["sanitized frequently.","kept covered at all times.","kept away from customer parking areas.","lined with plastic or wet-strength paper."],"ans":1,"assigned":false,"bookHeading":"Garbage","bookPage":"200","tp":"utilities","ansText":"B. kept covered at all times.","why":"Outdoor garbage containers must have tight-fitting lids and be kept covered to keep pests out.","kn":"Recall outdoor garbage rules: covered with tight-fitting lids on a smooth, durable surface. Lining and placement are traps; indoor containers are the ones lined.","img":false,"web":true,"note":"Similar to MT-33."},{"id":"DT-75","src":"Diagnostic Test","no":"Q75","type":"mc","ch":3,"q":"A manager requires employees to store personal items in a designated area. What is the primary reason for doing this?","opts":["To prevent theft of employee belongings","To reduce clutter in the kitchen","To avoid contamination of food and food-contact surfaces","To comply with fire safety regulations"],"ans":2,"assigned":false,"bookHeading":"Work Attire Guidelines","bookPage":"75","tp":"attire","ansText":"C. To avoid contamination of food and food-contact surfaces","why":"Personal items are stored in designated areas so they don’t contaminate food or food-contact surfaces.","kn":"Know the food safety reason for storing personal items away from food. Theft, clutter and fire safety are real concerns but not the primary reason in ServSafe.","img":false,"web":true},{"id":"DT-76","src":"Diagnostic Test","no":"Q76","type":"mc","ch":9,"q":"What should a foodservice operation do when accommodating guests with service animals?","opts":["Allow service animals only if the guest provides veterinary records","Permit dogs in all indoor and outdoor areas without restriction","Deny entry to all animals to avoid potential health code violations","Check with the local regulatory authority for specific requirements"],"ans":3,"assigned":false,"bookHeading":"Animals on the Premises","bookPage":"202","tp":"pest","ansText":"D. Check with the local regulatory authority for specific requirements","why":"Animal rules, including for service animals, vary by jurisdiction, so the operation should check with the local regulatory authority for its requirements.","kn":"Tests that service-animal requirements come from the local regulatory authority. Traps either ban all animals, allow them everywhere, or demand vet records.","img":false,"web":true,"note":"Similar to PT-37."},{"id":"DT-77","src":"Diagnostic Test","no":"Q77","type":"mc","ch":9,"q":"Which situation is an imminent health hazard?","opts":["A backup from a floor drain that has come in contact with food","A storm that has left the facility without power for over an hour","A ventilation system that has left grease buildup on walls and ceilings","A dishwasher breakdown requiring the use of a three-compartment sink to clean and sanitize items"],"ans":0,"assigned":false,"bookHeading":"Emergencies That Affect the Facility","bookPage":"200","tp":"emerg","ansText":"A. A backup from a floor drain that has come in contact with food","why":"A sewage backup that has contacted food is an imminent health hazard because it is a significant threat that requires immediate action; the other events are problems but not hazards of the same level.","kn":"Recognize an imminent health hazard: sewage backup touching food. A short power loss, grease buildup or a dishwasher breakdown can be managed without stopping service.","img":false,"web":true,"note":"Similar to PT-35."},{"id":"DT-78","src":"Diagnostic Test","no":"Q78","type":"mc","ch":9,"q":"Sewage backs up in a food storage area and there is a significant risk of contamination to food. What should be done?","opts":["Execute a HACCP plan.","Reduce the hours of operation.","Stop service and notify the regulatory authority.","Continue service but notify the regulatory authority."],"ans":2,"assigned":false,"bookHeading":"Emergencies That Affect the Facility","bookPage":"200","tp":"emerg","ansText":"C. Stop service and notify the regulatory authority.","why":"When an imminent health hazard such as a sewage backup threatens food, service must stop and the regulatory authority must be notified.","kn":"Know the response to an imminent health hazard: stop service and notify the regulatory authority. Continuing service or just cutting hours are traps.","img":false,"web":true,"note":"Similar to PT-39."},{"id":"DT-79","src":"Diagnostic Test","no":"Q79","type":"mc","ch":9,"q":"A foodservice establishment experiences a power outage and closes to protect the public. When can the establishment reopen?","opts":["Once they have approval from the regulatory authority","Once power is restored and refrigeration units are running","After discarding all TCS food and sanitizing food-contact surfaces","When the manager determines that food safety procedures have been followed"],"ans":0,"assigned":false,"bookHeading":"Emergencies That Affect the Facility","bookPage":"201","tp":"emerg","ansText":"A. Once they have approval from the regulatory authority","why":"After closing for an imminent health hazard, an establishment can reopen only with approval from the regulatory authority.","kn":"Tests who decides on reopening: the regulatory authority. Restored power, discarding food or the manager’s judgment are needed steps but not permission to reopen.","img":false,"web":true},{"id":"DT-80","src":"Diagnostic Test","no":"Q80","type":"mc","ch":5,"q":"A manager is notified of a recall on a specific food Item. What must the manager do with the recalled item?","opts":["Combine the item with non-recalled items during preparation","Record the names of customers who purchase the item","Store the recalled item separately from other food","Sell the recalled item within 24 hours"],"ans":2,"assigned":false,"bookHeading":"Recalls","bookPage":"109","tp":"supplier","ansText":"C. Store the recalled item separately from other food","why":"Recalled food must be removed from inventory, stored separately from other food and labeled so it isn’t used, until the vendor’s instructions are followed.","kn":"Know the recall procedure: separate and label the item. Mixing it into other food or selling it quickly are the traps.","img":false,"web":true,"note":"Same question as KH-09; similar to PT-40."},{"id":"MT-01","src":"Mock ServSafe Test","no":"Q1","type":"mc","q":"What should a manager of a quick-service operation do if a food handler reports having a sore throat and a fever?","opts":["Restrict the food handler from working with food.","Speak with the food handler’s medical practitioner.","Report the illness to the local regulatory authority.","Exclude the food handler from the operation."],"ans":0,"assigned":false,"ch":3,"tp":"illness","why":"In a regular operation such as quick service, a food handler with a sore throat and fever is restricted from working with food. Exclusion applies only when serving a high-risk population.","kn":"Applying restrict vs. exclude to sore throat with fever. Exclusion is the trap; it applies only in operations that serve high-risk populations.","note":"Same question as DT-15.","ansText":"A. Restrict the food handler from working with food.","img":false,"web":true},{"id":"MT-02","src":"Mock ServSafe Test","no":"Q2","type":"mc","q":"When preparing to wash dishes in a three-compartment sink, what is the first task?","opts":["Clean and sanitize the sinks and drain boards.","Fill the first sink with detergent and water.","Remove leftover food from the dishes.","Make sure there is a working clock with a second hand."],"ans":0,"assigned":false,"ch":10,"tp":"dish","why":"Before filling a three-compartment sink, clean and sanitize each sink and drain board.","kn":"Recalling the first step in setting up a three-compartment sink. Filling the sinks, scraping the dishes and providing the clock all come after.","ansText":"A. Clean and sanitize the sinks and drain boards.","img":false,"web":true},{"id":"MT-03","src":"Mock ServSafe Test","no":"Q3","type":"mc","q":"A restaurant is bottling their house salad dressing for retail sale. What must be included on the label?","opts":["Source of major food allergens in the dressing","Preparation instructions for the dressing","Storage recommendations for the dressing","Nutrition information for the dressing"],"ans":0,"assigned":false,"ch":5,"tp":"label","why":"Food packaged on-site for retail sale must list the source of each major food allergen it contains.","kn":"Knowing the required retail label item: the source of each major allergen. Preparation instructions, storage advice and nutrition information are not the required item.","note":"Same question as DT-27.","ansText":"A. Source of major food allergens in the dressing","img":false,"web":true},{"id":"MT-04","src":"Mock ServSafe Test","no":"Q4","type":"mc","q":"When receiving a delivery of food for an operation, it is important to","opts":["inspect all food immediately before storing it.","stack the delivery neatly and inspect it within 12 hours.","store it immediately and inspect it later.","inspect only the TCS food."],"ans":0,"assigned":false,"ch":5,"tp":"recvpack","why":"Deliveries must be inspected right away and then stored quickly in the correct areas.","kn":"Knowing that every delivery is inspected immediately, before storage. Delaying the inspection or checking only the TCS food is the trap.","ansText":"A. inspect all food immediately before storing it.","img":false,"web":true},{"id":"MT-05","src":"Mock ServSafe Test","no":"Q5","type":"mc","q":"Ready-to-eat TCS food must be date marked if it will be stored for longer than","opts":["36 hours","24 hours","12 hours","48 hours"],"ans":1,"assigned":false,"ch":5,"tp":"label","why":"Ready-to-eat TCS food prepared on-site and held longer than 24 hours must be date marked.","kn":"Recalling the 24-hour trigger for date marking. 12, 36 and 48 hours are distractors.","note":"Same question as KH-12.","ansText":"B. 24 hours","img":false,"web":true},{"id":"MT-06","src":"Mock ServSafe Test","no":"Q6","type":"mc","q":"What is the minimum internal cooking temperature for salmon?","opts":["135°F (57°C)","145°F (63°C) for 15 seconds","165°F (74°C) for <1 second","155°F (68°C) for 17 seconds"],"ans":1,"assigned":false,"ch":6,"tp":"cooktemp","why":"Seafood, including salmon, must reach 145°F (63°C) for 15 seconds.","kn":"Matching seafood to 145°F for 15 seconds. 155°F is for ground meat and 165°F for poultry.","note":"Same question as DT-36.","ansText":"B. 145°F (63°C) for 15 seconds","img":false,"web":true},{"id":"MT-07","src":"Mock ServSafe Test","no":"Q7","type":"mc","q":"Wheezing and hives are symptoms of","opts":["Norovirus.","botulism.","hepatitis A.","food allergies."],"ans":3,"assigned":false,"ch":2,"tp":"allergen","why":"Wheezing and hives are signs of an allergic reaction.","kn":"Recognizing allergic-reaction symptoms. Norovirus and hepatitis A cause vomiting, diarrhea or jaundice, and botulism causes neurological symptoms.","ansText":"D. food allergies.","img":false,"web":true},{"id":"MT-08","src":"Mock ServSafe Test","no":"Q8","type":"mc","q":"Which food item may be handled with bare hands?","opts":["Canned tuna for sandwiches","Cooked pasta for salad","Pickled watermelon for garnish","Chopped potatoes for soup"],"ans":3,"assigned":false,"ch":3,"tp":"gloves","why":"Food that will be cooked, like chopped potatoes going into soup, may be handled with bare hands. Ready-to-eat food needs gloves or utensils.","kn":"Telling ready-to-eat food (no bare hands) from food that will be cooked. Canned tuna, cooked pasta and a pickled garnish are all ready to eat.","note":"Similar to DT-34.","ansText":"D. Chopped potatoes for soup","img":false,"web":true},{"id":"MT-09","src":"Mock ServSafe Test","no":"Q9","type":"mc","q":"A manager can ensure employees are following their training by","opts":["reviewing the most current regulatory inspection report.","having them complete a written assessment.","asking them if they can do what they were trained to do.","monitoring them."],"ans":3,"assigned":true,"wrongPick":2,"ch":1,"tp":"mgr","conf":"high","why":"Managers make sure training is followed by monitoring employees. DT-11 asks the same question and its key answer is “monitoring them.”","kn":"Knowing that monitoring confirms employees follow their training. Asking them or giving a written test only checks what they say or know, not what they do.","note":"Same question as DT-11.","ansText":"D. monitoring them.","img":false,"web":true},{"id":"MT-10","src":"Mock ServSafe Test","no":"Q10","type":"mc","q":"What is the best way to eliminate pests that have entered the operation?","opts":["Raise the heat in the operation after-hours.","Work with a licensed pest control operator (PCO).","Lower the heat in the operation after-hours.","Apply over-the-counter pesticides around the operation."],"ans":1,"assigned":false,"ch":9,"tp":"pest","why":"Pests that get in should be eliminated by a licensed pest control operator (PCO).","kn":"Knowing that a licensed PCO deals with pests. Changing the building’s temperature or using over-the-counter pesticides is unsafe or ineffective.","ansText":"B. Work with a licensed pest control operator (PCO).","img":false,"web":true},{"id":"MT-11","src":"Mock ServSafe Test","no":"Q11","type":"mc","q":"When pouring sanitizer from its original container into a spray bottle, the spray bottle must be labeled with the","opts":["expiration date of the chemical.","name of the person who transferred the chemical.","common name of the chemical.","date the chemical was transferred."],"ans":2,"assigned":false,"ch":10,"tp":"program","why":"A working container must be labeled with the common name of the chemical.","kn":"Recalling the label rule for working containers: the chemical’s common name. Dates and names of the person aren’t required.","note":"Same idea as DT-63.","ansText":"C. common name of the chemical.","img":false,"web":true},{"id":"MT-12","src":"Mock ServSafe Test","no":"Q12","type":"mc","q":"Which item is stored correctly in the cooler?","opts":["Macaroni salad stored above raw salmon","Raw ground pork stored below raw poultry","Raw poultry stored above raw pork roast","Sliced pineapple stored below raw steaks"],"ans":0,"assigned":false,"ch":5,"tp":"storage","why":"Ready-to-eat food (macaroni salad) goes above raw seafood, and raw poultry goes on the bottom.","kn":"Applying cooler storage order. Each trap puts a food above one with a lower cooking temperature, or ready-to-eat food below raw meat.","note":"Same question as KH-13.","ansText":"A. Macaroni salad stored above raw salmon","img":false,"web":true},{"id":"MT-13","src":"Mock ServSafe Test","no":"Q13","type":"mc","q":"To make sure that the chemical sanitizer being used on a food-prep surface is at the correct strength, the manager should","opts":["test the surface first to confirm that there are no pathogens.","use a test kit to check the sanitizer’s concentration when mixing it.","heat it to the temperature recommended by the manufacturer.","rinse it from the surface and then apply it a second time."],"ans":1,"assigned":false,"ch":10,"tp":"agents","why":"Use a test kit to check sanitizer concentration when mixing it and regularly while it is in use.","kn":"Knowing that a test kit checks sanitizer strength. Testing the surface, heating the sanitizer or applying it twice doesn’t confirm its concentration.","ansText":"B. use a test kit to check the sanitizer’s concentration when mixing it.","img":false,"web":true},{"id":"MT-14","src":"Mock ServSafe Test","no":"Q14","type":"mc","q":"A broken water main has caused the water in an operation to appear brown. What should the manager do?","opts":["Use the water for everything except dishwashing.","Contact the local regulatory authority before use.","Use the water for everything except handwashing","Boil the water for 1 minute before use"],"ans":1,"assigned":false,"ch":9,"tp":"emerg","why":"Brown water from a broken water main is a water supply emergency; contact the local regulatory authority before using the water.","kn":"Recognizing a contaminated water supply as an imminent health hazard. Using the water for some tasks or boiling it on your own judgment are the traps.","ansText":"B. Contact the local regulatory authority before use.","img":false,"web":true},{"id":"MT-15","src":"Mock ServSafe Test","no":"Q15","type":"mc","q":"How high should floor-mounted equipment be from the floor?","opts":["At least 2 inches (5 centimeters)","At least 6 inches (15 centimeters)","At least 1 inch (3 centimeters)","At least 4 inches (10 centimeters)"],"ans":1,"assigned":false,"ch":9,"tp":"design","why":"Floor-mounted equipment must be at least 6 inches (15 centimeters) off the floor or sealed to it.","kn":"Recalling the 6-inch rule for floor-mounted equipment. 4 inches is the rule for tabletop equipment on legs, a common mix-up.","ansText":"B. At least 6 inches (15 centimeters)","img":false,"web":true},{"id":"MT-16","src":"Mock ServSafe Test","no":"Q16","type":"mc","q":"Using one set of cutting boards for raw poultry and another set of cutting boards for ready-to-eat food reduces the risk of","opts":["cross-contamination.","time-temperature abuse.","physical contamination.","toxic-metal poisoning."],"ans":0,"assigned":false,"ch":4,"tp":"xcontam","why":"Separate cutting boards for raw poultry and ready-to-eat food keep pathogens from raw food away from food that won’t be cooked.","kn":"Linking separate equipment to preventing cross-contamination. Time-temperature abuse and physical contamination are different hazards.","note":"Same question as KH-02.","ansText":"A. cross-contamination.","img":false,"web":true},{"id":"MT-17","src":"Mock ServSafe Test","no":"Q17","type":"mc","q":"To work with food, a food handler with an infected hand wound must","opts":["cover the wound with an impermeable cover and wear a single-use glove.","wash hands and bandage the wound with an impermeable cover.","cover the wound with an impermeable cover and limit contact with food.","apply ointment and bandage the wound with an impermeable cover."],"ans":0,"assigned":false,"ch":3,"tp":"handwash","why":"An infected hand wound must be covered with an impermeable cover, such as a bandage or finger cot, and a single-use glove.","kn":"Knowing the two-layer rule for hand wounds: an impermeable cover plus a single-use glove. Limiting food contact or bandaging alone is not enough.","note":"Similar to DT-19.","ansText":"A. cover the wound with an impermeable cover and wear a single-use glove.","img":false,"web":true},{"id":"MT-18","src":"Mock ServSafe Test","no":"Q18","type":"mc","q":"What is needed to operate a food establishment?","opts":["A crisis management plan","A variance from the regulatory authority","A HACCP program","A permit to operate"],"ans":3,"assigned":false,"ch":9,"tp":"design","why":"A food establishment needs a permit to operate from the regulatory authority.","kn":"Knowing the permit to operate is always required. HACCP plans and variances are needed only in specific situations.","note":"Same question as DT-03.","ansText":"D. A permit to operate","img":false,"web":true},{"id":"MT-19","src":"Mock ServSafe Test","no":"Q19","type":"mc","q":"Utensils that are used continuously must be cleaned and sanitized at least once every ___ hours.","opts":["three","two","six","four"],"ans":3,"assigned":false,"ch":10,"tp":"howclean","why":"Items in constant use must be cleaned and sanitized at least every four hours.","kn":"Recalling the four-hour rule for utensils and equipment in constant use. Two, three and six hours are distractors.","note":"Same question as DT-55.","ansText":"D. four","img":false,"web":true},{"id":"MT-20","src":"Mock ServSafe Test","no":"Q20","type":"mc","q":"Which action could contaminate food at a self-service area?","opts":["Allowing customers to reuse plates","Keeping hot TCS food at 135°F (57°C)","Labeling all containers and handles","Taking food temperatures every hour"],"ans":0,"assigned":false,"ch":7,"tp":"selfsvc","why":"Customers must not reuse plates at a self-service area; they need clean plates for return trips.","kn":"Spotting the self-service hazard: reused plates carry pathogens back to the food. The other three options are correct practices.","ansText":"A. Allowing customers to reuse plates","img":false,"web":true},{"id":"MT-21","src":"Mock ServSafe Test","no":"Q21","type":"mc","q":"Unpasteurized dairy products are commonly linked with what type of food?","opts":["Listeria","Bacillus cereus","Salmonella Typhi","Vibrio vulnificus"],"ans":0,"assigned":true,"wrongPick":1,"ch":2,"tp":"big6","conf":"high","why":"Listeria monocytogenes is linked with unpasteurized dairy products, raw meat and ready-to-eat deli food.","kn":"Linking pathogens to foods: Listeria with unpasteurized dairy. Bacillus cereus is best known for cooked rice dishes, Salmonella Typhi for ready-to-eat food and beverages, and Vibrio vulnificus for raw oysters.","note":"The question says “what type of food” but means which pathogen; all four options are pathogens.","ansText":"A. Listeria","img":false,"web":true},{"id":"MT-22","src":"Mock ServSafe Test","no":"Q22","type":"mc","q":"Which TCS food is being cooled correctly?","opts":["Chicken pot pie is placed in a freezer.","A beef roast is loosely covered and placed on the top shelf in the cooler.","Minestrone soup is stirred w
